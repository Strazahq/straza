# INVALID: a draft never carries a secret, and here an environment entry
# whose name marks a secret holds its value. The bundle reader keeps the
# App, and the intake check refuses it with secret.value before anything is
# stored. The value is a sample written for this file. The server takes its
# secret through credential.inject and strazactl apps secret set instead.
# Provenance: derived from this spec's revision 5 note and spec/app-manifest,
# not captured from a live wire. TestBundleFixtures reads it.
---
apiVersion: straza.dev/v1beta1
kind: App
metadata:
  name: ticket-tools
server:
  name: example/ticket-tools
  version: "1.0.0"
straza:
  runtime:
    kind: command
    command:
      exec: /usr/local/bin/ticket-tools-mcp
      env:
        - name: TICKETS_API_KEY
          value: s3cret-2026
