# Golden import of obsidian-github-mcp.server.json (SPEC.md §5): a
# streamable-http remote wins runtime selection; its isSecret Authorization
# header becomes a static credential whose template replaces the registry
# {placeholder} with {{secret}}.
apiVersion: straza.dev/v1beta1
kind: App
metadata:
  name: hint-services-obsidian-github-mcp
  namespace: ai.smithery
server:
  $schema: https://static.modelcontextprotocol.io/schemas/2025-09-29/server.schema.json
  name: ai.smithery/Hint-Services-obsidian-github-mcp
  description: Connect AI assistants to your GitHub-hosted Obsidian vault to seamlessly access, search, and analyze your knowledge base.
  repository:
    url: https://github.com/Hint-Services/obsidian-github-mcp
    source: github
  version: "0.4.0"
  remotes:
    - type: streamable-http
      url: https://server.smithery.ai/@Hint-Services/obsidian-github-mcp/mcp
      headers:
        - description: Bearer token for Smithery authentication
          isRequired: true
          value: Bearer {smithery_api_key}
          isSecret: true
          name: Authorization
straza:
  runtime:
    kind: remote
    remote:
      url: https://server.smithery.ai/@Hint-Services/obsidian-github-mcp/mcp
      auth: inject
  credential:
    kind: static
    inject:
      as: header
      name: Authorization
      template: "Bearer {{secret}}"
