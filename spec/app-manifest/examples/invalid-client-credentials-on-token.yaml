# INVALID: credential.agents client_credentials asks the provider named
# under oauth.provider for each agent's token, so it is only valid with kind
# oauth (revision 5). A token server names no provider.
apiVersion: straza.dev/v1beta1
kind: App
metadata:
  name: badclients
server:
  name: example/badclients
  version: "1.0.0"
straza:
  runtime:
    kind: remote
    remote:
      url: https://example.com/mcp
  credential:
    kind: token
    agents: client_credentials
    inject:
      as: header
      name: Authorization
      template: "Bearer {{secret}}"
