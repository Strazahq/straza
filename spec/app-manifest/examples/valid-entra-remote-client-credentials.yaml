# An agent's own Entra agent identity (revision 10): people sign in to the
# CRM MCP server through the provider named entra-crm, and an agent with no
# stored sign-in runs on a token of its own Entra agent identity there. The
# operator's config for entra-crm names the agent identity blueprint, the
# tenant's token endpoint and the resource scope, and the agent's Straza
# record names its Entra agent identity. The manifest names the provider
# only, exactly as for any other provider.
# Provenance: derived from revision 10's text and the reference parser in
# internal/manager, not fired against a live platform: [doc].
apiVersion: straza.dev/v1beta1
kind: App
metadata:
  name: crm
  description: CRM MCP server, each person's own sign-in and each agent's own Entra agent identity
server:
  name: com.example/crm-mcp-server
  version: "1.0.0"
straza:
  runtime:
    kind: remote
    remote:
      url: https://crm-mcp.example.com/mcp
  credential:
    kind: oauth
    agents: client_credentials
    oauth:
      provider: entra-crm
    inject:
      as: header
      name: Authorization
      template: "Bearer {{secret}}"
