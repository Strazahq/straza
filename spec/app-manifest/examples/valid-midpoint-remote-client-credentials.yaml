# An agent's own client at the provider (revision 5): people sign in to the
# midPoint MCP server through the provider named keycloak, and an agent with
# no stored sign-in runs on a token of its own client there, which the
# gateway gets with the client credentials grant and an assertion it signs.
# The manifest names the provider only. The token endpoint, the assertion
# audience and the scopes come from the operator's config for that provider.
# Provenance: a manifest of this shape, under another name and with the eval
# stack's upstream address, was installed on the eval stack at 598bef82 on
# 2026-09-21 and served an agent's calls: [live].
apiVersion: straza.dev/v1beta1
kind: App
metadata:
  name: midpoint
  description: midPoint MCP server, each person's own sign-in and each agent's own client
server:
  name: dev.straza/midpoint-mcp-server
  version: "1.0.0"
straza:
  runtime:
    kind: remote
    remote:
      url: https://midpoint-mcp.example.com/mcp
  credential:
    kind: oauth
    agents: client_credentials
    oauth:
      provider: keycloak
    inject:
      as: header
      name: Authorization
      template: "Bearer {{secret}}"
