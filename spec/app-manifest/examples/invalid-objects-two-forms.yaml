# Invalid: a tool's reach is one word, all, none or credential, or the
# mapping {argument: <name>}, never both in one mark (revision 7).
apiVersion: straza.dev/v1beta1
kind: App
metadata:
  name: ghapp
server:
  name: com.example/github-app
  version: "0.4.0"
straza:
  runtime:
    kind: remote
    remote:
      url: https://ghapp.example.com/mcp
  objects:
    type: repo
    list:
      tool: repo_list
    tools:
      pr_create: {argument: repo, reach: all}
