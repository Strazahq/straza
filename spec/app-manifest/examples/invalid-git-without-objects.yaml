# Invalid: a git block needs an objects block beside it (revision 9),
# because each git grant names one repo from the server's object list and
# Straza decides it as a call that names that repo. Add an objects block
# that pins git_fetch and git_push to {argument: repo}.
apiVersion: straza.dev/v1beta1
kind: App
metadata:
  name: ghapp
server:
  name: com.example/github-app
  version: "0.5.0"
straza:
  runtime:
    kind: remote
    remote:
      url: https://ghapp.example.com/mcp
  git:
    url: https://ghapp.example.com
    upstream: https://github.com
    ops:
      fetch: git_fetch
      push: git_push
