# INVALID: mode confirm may not set approve.roles (revision 11). The
# requester is the sole decider; a decider pool under confirm is an
# authoring mistake, rejected rather than ignored.
apiVersion: straza.dev/v1beta1
kind: PolicySet
metadata:
  name: confirm-with-roles
spec:
  rules:
    - id: r1
      tools: [mcp.call]
      apps: [github]
      toolNames:
        allow: ["create_pull_request"]
      effect: allow
      mode: confirm
      approve:
        roles: [sec-approvers]
