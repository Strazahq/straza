# VALID: mode confirm (revision 11), bare and with the shared knob block.
# The requester is the sole decider; no pool fields appear (they are
# rejected, see the invalid-confirm-* twins).
apiVersion: straza.dev/v1beta1
kind: PolicySet
metadata:
  name: confirm-examples
  description: "Requester-confirmation gates (revision 11): sudo posture, no decider pool"
spec:
  match:
    roles: [idm-dev]
  rules:
    - id: pr-create-needs-confirmation
      events: [tool.pre]
      tools: [mcp.call]
      apps: [github]
      toolNames:
        allow: ["create_pull_request"]
      effect: allow
      mode: confirm
      reason: "PR creation runs after you confirm it"
    - id: deploy-confirm-with-knobs
      tools: [shell.exec]
      command:
        allowPatterns: ["deploy-stage*"]
      effect: allow
      mode: confirm
      approve:
        timeoutSeconds: 300      # shared knob block applies; pool fields do not
        retryTTLSeconds: 120
        notify: [push]
      reason: "stage deploys run after you confirm on your phone"
