openapi: "3.1.0"
info:
  title: Straza platform API
  version: 0.140.0
  description: >
    Control-plane API of strazad. This document is the source of
    truth for the /v1 wire surface AND the unauthenticated infra and discovery
    routes (/healthz, /readyz, /version, /.well-known/straza/*). /version
    carries the approver pin block that phones and straza doctor read, and
    the .well-known documents carry the JWKS and snapshot-signing keys
    enrolling clients pin, so they are contract. internal/server has two
    drift tests that fail the build when routes and paths diverge
    (TestOpenAPIMatchesRoutes for /v1, TestOpenAPIMatchesInfraRoutes for the
    rest of the route table). OIDC issuer endpoints (standalone profile,
    /oidc/*) and the surfaces outside /v1 (/metrics, /console, /mcp, /scim/v2)
    remain out of scope: the SCIM contract is spec/scim-profile.
    The built-in `straza` MCP server (approval_request, approval_status and
    approval_await, and draft_submit and draft_status for holders of
    straza-draft-config, whose schemas are DraftSubmit and DraftAgentStatus
    below) is served as JSON-RPC tools on the /mcp gateway, NOT as REST
    routes, so no /v1 paths are added for it.

tags:
  - name: Health and discovery
    description: Probes and discovery documents that every client reads before it authenticates.
  - name: Enrollment and check-in
    description: A client enrolls its device here, starts a session, and fetches the signed policy snapshot, the managed harness config and the push stream.
  - name: Decisions and audit ingest
    description: The server decision endpoint and the ingest of client-spooled audit events.
  - name: The calling user
    description: "What a signed-in person reads and does about themself: identity, OAuth connections and approver enrollment."
  - name: Users and devices
    description: Users, their enrolled devices, locks and the revocation rows the kill switch writes.
  - name: Roles, assignments and knowledge packs
    description: Roles with the roles they compose, the assignments that give a person a role and the knowledge packs attached to them.
  - name: PolicySets
    description: Stored PolicySets, with validation, simulation and activation into the signed snapshot.
  - name: Drafts
    description: Drafts of changes to MCP servers, roles, access rows and policy sets, stored, checked against live state and published whole by a person.
  - name: Apps, tools and bindings
    description: MCP servers, the tools they expose, the access rows that give roles access to them, their static secrets and the OAuth providers they use.
  - name: Sessions and transcripts
    description: Agent sessions, the kill switch and the recorded conversations.
  - name: Approvals
    description: Approval records, the decide routes, the notification channels and the enrollment of approver devices.
  - name: The approver surface
    description: "Routes for the Straza approver app and the self-service page in a browser: enrollment, token refresh, pending records, decisions and push routes."
  - name: Audit, sinks and the change feed
    description: The hash-chained audit ledger, sink delivery health and the cursored change feed for identity manager connectors.
  - name: Admin API tokens
    description: Long-lived admin API tokens for automation and identity manager connectors.
  - name: Attestation hashes
    description: The expected-measurement registry for managed installs.
  - name: Overview and configuration
    description: Dashboard aggregates for the console and the redacted effective configuration.

paths:
  /healthz:
    get:
      operationId: healthz
      tags: ["Health and discovery"]
      summary: Liveness probe (no auth, no dependencies dialed)
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
  /readyz:
    get:
      operationId: readyz
      tags: ["Health and discovery"]
      summary: Readiness probe, pings store and bus (3 s bound)
      responses:
        "200":
          description: All components ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
        "503":
          description: One or more components degraded, same body with per-component errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyStatus" }
  /version:
    get:
      operationId: version
      tags: ["Health and discovery"]
      summary: Build/profile stamp plus the approver pin block (contract-bearing)
      description: >
        Unauthenticated by design; everything here is public by construction.
        `approver` is present only when strazad itself terminates approver TLS
        (dedicated listener or pinned main listener); behind an ingress it is
        absent, matching the "pin follows the host" rule. `straza doctor` and
        the console read it; treat field removals as breaking.
      responses:
        "200":
          description: Version and profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionStatus" }
  /.well-known/straza/jwks.json:
    get:
      operationId: jwks
      tags: ["Health and discovery"]
      summary: Token-verification JWKS (Cache-Control max-age=60)
      responses:
        "200":
          description: JWK set for session/device token verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { type: object } }
        "500": { $ref: "#/components/responses/Error" }
  /.well-known/straza/snapshot-keys.json:
    get:
      operationId: snapshotKeys
      tags: ["Health and discovery"]
      summary: Policy-snapshot signing keys clients pin at enroll (Cache-Control max-age=60)
      responses:
        "200":
          description: Ed25519 public keys, base64 std encoding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotKeys" }
  /.well-known/straza/client-assertion-jwks.json:
    get:
      operationId: clientAssertionJwks
      tags: ["Health and discovery"]
      summary: Public keys of the client assertion key, the JWKS URL of every agent's client at the identity provider (Cache-Control max-age=30)
      description: >
        A plain RFC 7517 key set (0.111.0). Every key is RSA and carries
        exactly kty, n, e, kid, alg RS256 and use sig. The set holds the
        staged, the active and the retiring key, so a new key is published
        two reload intervals before it signs and an old key stays until every
        assertion it signed has expired. The set is empty until an
        administrator creates the first key. The route takes no input, reads
        no store and answers GET only. A replica that has not read its key
        store for three reload intervals answers 503 with Cache-Control
        no-store and no key set.
      responses:
        "200":
          description: JWK set for verifying client assertions that Straza signs
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { type: object } }
                required: [keys]
        "503": { $ref: "#/components/responses/Error" }
  /.well-known/straza/idp.json:
    get:
      operationId: idpDiscovery
      tags: ["Health and discovery"]
      summary: Login discovery, which issuer a client authenticates against
      responses:
        "200":
          description: >
            Issuer and client id. Standalone profile: strazad's own publicUrl
            issuer with empty client_id. Enterprise: the configured external
            OIDC issuer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdPDiscovery" }
        "503":
          description: Enterprise profile with no oidc.issuer configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
  /v1/enroll:
    post:
      operationId: enroll
      tags: ["Enrollment and check-in"]
      summary: Enroll an authenticated identity on a device
      requestBody:
        description: "The identity token from the sign-in, the device that is enrolling and the kind of client that holds the credential. A user typed agent or service is refused a human credential with 403."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollRequest" }
      responses:
        "200":
          description: Enrolled (idempotent per device fingerprint)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/checkin:
    post:
      operationId: checkin
      tags: ["Enrollment and check-in"]
      summary: Start or refresh a session; returns session token and packs
      requestBody:
        description: "One credential (an id token, device token or session token) plus the device, harness and attestation the client reports. Since 0.114.0 the harness names strazactl, console and self-service open a session only on a device enrolled with client_kind human and only for a person, and every other harness name only on a kit device; a mismatch is refused with 403 before the attestation minimum is judged."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinRequest" }
      responses:
        "200":
          description: Session token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckinResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/decide:
    post:
      operationId: decide
      tags: ["Decisions and audit ingest"]
      summary: Evaluate one canonical event against the caller's session and return the decision
      security: [{ sessionBearer: [] }]
      requestBody:
        description: "The canonical event to decide and, for a delegate, the agent type and id the harness attributed it to."
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { $ref: "#/components/schemas/CanonicalEvent" }
                agentType:
                  type: string
                  description: The delegate kind the harness attributed the call to, absent for the main agent; it lands on the server's audit record.
                agentId:
                  type: string
                  description: The delegate instance id, absent for the main agent.
              required: [event]
      responses:
        "200":
          description: >
            Decision (allow/deny). Revoked sessions receive a deny, not a 401.
            An event whose kind is not one of the nine canonical kinds is a
            deny in every profile, and its reason lists the known kinds. A
            tool.pre or permission.request event that no rule matches and
            whose tool is not mcp.call takes governance.localToolDefault
            whatever its tool, a tool outside the canonical taxonomy and no
            tool included, so it is a deny where localToolDefault is deny,
            the enterprise default. For a tool outside the taxonomy or no
            tool, the reason lists the known tools. A body with no
            event.kind is still a 400.
            Since 0.65.0 a pod that holds no checked-in state for the session
            (fresh restart, or another pod in a multi-pod deployment) answers
            401 "session state expired" instead of evaluating a role-less
            stand-in subject: the client re-checks in with the same session
            token and retries once (the same bounce the MCP gateway uses).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/audit/batch:
    post:
      operationId: auditBatch
      tags: ["Decisions and audit ingest"]
      summary: Ingest a batch of client-spooled audit events (straza drain)
      security: [{ sessionBearer: [] }]
      requestBody:
        description: "The client-spooled audit records to ingest. A record's data.session names the session that decided it, which can be an earlier session of the caller's user on the caller's device."
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events: { type: array, items: { type: object } }
      responses:
        "200":
          description: >
            The count of records stored and the count refused. A record keeps
            the session it names in data.session only when that session belongs
            to the caller's user and device, and a record that names no session
            takes the caller's. Any other record is refused, left out of the
            chain and logged, and so is every record that names a new session
            once a batch has named 1000 sessions other than the caller's. The
            batch still answers 200, because the client spool deletes a batch on
            any 2xx and would otherwise resend it forever.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer, description: "The number of records stored for the audit chain." }
                  refused: { type: integer, description: "The number of records refused because the session they name is not a UUID, is unknown, belongs to another user or another device, or is past the cap of 1000 named sessions. An older client ignores it." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: >
            Ingest rate limited or backlog at capacity. RETRYABLE: the client
            spool keeps the batch on disk and retries the next drain; it must
            never treat this as a drop. The two conditions share the code and
            differ only in the error string.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        "503":
          description: >
            Audit store unavailable, or a session a record names could not be read. RETRYABLE, same spool contract as 429.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /v1/admin/audit:
    get:
      operationId: listAudit
      tags: ["Audit, sinks and the change feed"]
      summary: Fetch hash-chained audit records after a sequence number
      security: [{ adminBearer: [] }]
      parameters:
        - { name: after, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - name: q
          in: query
          description:
            Case-insensitive substring matched server-side against the raw
            CE text, applied before the limit so a page is a page of
            matches and the after-cursor walks matches.
          schema: { type: string }
        - name: effect
          in: query
          description:
            Narrow to records whose data.effect equals this value; records
            carrying no decision effect (admin, identity, recording) are
            excluded. Applied server-side before the limit, composes with q.
          schema: { type: string, enum: [allow, deny] }
      responses:
        "400": { description: effect was neither allow nor deny }
        "200":
          description: Audit records
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    seq: { type: integer }
                    ce: { type: string }
                    prevHash: { type: string }
                    hash: { type: string }
                    username:
                      type: string
                      description: >-
                        Read-time envelope enrichment (not part of the
                        hash-covered CE bytes): resolved username of the
                        record's data.user, falling back to the attributed
                        admin actor.
                    decidedByUsername:
                      type: string
                      description: >-
                        Read-time envelope enrichment for approval records:
                        resolved username of data.decidedBy, so the ledger
                        can say who decided. Omitted when the CE carries no
                        decidedBy.

  /v1/admin/apps:
    get:
      operationId: listApps
      tags: ["Apps, tools and bindings"]
      summary: List MCP servers with live manager status
      description: >
        Under an area scope the list is every server and every row reads
        may_change true. A session with no apps scope that holds the admin
        role of one or more servers (0.104.0) sees those servers only, and
        each row says whether the caller may change it. The server-scoped
        verbs are installApp for a change to a listed server, removeApp,
        appLogs, recheckApp, enableApp, disableApp and the secrets routes;
        a server admin posting a new name, or naming a server they do not
        administer, is refused with 403 and the role they would need.
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Apps
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/App" }
    post:
      operationId: installApp
      tags: ["Apps, tools and bindings"]
      summary: Install or update an MCP server from a raw app.yaml manifest
      description: >
        Since 0.86.0 an oauth-kind manifest naming a provider this server has
        no oauth.providers entry for is refused with 422 and a sentence that
        names the provider, the config key and the configured alternatives.
        Since 0.123.0 a server that a file in the watched apps directory
        names takes a change here like any other, because the file proposes
        drafts and owns nothing; listApps names that file. A change to a
        paused server
        (0.98.0) stores the new manifest, version and source and leaves the
        server stopped and paused: the answer is the stored row with status
        stopped and paused true, and enableApp starts the server with that
        manifest. A successful install emits straza.audit.admin action
        apps.install with the actor, the server and the runtime. The record also
        carries update (0.98.0), true when a live server of that name existed
        before the install, and on an update changed: the sorted dot-joined
        manifest paths that differ from the stored manifest, for example
        straza.runtime.remote.url, straza.limits.rps or metadata.description.
        An array counts as one path, the free-form server block counts as the
        one path server, a block that appears or goes is named by the paths
        of its leaves (adding limits.rps to a manifest with no limits block
        reads straza.limits.rps), an empty block keeps its own path, and an
        identical manifest writes no record at all (0.120.0). The record names paths
        only, never a value, because an address can carry a token; changed
        is absent when the two manifests cannot be compared. The record is
        written whenever the row is stored, also when the runtime then fails
        to start and the answer is 500. Since 0.120.0 an install is
        published as a one-item draft of the api door by the caller, and
        its records carry the draft's id in draft. The manifest passes the
        drafts intake first: a body holding two documents, a secret-shaped
        value, or a value Straza masked for display at a place where the
        live manifest holds no value, answers 422 with the intake's sentence
        and fix, and nothing is stored. A masked value at a place the live
        manifest still masks is kept as the stored value, with a warning in
        the minted draft's check. A manifest equal to the stored one answers
        201, restarts nothing and writes nothing, no draft and no
        apps.install.
        With dryRun=1 the body is validated and nothing installs: the
        answer is what the manifest declares (name,
        runtime, credential kind, exposed tools), the same parser strazactl
        spec validate runs.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: dryRun, in: query, schema: { type: string, enum: ["1"] }, description: "Validate only, install nothing (0.86.0)." }
      requestBody:
        description: "The MCP server manifest to install or update, as YAML text in the app.yaml shape."
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200":
          description: Dry run passed; what the manifest declares
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  runtime: { type: string, enum: [command, remote, oci] }
                  credential: { type: string, enum: [none, static, oauth, token] }
                  tools: { type: array, items: { type: string }, description: "The manifest's exposure globs" }
        "201":
          description: Server installed or changed; a paused server answers its stored row, stopped with paused true (0.98.0)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "409":
          description: >
            The change did not land as DirectConflict says (0.120.0). Until
            0.123.0 a server a file in the watched apps directory defined
            was refused here too.
          content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/DirectBusy" }
  /v1/admin/apps/import:
    post:
      operationId: importApp
      tags: ["Apps, tools and bindings"]
      summary: Convert an MCP registry server.json into an app.yaml manifest without installing it
      description: >
        The same conversion strazactl apps import runs, server-side, for the
        console's registry card. Nothing is installed; the caller posts the
        returned manifest to installApp.
      security: [{ adminBearer: [] }]
      requestBody:
        description: "An MCP registry server.json document to convert into an MCP server manifest; nothing is installed."
        required: true
        content:
          application/json:
            schema: { type: object, description: "A registry server.json record" }
      responses:
        "200":
          description: The converted manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  manifest: { type: string, description: "app.yaml text" }
                  name: { type: string }
                  runtime: { type: string, enum: [command, remote, oci] }
        "422": { $ref: "#/components/responses/Error" }
  /v1/admin/apps/{id}:
    delete:
      operationId: removeApp
      tags: ["Apps, tools and bindings"]
      summary: Stop and remove an MCP server by id or name
      description: >
        Since 0.86.0 the row is soft-deleted (it leaves listApps and the name
        can be installed again), and straza.audit.admin action apps.remove
        records the actor, the server and the roles that lost access. Since
        0.104.0 the server's admin role goes with it, memberships
        included, one roles.unassign record per holder with the reason
        "server removed", and apps.remove names the role under adminRole.
        Since 0.106.0 every role the server owns goes the same way, each
        ending with a roles.delete record that names the server.
        Removal stays with an apps scope (0.105.0): the holder of the
        server's admin role may pause and change it but never remove it,
        because removal also deletes the office, and answers 403. Since
        0.93.0 the server's access rows and every credential row are deleted
        with it, the per-user OAuth connections included, so a server installed
        again under the same name starts with none. Since 0.123.0 a server
        that a file in the watched apps directory names is removed here like
        any other, because the file proposes drafts and owns nothing.
        Since 0.120.0 the removal is published as a one-item draft of the
        api door by the caller: the server, its roles, their memberships
        and every record commit together, and each record names the draft.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Server removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [removed] }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            The change did not land as DirectConflict says (0.120.0). Until
            0.123.0 a server a file in the watched apps directory defined
            was refused here too.
          content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } }
        "503": { $ref: "#/components/responses/DirectBusy" }
  /v1/admin/apps/{id}/bindings:
    post:
      operationId: createToolBinding
      tags: ["Apps, tools and bindings"]
      summary: Give a role access to an MCP server's tools (no access row means the tools are invisible; access admits, policy decides)
      description: >
        tools absent or ["*"] is the glob: every tool, including tools the
        server adds later. A list of names is the hand-picked set. Only
        application roles hold access: a business role (400, it composes
        application roles), an approver role (400) and a Straza role
        (400) are refused with a sentence naming the fix, and an unknown role
        answers 404 with the strazactl command that creates it. Since 0.106.0
        a server-owned role reaches only its owning server (409). Since
        0.138.0 only a global admin gives a server-owned role the every-tool
        matcher: the holder of a server's admin role who sends it, or sends
        no tools, answers 400. Since 0.138.0 a role that no server owns gains
        no access row, because a role that reaches a server belongs to that
        server: one with no row answers 409 with "<role> belongs to no MCP
        server, so it cannot be given access to <server>." and the way, a
        role of the server made in one call with POST /v1/admin/roles and
        server. The holder of a server's admin
        role gives access only for the roles their server owns (409), and not while
        anyone holds the role (409), because the holders were certified on
        its tool list. Since 0.107.0 an application role reaches one server:
        a role that already reaches another server answers 409 with "<role>
        already reaches <server>. An application role reaches one server:
        make a role for <this server> and compose both from a business
        role.", and the same server again answers 409 naming the existing
        row in binding_id, which the console opens for editing.
        Since 0.120.0 the row is published as a one-item draft of the api
        door by the caller, the role's live document with the row, so a
        secret-shaped value in the role's description answers 400 with the
        secret scan's sentence and fix.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        description: "The role to give access and the tools it may reach on this MCP server; absent tools or a lone * means every tool."
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string }
                tools: { type: array, items: { type: string } }
              required: [role]
      responses:
        "201":
          description: Access row created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolBinding" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/DirectConflict" }
        "503": { $ref: "#/components/responses/DirectBusy" }
  /v1/admin/tools:
    get:
      operationId: listTools
      tags: ["Apps, tools and bindings"]
      summary: Flat list of every exposed MCP tool across running servers, with upstream descriptions, for access certification
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Tools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tool" }
  /v1/admin/catalog/preview:
    get:
      operationId: previewCatalog
      tags: ["Apps, tools and bindings"]
      summary: Preview what a subject would see in the gateway catalog, per tool, with a status and reason (visible/approve_gated/hidden_policy/no_binding/matcher_miss/not_running)
      description: >
        Off-request-path admin diagnostic: resolves a subject and probes the
        active policy engine per exposed tool. The user lane resolves that
        user's roles from the store but leaves attestation, device
        certificate, and harness empty, so require-gated rules may differ from
        a live session. The role lane probes with only the given roles.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: role, in: query, schema: { type: array, items: { type: string } }, description: "Role name (repeatable); role lane. At least one of role/user is required. Role names need not exist yet: the engine matches names, which is the draft-role lane the console wizard uses." }
        - { name: user, in: query, schema: { type: string }, description: "Username; user lane. Resolves the user's roles from the store." }
        - { name: app, in: query, schema: { type: string }, description: "Restrict the preview to one MCP server by name." }
        - { name: assume, in: query, schema: { type: array, items: { type: string } }, description: "Hypothetical tool matchers (repeatable; each value may be a comma-separated list) merged into the subject's access rows for the FILTERED server before the probe, so a role with no access row (or one not yet created) gets per-tool policy truth instead of one no_binding row. Requires app; assume without app is a 400. Added in 0.70.0 for the role wizard's draft access-row preview." }
      responses:
        "200":
          description: >
            Per-tool visibility for the subject. Since 0.86.0 a tool a role reaches is
            probed with the granted fact (spec/policyset revision 17), so a
            tool no rule names reads visible with default true; the role lane
            resolves the composition closure like the user lane; a server a role reaches
            that is not running or has no known tools yields one
            not_running row carrying the probe reason; and every row carries
            a hint sentence.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: object
                    properties:
                      user: { type: string }
                      roles: { type: array, items: { type: string } }
                  notes:
                    type: array
                    items: { type: string }
                    description: "One sentence per role name in the role lane that is no role in Straza, since the preview is for a hypothetical subject. Absent when every name exists."
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        app: { type: string }
                        tool: { type: string, description: "Empty for server-level rows (no_binding, not_running)" }
                        status: { type: string, enum: [visible, approve_gated, hidden_policy, no_binding, matcher_miss, not_running] }
                        reason: { type: string, description: "The reason behind this tool-level outcome; empty when the rule states none. It is the rule's reason text for a deny, approve or allow, the engine's default sentence, or the probe reason on a not_running row." }
                        hint: { type: string, description: "One plain sentence saying what the status means for this subject and, where there is one, the set, rule, deciders and hold behind it. Always present." }
                        ruleId: { type: string, description: "The policy rule that produced this tool-level outcome; empty when no rule fired." }
                        setName: { type: string, description: "The policy set the rule lives in; empty when no rule fired." }
                        default: { type: boolean, description: "True when no rule mentions this call and the engine default applied, allow on a tool the role reaches. A different fact from a rule allowing or denying it on purpose." }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/bindings:
    get:
      operationId: listToolBindings
      tags: ["Apps, tools and bindings"]
      summary: List access rows, each giving one role tools on one MCP server
      description: >
        Every access row under an apps scope. Under the standing of a server's
        admin role the list holds the access rows of the caller's servers only
        (0.106.0).
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Access rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ToolBinding" }
  /v1/admin/bindings/{id}:
    delete:
      operationId: deleteToolBinding
      tags: ["Apps, tools and bindings"]
      summary: Delete an access row, so the role loses its access to that MCP server
      description: >
        Since 0.86.0 the deletion leaves straza.audit.admin action
        apps.binding.delete with the actor, the server, the role, the tools and
        the access row id, besides the apps.updated convergence hint. Since
        0.106.0 the holder of a server's admin role deletes the access rows of
        the roles their server owns, and not while anyone holds the role
        (409).
        Since 0.120.0 the deletion is published as a one-item draft of the
        api door by the caller, the role's live document without the row.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Binding deleted }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/DirectConflict" }
        "503": { $ref: "#/components/responses/DirectBusy" }
  /v1/admin/apps/{id}/secrets:
    post:
      operationId: setAppSecret
      tags: ["Apps, tools and bindings"]
      summary: Store a static secret for an MCP server, the server's own secret or one role's override (value never echoed; stored encrypted)
      description: >
        Without role the secret is the server's own (scope app): used for
        health checks and for every call whose roles hold no override. With
        role it is that role's override, preferred for calls the role's
        access row admitted. Refused with 400 when the manifest declares no
        credential or uses each caller's own sign-in (kind none or oauth), or
        when the role is a business, approver or Straza role; an
        unknown role answers 404 with the command that creates it. The
        response carries a fingerprint (the first four hex characters of the
        SHA-256 of the value), never the value.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        description: "The secret value to store and, for a role's override, the role it belongs to."
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, description: "Optional; absent stores the server's own secret." }
                value: { type: string }
              required: [value]
      responses:
        "201":
          description: Secret stored (ciphertext only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSecret" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      operationId: listAppSecrets
      tags: ["Apps, tools and bindings"]
      summary: List an MCP server's static secrets with fingerprints, the server's own row first
      description: >
        Only static rows are listed; oauth connections are per user and stay on
        /v1/connect. No read ever returns a value.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Secrets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppSecret" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAppSecret
      tags: ["Apps, tools and bindings"]
      summary: Remove the server's own secret
      description: >
        Emits straza.audit.admin action apps.secret.remove with the actor and
        the server, re-probes the server under what remains, and answers 404 with
        "no secret is stored for the MCP server X (the server's own secret)" when there
        is none.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Secret removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [deleted] }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/apps/{id}/secrets/{role}:
    delete:
      operationId: deleteAppRoleSecret
      tags: ["Apps, tools and bindings"]
      summary: Remove one role's secret override
      description: >
        Same record and re-probe as deleteAppSecret; 404 with "no secret is
        stored for the MCP server X (role Y)" when the role has none, and the unknown
        role sentence when the role does not exist.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: role, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Secret removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [deleted] }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/oauth/providers:
    get:
      operationId: listOAuthProviders
      tags: ["Apps, tools and bindings"]
      summary: List the oauth providers this server is configured with, never their client secrets
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Providers, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    scopes: { type: array, items: { type: string }, description: "Default scopes when a manifest declares none" }
                    redirect_uri: { type: string, description: "The callback to register at the provider" }
  /v1/admin/access/grant-only:
    get:
      operationId: listGrantOnlyAccess
      tags: ["Apps, tools and bindings"]
      summary: Access rows whose tools run on the access row alone, with no policy rule naming them
      description: >
        For every access row, the tools its matchers admit on the server's known
        inventory for which no rule fires when the engine evaluates the role
        alone. The check straza doctor prints after the upgrade that made an
        access row run without an allow rule (spec/policyset revision 17). Empty
        rows when every tool an access row admits is named by a rule.
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Rows sorted by role, then by server name
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        role: { type: string }
                        app: { type: string }
                        binding_id: { type: string }
                        tools: { type: array, items: { type: string } }
  /v1/admin/apps/{id}/health:
    post:
      operationId: recheckApp
      tags: ["Apps, tools and bindings"]
      summary: Trigger an immediate health probe for an MCP server (by id or name) and return the refreshed state
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Refreshed server state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "409": { description: "The server is stopped, nothing to probe; the error names the enable command (0.86.0)", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }
  /v1/admin/apps/{id}/enable:
    post:
      operationId: enableApp
      tags: ["Apps, tools and bindings"]
      summary: Resume an admin-paused or stopped MCP server from its persisted manifest (by id or name)
      description: >
        Clears the admin-pause marker and restarts the server exactly as a strazad
        boot would (persisted manifest). Idempotent: enabling a running server is a
        200 no-op. A corrupt stored manifest is a 500 with an actionable reason.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Refreshed server state (paused reflects the admin-pause marker)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /v1/admin/apps/{id}/disable:
    post:
      operationId: disableApp
      tags: ["Apps, tools and bindings"]
      summary: Admin-pause an MCP server, stopping it and keeping it stopped across GitOps ticks and restarts (by id or name)
      description: >
        Persists the admin-pause marker FIRST (a pause that cannot be persisted
        aborts), then stops the runtime. The row, registration and access rows are
        kept; the GitOps watcher will NOT re-install a paused server even across
        strazad restarts or manifest-file changes; only enable clears it.
        Idempotent: disabling an already-stopped server still records the pause.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Refreshed server state (paused true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/apps/{id}/logs:
    get:
      operationId: appLogs
      tags: ["Apps, tools and bindings"]
      summary: Fetch recent runtime log lines for an MCP server (by id or name)
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: >
            Log lines. Every address in a line reads as App.detail describes,
            and each credential shape redact knows reads [REDACTED]. On a line
            the draft secret scan flags, so does each shape of the scan's
            fuller battery. So does each value the scan flags in the stored
            manifest wherever a line holds it, with each line of 8 or more
            characters of such a value that spans lines (0.126.0). A value the
            scan does not flag prints as the server wrote it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { type: string }
                  lines: { type: array, items: { type: string } }
                  entries:
                    type: array
                    description: "The same lines, oldest first, each with the time the server received it."
                    items:
                      type: object
                      properties:
                        t: { type: string, format: date-time }
                        line: { type: string }
        "409": { description: "The server is not running (no log ring to read)", content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } } }

  /v1/admin/config:
    get:
      operationId: getEffectiveConfig
      tags: ["Overview and configuration"]
      summary: Effective security-layer configuration, redacted (console read-only panel)
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Redacted effective configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { type: string, enum: [standalone, enterprise] }
                  public_url: { type: string }
                  tls: { type: boolean }
                  store_driver: { type: string, enum: [sqlite, postgres] }
                  events:
                    type: object
                    properties:
                      embedded: { type: boolean }
                  oidc:
                    type: object
                    properties:
                      external_issuer: { type: string }
                      jit_provision: { type: boolean }
                  scim:
                    type: object
                    description: Always an empty object, kept for older readers.
                  governance:
                    type: object
                    properties:
                      min_attestation: { type: string, enum: [none, advisory, managed] }
                      offline_grace_ttl_seconds: { type: integer }
                      local_tool_default: { type: string, enum: [allow, deny] }
                      audit_backpressure: { type: string, enum: [block, drop-with-counter] }
                  approval:
                    type: object
                    description: >
                      Effective socket hold for mode:approve gateway calls:
                      approval.gatewayHoldSeconds resolved against the
                      built-in 120s default, so the row shows what the
                      gateway actually does. The rule's decision window is
                      always the ceiling. unsigned_own_decisions is
                      approval.unsignedOwnDecisions as configured: false means
                      a person's decision on their own request is accepted
                      only from an enrolled phone or browser that signs it.
                    properties:
                      gateway_hold_seconds: { type: integer }
                      unsigned_own_decisions: { type: boolean }
                  admin:
                    type: object
                    description: >
                      The admin plane's settings, set in the config file only.
                      second_person is admin.secondPerson as configured: true
                      means a change that widens access needs a publisher who
                      wrote no revision of its draft other than a Check again
                      that only took live values, minted no admin API token
                      that wrote one, and sponsors no agent that wrote one,
                      and a direct admin write that widens access is refused
                      until it goes through a draft.
                    properties:
                      second_person: { type: boolean }
                  apps:
                    type: object
                    properties:
                      gitops_dir_enabled: { type: boolean }
                      upstream_timeout_seconds: { type: integer }
                  capture:
                    type: object
                    description: >
                      The conversation-recording posture: how many active
                      PolicySets opt sessions into recording, the effective
                      mode across them, the retention bound and where
                      transcript bodies live. Zero sets means nothing is
                      recorded; the mode is mixed when sets disagree.
                    properties:
                      policy_sets: { type: integer }
                      mode: { type: string, enum: [verbatim, redact, mixed] }
                      retention_hours: { type: integer }
                      body_store: { type: string, enum: [inline, s3] }

  /v1/admin/overview:
    get:
      operationId: getOverview
      tags: ["Overview and configuration"]
      summary: Dashboard aggregates for the admin console (one call)
      security: [{ adminBearer: [] }]
      parameters:
        - name: window
          in: query
          description: >
            Adds the last hour by the minute to the decisions block, as
            minutes. hour is the only value. Any other value answers 400
            with a sentence that names it, and leaving the parameter out
            answers the last 24 hours alone. Added in 0.140.0.
          schema: { type: string, enum: [hour] }
      responses:
        "400": { $ref: "#/components/responses/Error" }
        "200":
          description: Counts and heads
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { type: string }
                  snapshot_id: { type: string }
                  users: { $ref: "#/components/schemas/Count" }
                  sessions: { $ref: "#/components/schemas/Count" }
                  apps:
                    type: object
                    properties:
                      total: { type: integer }
                      running: { type: integer }
                      degraded: { type: integer }
                      pending: { type: integer }
                      stopped: { type: integer }
                      failed: { type: integer }
                  policies: { $ref: "#/components/schemas/Count" }
                  audit:
                    type: object
                    properties:
                      head_seq: { type: integer, format: int64 }
                      head_hash: { type: string }
                  denylist:
                    type: object
                    properties:
                      entries: { type: integer }
                  push:
                    type: object
                    description: >
                      Fleet push health for the pod that answered this call.
                      connected counts daemons holding a live edge
                      subscription to this pod; active sessions minus
                      connected is roughly the daemons riding the 30 s poll.
                      lane_up=false means this pod's straza.push.>
                      subscription failed and /v1/push answers 503.
                    properties:
                      connected: { type: integer }
                      lane_up: { type: boolean }
                  decisions:
                    type: object
                    description: >
                      One day of decisions, counted from the
                      straza.audit.tool and straza.audit.mcp records of the
                      hash chain. The server counts them inside this
                      config-area read, so an admin delegated config:read
                      sees the block without a scope on the audit area, and
                      the finished block is cached for 60 seconds.
                    properties:
                      since:
                        type: string
                        format: date-time
                        description: Start of the oldest bucket, the hour-aligned instant 23 hours before the current hour.
                      buckets:
                        type: array
                        description: Always 24 entries, oldest first, one per hour-aligned hour ending with the current hour; an hour with no decisions carries zeros.
                        items:
                          type: object
                          properties:
                            start: { type: string, format: date-time }
                            allowed:
                              type: integer
                              description: >
                                Tool calls policy allowed in this hour. Counts
                                the records whose data.effect is allow, except
                                a call held for approval, which counts in
                                approval, and a catalog read, which counts in
                                catalog. An allowed view read, a
                                straza.audit.mcp record whose data.event is
                                resources.read, counts here. Before 0.139.0
                                this number included catalog reads.
                            approval: { type: integer, description: "Calls policy sent for a person's approval. Counts a decision record paired with the approval request of the same session and rule inside twice the gateway hold, or a request no decision record answered." }
                            denied: { type: integer, description: "Records whose data.effect is deny." }
                            catalog:
                              type: integer
                              description: >
                                Catalog reads in this hour, counted apart from
                                the allowed calls. A catalog read is a
                                straza.audit.mcp record whose data.effect is
                                allow and whose data.event is tools.list or
                                resources.list, the gateway's answer to a
                                tools/list or a resources/list. It lists what
                                the caller may use and runs no tool. A denied
                                or held record is never counted here. Added in
                                0.139.0.
                      minutes:
                        type: array
                        description: >
                          The last hour by the minute. Present only when the
                          request sent window=hour. Always 60 entries, oldest
                          first, one per minute-aligned minute ending with
                          the current minute. A minute with no decisions
                          carries zeros. The server counts them from a scan
                          of the last hour alone, by the rules of buckets,
                          and caches that count for 5 seconds. The stopped
                          list stays the day's. Added in 0.140.0.
                        items:
                          type: object
                          description: One minute, in the shape of a buckets entry. Each count means for this minute what it means there for an hour.
                          properties:
                            start: { type: string, format: date-time }
                            allowed: { type: integer }
                            approval: { type: integer }
                            denied: { type: integer }
                            catalog: { type: integer }
                      stopped:
                        type: array
                        description: The five busiest server and tool groups policy stopped in the window, sorted by count and then by server and tool name. Fewer entries when fewer groups exist.
                        items:
                          type: object
                          properties:
                            app: { type: string, description: "The MCP server the call targeted; empty on a hook-lane record, which names no server." }
                            tool: { type: string }
                            outcome: { type: string, enum: [denied, approval] }
                            count: { type: integer }
                            reason: { type: string, description: "The reason sentence this group carried most often, verbatim from the record." }

  /v1/admin/attestation-hashes:
    get:
      operationId: listAttestationHashes
      tags: ["Attestation hashes"]
      summary: List the expected-hash registry for managed installs
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Registered measurements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttestationHash"
    post:
      operationId: registerAttestationHash
      tags: ["Attestation hashes"]
      summary: Register an expected measurement (allowed-set entry) for managed installs
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The expected measurement to register: the artifact, its hash, and the harness and platform it applies to."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttestationHash"
      responses:
        "201":
          description: Measurement registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttestationHash"
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/admin/attestation-hashes/{id}:
    delete:
      operationId: removeAttestationHash
      tags: ["Attestation hashes"]
      summary: Remove an expected measurement from the registry
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Measurement removed }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/api-tokens:
    post:
      operationId: createApiToken
      tags: ["Admin API tokens"]
      summary: Mint a long-lived admin API token (plaintext returned exactly once; scope is a list of area:verb pairs or full)
      description: >
        Scope is required (no default) and is either `full` (every admin
        route including minting further tokens, a root credential) or a
        comma-separated list of `area:verb` scopes, verb ∈ read|write, area ∈
        identity, sessions, policy, apps, audit, transcripts, approvals,
        config, tokens, changes, scim, drafts. Enforcement derives the verb from the HTTP
        method (GET=read, else write). `tokens:write` mints credentials and is
        therefore root-equivalent; it is in no other scope. The bare word `read`
        is refused (use e.g. identity:read,changes:read).
        A request an authenticated token's scopes do not cover returns 403
        naming the missing scope. 0.50.0: optional expires_in (positive
        seconds; omitted = never) sets a deadline enforced fail-closed at
        verification; list rows carry expires and an hourly-throttled
        lastUsed; duplicate names answer 409. 0.89.0:
        the scim area opens the SCIM plane at /scim/v2 for the token,
        scim:read the GET routes and the discovery documents, scim:write
        every route, so one token serves an identity manager connector's provisioning
        writes and its admin API reads.
        0.90.0: the SCIM token kind and its /v1/admin/scim-tokens routes are
        removed, so this is the only long-lived credential.
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The token's name and scope, either full or a comma-separated list of area:verb scopes."
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                scope:
                  type: string
                  description: '"full" or comma-separated area:verb scopes, e.g. "identity:read,changes:read"'
              required: [name, scope]
      responses:
        "201":
          description: Token minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  scope: { type: string }
                  token: { type: string }
    get:
      operationId: listApiTokens
      tags: ["Admin API tokens"]
      summary: List admin API token metadata, newest first (never the tokens themselves)
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/pageLimit" }
        - { $ref: "#/components/parameters/pageCursor" }
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    scope: { type: string }
                    created: { type: string, format: date-time }
                    expires: { type: string, format: date-time, description: absent when the token never expires }
                    lastUsed: { type: string, format: date-time, description: stamped at most hourly on use; absent until the first use }
                    created_by: { type: string, description: "Who minted the token: the username of the console or CLI session, or the name of the API token that minted it. Absent when the minter was unknown and on rows stored before the field existed." }
  /v1/admin/api-tokens/{id}:
    delete:
      operationId: revokeApiToken
      tags: ["Admin API tokens"]
      summary: Revoke an admin API token
      security: [{ adminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, description: "The id of the token that was revoked." }
                  status: { type: string, enum: [revoked], description: "Always revoked." }
                required: [id, status]
        "404": { $ref: "#/components/responses/Error" }

  /v1/push:
    get:
      operationId: pushSubscribe
      tags: ["Enrollment and check-in"]
      summary: Stream kill-switch revocations and policy refresh hints as server-sent events, scoped to the caller's own session, device and user
      description: >
        Gateway-edge push stream (SSE): the daemon's kill-switch/policy-nudge
        lane over the HTTPS channel it already authenticates to.
        Events: ready (lane live), revocation (drop session state NOW),
        policy (refresh hint; the snapshot is still fetched and verified
        through the normal channel). Subjects derive from the session token's
        own claims (session/user/device + the policy broadcast), so a client
        can only hear about itself. An accelerator by contract: daemons keep
        poll-refresh regardless; 503 (lane down or pod cap
        events.pushEdgeMaxConns reached) means "poll until a retry lands".
      security: [{ sessionBearer: [] }]
      responses:
        "200":
          description: Server-sent event stream (heartbeat comments every ~25 s)
          content:
            text/event-stream: {}
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/snapshot:
    get:
      operationId: getSnapshot
      tags: ["Enrollment and check-in"]
      summary: Fetch the active signed policy snapshot (CBOR; ETag = snapshot id)
      description: >
        The enterprise profile requires the session token a client received at
        check-in and answers 401 without one. The refusal comes before the 304
        and the 503, so this route tells a caller without a token nothing about
        the active snapshot. /metrics still counts the route's answers by status
        unless server.metricsToken is set. The standalone profile serves the
        snapshot without a token. The snapshot is signed, never encrypted, and
        every enrolled machine keeps a copy in its straza home.
      security: [{ sessionBearer: [] }]
      responses:
        "200":
          description: Signed snapshot bytes
          content:
            application/cbor: {}
        "304": { description: Not modified (If-None-Match matched) }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/harness-config:
    get:
      operationId: getHarnessConfig
      tags: ["Enrollment and check-in"]
      summary: Fetch the signed, server-rendered managed harness config for one harness and platform
      description: >
        The managed-config artifact matrix (spec/harness-config v1alpha1):
        exactly the bytes `straza install --managed` writes into an empty
        layout, rendered and ed25519-signed at boot with the snapshot signing
        key, so the served artifact, the on-disk file, and the attestation
        expected-hash registry row hash identically. The hooks.* hashes are
        auto-registered into the registry additively at boot; retiring old
        rows (DELETE /v1/admin/attestation-hashes/{id}) is the stale-version
        lever. Unauthenticated in both profiles. The document is rendered
        from the server's build alone, carries no policy and no secret, matches
        what every managed box writes world-readable, and is fetched by the
        privileged install before any session exists. ETag is the sha256 of
        the served document.
      parameters:
        - name: harness
          in: query
          required: true
          schema: { type: string, enum: [claude-code, codex, gemini] }
        - name: platform
          in: query
          required: true
          description: Target GOOS; artifact content varies by OS only, never by architecture.
          schema: { type: string, enum: [linux, darwin, windows] }
      responses:
        "200":
          description: Signed harness-config document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessConfigDocument" }
        "304": { description: Not modified (If-None-Match matched) }
        "404": { $ref: "#/components/responses/Error" }

  /v1/session/revoke:
    post:
      operationId: revokeOwnSession
      tags: ["Enrollment and check-in"]
      summary: End the session the caller's own token names (logout)
      description: >
        The self-scoped counterpart of the admin session revoke: any
        authenticated session may end ITSELF: the bearer token both
        authenticates the call and selects the only session it can touch, so
        there is no id parameter and no role gate. Per-target semantics match
        POST /v1/admin/sessions/{id}/revoke exactly (stand-down, not lockout;
        an enrolled device credential can start a fresh session). The response
        echoes the revoked session id because the caller named none.
        Idempotent: a verifying token whose session is already dead still
        answers 200, and a replay fires no new revocation row, control event,
        or push (the revoked session's token stays verifiable for its whole
        TTL, so replays are free; only a real state transition emits), and
        deliberately never a 404: a 404 from this path tells `strazactl
        logout` it is talking to a pre-0.41.0 server and must fall back to
        the admin route. An expired token answers 401 with a sentence chosen
        by its kind. An expired session token hears that it cannot end a
        session, that its session ends by itself once no client refreshes it
        or at its lifetime limit, or at once through the session token that
        is live now or an administrator's revoke, and that strazactl login
        starts a new session. An expired ID token or device credential hears
        that it names no session, and the ID token's answer tells a person to
        run strazactl login and an AI agent to request a new token with a
        fresh client assertion. A live ID token, an admin API token and a
        malformed token answer 401 with the sentence that only a session
        token can end its own session.
      security: [{ sessionBearer: [] }]
      responses:
        "200":
          description: The caller's session is revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  session: { type: string, description: id of the session the token named }
        "401": { $ref: "#/components/responses/Error" }

  /v1/connect:
    get:
      operationId: connectList
      tags: ["The calling user"]
      summary: List the acting user's connection on every caller-kind MCP server (oauth or token), never a value
      description: >
        The session is judged on every request as on the admin API: a user
        who is disabled, deleted or locked, a revoked session and a revoked
        device are refused with 403 or 401 and one straza.audit.authn login
        failure record, and a store outage answers 503.
        An AI agent's own session is admitted, because straza connect lists
        the agent's connections here.
      security: [{ sessionBearer: [] }]
      parameters:
        - { name: user, in: query, schema: { type: string }, description: "Act for this user (username or id): allowed for the user's sponsor and for administrators (0.96.0)" }
      responses:
        "200":
          description: One entry per managed caller-kind MCP server
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/connect/callback:
    get:
      operationId: connectCallback
      tags: ["The calling user"]
      summary: "OAuth provider redirect target (browser-facing): redeems and stores nothing, and hands the provider's answer to the Credentials tab"
      description: >
        The address every provider has registered. No session can reach it,
        because the provider's redirect carries none, so since 0.113.0 it
        redeems nothing and stores nothing: it answers 303 to
        /self-service/credentials with the code and the state, or the
        provider's error, behind the # of that address. The target is a fixed
        same-origin path built from no part of the request. The Credentials
        tab finishes the sign-in with POST on this same path.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303":
          description: "See Other to /self-service/credentials#connect&code=...&state=..., or #connect&error=... when the provider refused. Any other query parameter is dropped."
        "400":
          description: "An HTML page saying the address was opened with nothing to finish, and to start the sign-in again from the credentials page."
          content:
            text/html:
              schema: { type: string }
    post:
      operationId: connectFinish
      tags: ["The calling user"]
      summary: "Finish a provider sign-in for the signed-in user, only when the state names that user"
      description: >
        Since 0.113.0. The Credentials tab posts the code and the state the
        callback handed it, with the person's session. The state proves who started the
        sign-in and the session proves who is finishing it; the code is
        redeemed only when both are the same user. A state another user
        started is refused before the provider is asked, and one
        straza.identity.updated record with the action oauth.connect.refused
        names both users. A state is not consumed, so it stays valid for its
        10 minutes, and every use needs its starter's session and a fresh
        provider code.
        The session is judged on every request as on the admin API: a user
        who is disabled, deleted or locked, a revoked session and a revoked
        device are refused with 403 or 401 and one straza.audit.authn login
        failure record, and a store outage answers 503.
        An AI agent's own session is admitted, as on the other connect
        routes.
      security: [{ sessionBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string, description: The one-time code the provider handed the browser }
                state: { type: string, description: The signed state of the sign-in, as the provider returned it }
      responses:
        "200":
          description: The sign-in is stored for the signed-in user; never token material
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { type: string }
                  provider: { type: string }
                  kind: { type: string, description: the literal oauth }
                  allow_agents: { type: boolean, description: the owner's opt-in kept across a reconnect }
        "400": { description: "The body lacks code or state, the state is invalid or older than 10 minutes, or the MCP server is gone or no longer uses sign-in; nothing was stored" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { description: "Another user started this sign-in; nothing was redeemed or stored, and the refusal is recorded" }
        "409": { description: "The provider is no longer configured on this Straza server, or the MCP server was removed and added again while the sign-in was finishing; nothing was stored" }
        "500": { description: "The grant could not be stored" }
        "502": { description: "The provider rejected the code; nothing was stored" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/connect/{app}:
    post:
      operationId: connectStart
      tags: ["The calling user"]
      summary: "Connect the acting user to one MCP server: paste a token on a token-kind server, or begin the OAuth sign-in on an oauth-kind server"
      description: >
        On a token-kind server the body carries the pasted token (0.96.0): the
        server tests it once against the upstream, seals it under the acting
        user's id and answers with its fingerprint; the value is never
        returned by any read. On an oauth-kind server a bare POST answers the
        provider authorization URL for the browser of the Credentials tab and,
        since 0.113.0, that tab's address for a terminal to print, and a body with
        token or user is refused in words. An agent or a service that starts a
        sign-in is refused with 403 since 0.113.0, because a sign-in is stored
        only for the user of the session that finishes it in a browser. user names an agent the caller
        sponsors, or any user when the caller is an administrator.
        The session is judged on every request as on the admin API: a user
        who is disabled, deleted or locked, a revoked session and a revoked
        device are refused with 403 or 401 and one straza.audit.authn login
        failure record, and a store outage answers 503.
        An AI agent's own session is admitted, because straza connect pastes
        the agent's own token here.
      security: [{ sessionBearer: [] }]
      parameters:
        - { name: app, in: path, required: true, schema: { type: string } }
      requestBody:
        description: "On a token-kind server, the pasted token, its expiry and optionally the user to act for; on an oauth-kind server, no body at all."
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, description: The pasted token (token-kind servers only, at most 8192 bytes) }
                expires_at: { type: string, format: date-time, description: When the token stops working, as the provider shows it; refused when already past }
                user: { type: string, description: Act for this user (username or id), for a sponsor or an administrator }
      responses:
        "200":
          description: The authorization URL (oauth kind) or the stored token's fingerprint (token kind)
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { type: string }
                  provider: { type: string, description: oauth kind only }
                  authorize_url: { type: string, description: oauth kind only }
                  page_url: { type: string, description: "oauth kind only (0.113.0), the Credentials tab where the person signs in to Straza and finishes; a terminal prints this and never the authorize_url" }
                  expires_in: { type: integer, description: oauth kind only }
                  user: { type: string, description: token kind only, the owner's username }
                  kind: { type: string, description: token kind only, the literal token }
                  fingerprint: { type: string, description: token kind only, first hex characters of the token's SHA-256 }
                  expires_at: { type: string, format: date-time }
                  set_by: { type: string, description: token kind only, the acting user's username when it was not the owner }
                  allow_agents: { type: boolean, description: token kind only, the owner's opt-in kept across a re-paste }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { description: The upstream refused the token or did not answer; nothing was stored }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: connectAgents
      tags: ["The calling user"]
      summary: Allow or forbid the owner's sponsored agents to run on this connection
      description: >
        The owner's opt-in on their own row, on either caller kind. An agent
        with no row of its own runs on its sponsor's row only when the server's
        manifest sets credential.agents to sponsor and the sponsor allowed it
        here; the gateway record then names the sponsor as credentialOwner.
        The session is judged on every request as on the admin API: a user
        who is disabled, deleted or locked, a revoked session and a revoked
        device are refused with 403 or 401 and one straza.audit.authn login
        failure record, and a store outage answers 503.
        An AI agent's own session is admitted, because straza connect
        --allow-agents calls it on the caller's session.
      security: [{ sessionBearer: [] }]
      parameters:
        - { name: app, in: path, required: true, schema: { type: string } }
      requestBody:
        description: "Whether the owner's sponsored agents may run on this connection and, for a sponsor or administrator, the user to act for."
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow_agents]
              properties:
                allow_agents: { type: boolean }
                user: { type: string, description: Act for this user, for a sponsor or an administrator }
      responses:
        "200":
          description: The opt-in as stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { type: string }
                  user: { type: string }
                  allow_agents: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: connectDelete
      tags: ["The calling user"]
      summary: Remove the acting user's connection on one MCP server, OAuth or pasted token
      description: >
        The session is judged on every request as on the admin API: a user
        who is disabled, deleted or locked, a revoked session and a revoked
        device are refused with 403 or 401 and one straza.audit.authn login
        failure record, and a store outage answers 503.
        An AI agent's own session is admitted, because straza disconnect
        removes the agent's own connection here.
      security: [{ sessionBearer: [] }]
      parameters:
        - { name: app, in: path, required: true, schema: { type: string } }
        - { name: user, in: query, schema: { type: string }, description: "Act for this user, for a sponsor or an administrator (0.96.0)" }
      responses:
        "200":
          description: Disconnected (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { type: string }
                  user: { type: string }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/changes:
    get:
      operationId: listChanges
      tags: ["Audit, sinks and the change feed"]
      summary: Cursored change feed over the events outbox (IGA liveSync; at-least-once, keep recon as the safety net)
      security: [{ adminBearer: [] }]
      parameters:
        - { name: since, in: query, schema: { type: string }, description: "Cursor from a previous page's nextCursor; empty = genesis (prefer full recon for first sync)" }
        - { name: types, in: query, schema: { type: string }, description: "Comma list of user,role,app,tool,binding; empty = all" }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: Ordered changes after the cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        cursor: { type: string }
                        type: { type: string, enum: [user, role, app, tool, binding, identity] }
                        op: { type: string, enum: [create, update, delete] }
                        id: { type: string }
                        at: { type: string, format: date-time }
                  nextCursor: { type: string, description: "Advance to here even when changes is empty (noise rows are consumed silently)" }
                  more: { type: boolean }
                  head: { type: string, description: "Newest outbox id at read time; first-time consumers adopt it (sync-from-now) and reconcile once" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/admin/drafts:
    get:
      operationId: listDrafts
      tags: ["Drafts"]
      summary: List drafts, the open ones by default, newest first, with the check counts of each open draft
      description: >
        A caller without drafts:read who is not root lists the drafts it
        wrote a revision of and the drafts whose every item is a server, or a
        role a server owns, that it administers. Its pages and cursors come
        from those drafts alone. A page can hold fewer rows than limit while
        next_cursor is set, and one request reads at most 1,000 drafts.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, published, discarded, expired, all] }, description: "Default open." }
        - { name: door, in: query, schema: { type: string, enum: [console, strazactl, straza-app, apps-directory, api] } }
        - { name: object, in: query, schema: { type: string }, description: "Kind/Name, such as App/github: the drafts that hold an item for that object." }
        - { name: source, in: query, schema: { type: string }, description: "An apps directory file path." }
        - { name: mine, in: query, schema: { type: boolean }, description: "The drafts with a revision the caller wrote." }
        - { name: working, in: query, schema: { type: boolean }, description: "The caller's open working draft." }
        - { name: policy_edit, in: query, schema: { type: string }, description: "The open saved edit of the named policy set. An empty name is refused." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: "next_cursor of the previous page." }
      responses:
        "200":
          description: One page of drafts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftPage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/DraftsUnavailable" }
    post:
      operationId: createDraft
      tags: ["Drafts"]
      summary: Store a new draft of documents or items checked against live state, or add them to your working draft
      description: >
        documents holds YAML streams of App, Role, PolicySet and Removal
        documents (spec/objects revision 5), and items holds single objects.
        Nothing in a draft is live until a person publishes it. A refusal at
        intake, a secret or a document read back masked among them, stores
        nothing and answers 422 with every finding. A draft whose check
        refuses is stored and cannot be published until it is fixed. An
        object outside the caller's read standing answers 403. Only a person
        keeps a working draft.
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The documents or items, the proposer's note, and whether they join the caller's working draft."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftBody" }
      responses:
        "200":
          description: The caller's working draft, revised
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftAnswer" }
        "201":
          description: The new draft and its verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftAnswer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/DraftTooLarge" }
        "422":
          description: Refused at intake, nothing stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftRefused" }
        "503": { $ref: "#/components/responses/DraftsUnavailable" }

  /v1/admin/drafts/check:
    post:
      operationId: checkDraft
      tags: ["Drafts"]
      summary: Check documents or items against live state and answer the verdict, storing nothing
      description: >
        Each item is stamped in memory, so a put of a live object reads as a
        change, and the intake refusals join the verdict's refused list. A
        draft over the size or item limit is answered from intake alone. An
        object outside the caller's read standing answers 403.
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The documents or items to check."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftBody" }
      responses:
        "200":
          description: The items as read and their verdict, intake refusals included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftCheckAnswer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/DraftTooLarge" }
        "503": { $ref: "#/components/responses/DraftsUnavailable" }

  /v1/admin/drafts/{id}:
    get:
      operationId: getDraft
      tags: ["Drafts"]
      summary: Read one draft with its verdict, its revisions, the live objects it changes and its change record
      description: >
        A draft the caller may not read answers 404, as an unknown one does.
        An open draft with an item not stamped yet is stamped by this read.
        An open draft's verdict is computed on this read. A published,
        discarded or expired draft cannot change, so it runs no check, which
        would name fixes it cannot take and read a published draft's own
        changes as stale: its verdict holds no line, checks holds the counts
        of the check the server stored for its revision, which for a
        published draft is the check its publish ran, may_publish is false
        and publish_refusal is absent.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/DraftsUnavailable" }
    put:
      operationId: updateDraft
      tags: ["Drafts"]
      summary: Replace an open draft's documents with a new revision and check it again
      description: >
        An item that names an object the draft already holds keeps the base
        it was stamped with, so a stale object stays stale. A present note,
        empty included, replaces the draft's note, and a note left out keeps
        it. An admin API token and an agent revise only their own drafts. The
        saved edit of a policy set holds a new text of that set alone, and any
        other item list answers 409.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The revision the change is made on, the whole new item list, and the note when it changes."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftUpdate" }
      responses:
        "200":
          description: The new revision and its verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftAnswer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/DraftTooLarge" }
        "422":
          description: Refused at intake, nothing stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftRefused" }
        "503": { $ref: "#/components/responses/DraftsUnavailable" }

  /v1/admin/drafts/{id}/discard:
    post:
      operationId: discardDraft
      tags: ["Drafts"]
      summary: Discard an open draft, which changes nothing live
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The revision read and the reason, both optional."
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftDiscard" }
      responses:
        "200":
          description: The discarded draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { $ref: "#/components/schemas/Draft" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/DraftTooLarge" }
        "503": { $ref: "#/components/responses/DraftsUnavailable" }

  /v1/admin/drafts/{id}/revert:
    post:
      operationId: revertDraft
      tags: ["Drafts"]
      summary: Make a new draft that undoes a published draft, checked like any other
      description: >
        The new draft reads the change record backwards, and each item's base
        is the object as the publish left it, so an object changed since
        reads stale. It meets the caller's read standing and then intake, as
        a new draft does. A secret the stamp masked in a stored manifest
        comes back as a mask, which the check waives for the value the live
        manifest still holds there, and the publish keeps that value; a mask
        at a place the live manifest holds no value for answers 422 and
        stores nothing.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The note of the new draft, optional."
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftRevert" }
      responses:
        "201":
          description: The undo draft and its verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftAnswer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/DraftTooLarge" }
        "422":
          description: Refused at intake, nothing stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftRefused" }
        "503": { $ref: "#/components/responses/DraftsUnavailable" }

  /v1/admin/drafts/{id}/rebase:
    post:
      operationId: rebaseDraft
      tags: ["Drafts"]
      summary: Check a draft again on live state, keeping the fields it changes and taking every other field from live
      description: >
        Check again. Each item whose object changed on live state since its
        base keeps the fields the draft changed and takes every other field
        from live, and its base becomes live's. A field both sides changed to
        different values answers 409 with the conflicts and nothing written,
        until picks names the value to keep. A server's value that live holds
        as a secret is never taken into the draft. A Check again no pick
        decided is mechanical and makes no author under admin.secondPerson.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The revision read, and the value to keep for each field both sides changed."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftRebase" }
      responses:
        "200":
          description: The new revision and its verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftAnswer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Fields both sides changed still need a pick, the draft moved, nothing moved on live state, or live holds a secret the merge would take
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftConflicts" }
        "413": { $ref: "#/components/responses/DraftTooLarge" }
        "422":
          description: The merged items refused at intake, nothing stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftRefused" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/DraftsUnavailable" }

  /v1/admin/drafts/{id}/contact:
    post:
      operationId: contactDraftServer
      tags: ["Drafts"]
      summary: Contact a proposed remote server once, with no credential, and read its tool names
      description: >
        A person's request, never a token's or an agent's, with the scope
        apps:write or the role straza-global-mcp-admin. Straza refuses an
        address that is loopback, unspecified, link-local or a cloud's
        metadata service, a name's resolved addresses included, uses no
        proxy, follows no redirect, sends no credential, reads at most 1 MiB
        within 10 seconds and starts nothing. The names are the server's own
        text and are kept on the draft for its check.
      security: [{ userBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The App item to contact, as Kind/Name."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftContact" }
      responses:
        "200":
          description: What the server answered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftContacted" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/DraftTooLarge" }
        "502": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/DraftsUnavailable" }

  /v1/admin/drafts/{id}/publish:
    post:
      operationId: publishDraft
      tags: ["Drafts"]
      summary: Publish a draft whole in one transaction, as a person with standing over every item and the acknowledgments of its risks
      description: >
        Refused for an admin API token, an agent, a coding-harness session and
        a user record that cannot be read. The verdict is computed again, and
        every risk it holds must be acknowledged in ticked or, for a typed
        risk, in typed. An object that changed since the draft's check refuses
        the publish, and nothing is written. A client whose answer was lost
        reads the draft before it publishes again: a published draft answers
        409 with who published it and when.
      security: [{ userBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The revision reviewed, its risk digest, and the acknowledgments."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftPublish" }
      responses:
        "200":
          description: The published draft and what changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftPublished" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The draft, its verdict or live state stands in the way. The verdict rides along when it is the reason, and the code second_person marks a refusal of admin.secondPerson.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftRefused" }
        "413": { $ref: "#/components/responses/DraftTooLarge" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/DraftsUnavailable" }

  /v1/admin/policies:
    get:
      operationId: listPolicies
      tags: ["PolicySets"]
      summary: List stored PolicySets (summary-only envelope with filters, paging, and a per-role facet)
      description: >
        0.78.0: rows carry no yaml (fetch one set via GET
        /v1/admin/policies/{name}); filters apply before paging; total counts
        the filtered matches; the roles facet is computed over ALL matches so
        group views render whole-truth rollups while rows page. Facet role
        "*" collects match-all sets (no selector, they cover everyone), "~"
        collects users/identity-scoped sets that name no role. An invalid
        parameter value answers 400 naming the accepted forms. Since 0.120.0
        drift is true while the set has an open saved edit, and that set's
        row answers the edit's priority, summary and updated_at, which the
        filters and the facet read too.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "case-insensitive substring over name and summary description (unparseable sets match on name only)" }
        - { name: status, in: query, schema: { type: string, enum: [active, draft] } }
        - { name: role, in: query, schema: { type: string }, description: "a role name, or * (match-all sets) or ~ (users/identity-scoped, no roles)" }
        - { name: lane, in: query, schema: { type: string, enum: [mcp, shell, files, net, other] }, description: "sets with at least one rule governing this lane (a tool-unscoped rule governs every lane)" }
        - { name: recording, in: query, schema: { type: boolean }, description: "true = only sets that record conversations; false = only sets that do not (unparseable sets match neither)" }
        - { name: limit, in: query, schema: { type: integer, minimum: 0 }, description: "page size; 0 or absent = all matches" }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: PolicySet envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: the page window; summary-only (no yaml)
                    items: { $ref: "#/components/schemas/PolicySet" }
                  total: { type: integer, description: "filtered matches before paging" }
                  limit: { type: integer }
                  offset: { type: integer }
                  roles:
                    type: array
                    description: per-role rollups over ALL filtered matches, "*" first, names sorted, "~" last; parseable sets only
                    items:
                      type: object
                      properties:
                        role: { type: string }
                        sets: { type: integer }
                        postures:
                          type: object
                          additionalProperties: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
    put:
      operationId: applyPolicy
      tags: ["PolicySets"]
      summary: Upsert a PolicySet from YAML (validated; a new set stays draft, edits to a live set stay unpublished until it is activated)
      description: >
        A name the server does not have is stored as a set that is off,
        which governs nothing, and answers 201. A new text of a set that is
        off replaces its stored text and answers 200, and the stored text
        sent again writes nothing (0.120.0). An existing set that is on
        keeps its published text: the new text becomes that set's saved
        edit, a draft that its activate publishes (0.120.0). That save
        answers 200, publishes nothing, and writes draft.create or
        draft.update and no policy.update. A text equal to the published
        one discards the saved edit, and a saved edit that another publish
        made stale is discarded and a new one opens. Activating or turning
        off any other set never publishes it. Every other change is
        published as a one-item draft of the api door by the caller, whose
        records name the draft, and a secret-shaped value in the text
        answers 400 with the secret scan's sentence and fix.
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The PolicySet document to store, as YAML text."
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicySet" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicySet" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/DirectConflict" }
        "503": { $ref: "#/components/responses/DirectBusy" }

  /v1/admin/policies/event-support:
    get:
      operationId: getPolicyEventSupport
      tags: ["PolicySets"]
      summary: Read the harness support matrix for policy events, the one source of truth for event coverage
      description: >
        Which mapped harness emits which canonical event, assembled from the
        embedded adapter tables (the runtime twin of
        spec/hook-profile/mappings). Static per build; the console's event
        chips read their coverage sublabels here instead of hard-coding a
        taxonomy. blocking mirrors the hook profile: only tool.pre and
        permission.request can stop a call, the rest observe.
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Support matrix
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    description: Canonical events in the engine's order.
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        blocking: { type: boolean }
                        harnesses:
                          type: array
                          items: { type: string }
                          description: sorted harness names whose adapter maps the event
                  harnesses:
                    type: array
                    items: { type: string }
                    description: every mapped harness, sorted

  /v1/admin/policies/{name}:
    get:
      operationId: getPolicy
      tags: ["PolicySets"]
      summary: Fetch one stored PolicySet in full, yaml included (the editor's read, since the list is summary-only)
      description: >
        Since 0.120.0, while the set has an open saved edit, yaml is that
        edit's text, priority, summary and updated_at are that edit's, and
        drift is true.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: PolicySet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicySet" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deletePolicy
      tags: ["PolicySets"]
      summary: Delete a stored PolicySet (drafts only; active sets must be deactivated first)
      description: >
        Answers 409 for a set whose stored status is active and, since
        0.116.0, for a set stored as a draft that the published snapshot
        still carries. Turn such a set off first, which publishes its
        removal, then delete it. Since 0.120.0 the deletion is published as
        a one-item draft of the api door by the caller, and policy.delete
        names the draft.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/DirectConflict" }
        "503": { $ref: "#/components/responses/DirectBusy" }

  /v1/admin/policies/validate:
    post:
      operationId: validatePolicy
      tags: ["PolicySets"]
      summary: Validate PolicySet YAML with the real parser (Policy Builder; no state change)
      description: >
        Parses with the real engine parser and, since 0.73.0, runs the
        approver-role gate (spec/policyset revision 15): every approve.roles
        entry must be an approver-kind role or straza-admin; a business or application
        role, a Straza role other than straza-admin, or a name that is
        not a role in Straza answers 400 with every violation and its fix
        in one message, the same words activation uses. Since 0.80.0 the
        match-roles gate (revision 16) runs beside it: a match.roles entry
        that exists as a business, approver or Straza role answers 400
        the same way (unknown names stay legal selectors). Since 0.126.0
        the set also compiles as it does at activation (spec/policyset
        revision 21), so a Rego module that activation would refuse, one
        that calls a refused built-in included, answers 400 with the
        compiler's sentence.
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The PolicySet document to check, as YAML text; nothing is stored."
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200":
          description: Parses clean
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  name: { type: string }
                  rules: { type: integer }
                  priority: { type: integer }
                  matchRoles: { type: array, items: { type: string } }
                  capture: { type: string, description: "The recording mode when the set turns recording on." }
                  warnings:
                    type: array
                    items: { type: string }
                    description: >
                      Non-fatal author advisories as plain sentences, such as
                      a predicate no subject can satisfy today; ok stays true.
                      The same sentences travel typed in advisories.
                  advisories:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: >
                            The stable class of the advisory, which consoles
                            key tone and placement on, never the prose. One
                            of require-unsatisfiable, approve-unrouted,
                            bind-reserved, capture-verbatim and
                            events-never-fire, the last
                            for a rule whose event set cannot fire because
                            it excludes tool.pre on an mcp.call rule or no
                            mapped harness emits any of its events.
                        severity: { type: string, description: "only warn today" }
                        rule: { type: string, description: "offending rule id; absent for set-level advisories" }
                        text: { type: string, description: "the plain sentence, identical to its warnings entry" }
                    description: >
                      The typed twin of warnings, the same advisories in the
                      same order.
        "400": { $ref: "#/components/responses/Error" }

  /v1/admin/policies/simulate:
    post:
      operationId: simulatePolicy
      tags: ["PolicySets"]
      summary: Evaluate one event+subject against the active snapshot, optionally overlaying a draft PolicySet (Policy Builder what-if; no state change)
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The event to evaluate, the subject to evaluate it for and, optionally, a draft PolicySet in YAML to overlay."
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { type: object, description: "canonical policy event (kind, tool, command, paths, app, toolName, workspace). A granted field in the body is ignored: for an mcp.call the server recomputes it from the in-memory access rows before evaluating, so the answer never reads allow for a tool the subject has no access to. For a shell.exec event with no interpreter field, the server detects the interpreter from the command and argv before evaluating, as /v1/decide does, and an interpreter the body names is kept." }
                subject:
                  type: object
                  properties:
                    user: { type: string, description: "id or username; roles resolved server-side" }
                    roles: { type: array, items: { type: string } }
                    attestation: { type: string }
                draft: { type: string, description: "PolicySet YAML overlaid in place of its same-named stored set" }
      responses:
        "200":
          description: Decisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    $ref: "#/components/schemas/EngineDecision"
                    description: "decision under the active snapshot"
                  draft:
                    $ref: "#/components/schemas/EngineDecision"
                    description: "decision with the draft overlaid (present only when a draft was sent)"
                  subject: { type: object }
                  snapshot: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/policies/{name}/activate:
    post:
      operationId: activatePolicy
      tags: ["PolicySets"]
      summary: Turn one PolicySet on or off and publish that change alone in a new snapshot
      description: >
        Since 0.116.0 a publish changes only this set: every other set keeps
        the text the active snapshot carries, including a set whose edits
        were saved with PUT and not published, and the published snapshot,
        not the stored status, decides which sets are in force. With a saved
        edit open, status active publishes that draft as it is, and status
        draft stores the set off with the saved edit's text and closes the
        saved edit (0.120.0). A saved edit made on a text that another
        publish has replaced since answers 409. A set already in the asked
        state with no saved edit answers 200 with the running snapshot and
        writes nothing: no record, no new snapshot and no activation check
        (0.120.0). The answer's changed field is true when the call
        published and false when it wrote nothing, so a client can tell a
        publish from a repeat. The status commits with the snapshot, so a
        failed publish answers 500 and changes nothing, and concurrent
        publishes on several replicas each check again and retry when
        another landed first.

        Activation is the approver-role gate (spec/policyset revision 15,
        0.73.0): a set whose approve.roles names anything but approver-kind
        roles or straza-admin (unknown names included) answers 400 with
        every violation and stays draft. Since 0.80.0 the match-roles gate
        (revision 16) rides the same moment: a match.roles entry that
        exists as a business, approver or Straza role answers 400 and
        the set stays draft (unknown names stay legal selectors). Sets
        that were already active before either gate keep governing
        (strazad logs one WARN per such set at boot) until their next
        activation.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        description: "The status to set, active or draft; an absent body means active."
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, draft] }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  snapshot: { type: string }
                  changed:
                    type: boolean
                    description: "True when this call published a new snapshot. False when the set was already in the asked state and nothing was written, and snapshot is then the one already running."
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/DirectConflict" }
        "503": { $ref: "#/components/responses/DirectBusy" }

  /v1/admin/users:
    get:
      operationId: listUsers
      tags: ["Users and devices"]
      summary: List users, with filters, a sort and enriched rows on the paged lane
      description: >
        List users. The paged lane (limit=/cursor=) answers the
        {items, next_cursor} envelope with rows ENRICHED by effective_roles
        (server resolver: direct + composition closure), last_seen
        (batched over the page), locks (0.58.0, batched: the lock rows
        the kill-switch lanes write, same shape as the detail read; empty
        array = not locked) and sponsored_count (0.100.0, one grouped
        read); it also accepts the q/status/role/sponsor filters and the
        sort and order parameters. The bare lane keeps the legacy plain
        array without enrichment, and refuses filters and sorts with a
        400 rather than silently ignoring them.
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/pageLimit" }
        - { $ref: "#/components/parameters/pageCursor" }
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive substring over username, email and external_id (paged lane only)
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled] }
          description: Exact status match; unknown values are 400 (paged lane only)
        - name: role
          in: query
          schema: { type: string }
          description: >
            Role NAME; matches users effectively holding it (direct
            assignments inside their validity window, plus
            holders of any role that composes it, directly or through another role). Unknown
            names are 400 (paged lane only)
        - name: sponsor
          in: query
          schema: { type: string }
          description: Exact sponsor username, so the page lists the agents that user sponsors (paged lane only)
        - name: sort
          in: query
          schema: { type: string, enum: [created, name, status, last_seen] }
          description: >
            The order of the page (0.100.0, paged lane only), true over the
            whole directory: created and last_seen open on the newest,
            name and status on A; absent is created. last_seen reads the
            newest session of every user through one grouped join, so a
            page under it costs one pass over the sessions table. A
            cursor continues only the sort and order it was minted under;
            any other is a 400.
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
          description: The direction of the sort; absent takes the key's own default
      responses:
        "200":
          description: Users (bare lane; the paged lane wraps enriched rows in the envelope)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      operationId: createUser
      tags: ["Users and devices"]
      summary: Create a local user
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The new user's username and, optionally, email, display name, title, password, kind and, for kind nhi, user_type."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created. A user created with kind nhi carries user_type agent or service in the answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}:
    get:
      operationId: getUser
      tags: ["Users and devices"]
      summary: Read one user, enriched with effective roles, locks, last seen, counts and the agent assertion-key posture
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateUser
      tags: ["Users and devices"]
      summary: Update user fields (email, display, status, password)
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The user fields to change; an absent field keeps its value."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated. Only the fields whose value the request changes are written, so a PATCH of another field at the same moment keeps its value, and the answer is the row as stored after the write. Disabling a user revokes their sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteUser
      tags: ["Users and devices"]
      summary: Soft-delete a user (revokes sessions, ends role assignments with one audit record each, removes OAuth grants, an agent's key and approver devices, emits revocation)
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/lock:
    post:
      operationId: lockUser
      tags: ["Users and devices"]
      summary: Lock a user (Straza-lane revocation that survives identity manager writes)
      description: >
        Two-lane activation (spec/scim-profile revision 4): runs the
        kill-switch cascade with an origin-tagged revocation and does NOT
        touch users.status; the identity manager keeps mastering its own lane, and a SCIM
        active:true (enable or reconciliation) lifts only scim-origin rows,
        so this lock survives it. Origin `external` marks SOAR/SIEM
        automation (an admin API token with identity:write may call it). The lock is visible to
        the identity manager as the read-only SCIM extension lock block.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The reason for the lock, shown on the audit chain, and optionally the origin, external for SOAR or SIEM automation."
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: "shown on the audit chain and in the SCIM lock block" }
                origin: { type: string, enum: [admin, external], default: admin }
              required: [reason]
      responses:
        "200":
          description: Locked; active sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  locked: { type: boolean }
                  origin: { type: string }
                  reason: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/unlock:
    post:
      operationId: unlockUser
      tags: ["Users and devices"]
      summary: Unlock a user (lift every revocation lane)
      description: >
        The explicit Straza action admin/external locks require. Lifts ALL
        revocation lanes for the user (scim included); users.status is
        untouched, so a user the identity manager disabled stays disabled on that lane.
        Sessions already revoked stay revoked. Once the user's status is active, a
        device the user enrolled opens a new session at its next check-in with no new
        enrollment, unless that device was revoked on its own or its device credential
        expired meanwhile, and such a device needs a fresh enrollment.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Unlocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  locked: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/devices:
    get:
      operationId: listUserDevices
      tags: ["Users and devices"]
      summary: List a user's enrolled devices, an empty array when there are none, 404 for an unknown user
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/pageLimit" }
        - { $ref: "#/components/parameters/pageCursor" }
      responses:
        "200":
          description: Devices (always a JSON array, never null)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Device" } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/users/{id}/devices/{deviceId}:
    delete:
      operationId: revokeUserDevice
      tags: ["Users and devices"]
      summary: Revoke a device enrollment, so its device token stops minting sessions
      description: >
        Row-backed revocation, like the approver-device delete: the device row
        is removed, so the long-lived device credential fails closed at
        /v1/checkin on both lanes (starting a session, and refreshing one that
        carries this device binding), and live enforcement kits on the device
        get the target-scoped revocation push. The id pair is a belongs-to
        check: a device that exists under a different user answers the same
        404 as an unknown id. Re-enrolling the machine needs a fresh
        interactive login and mints a new row; a revoked enrollment is never
        resurrected.
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/sinks:
    get:
      operationId: listSinks
      tags: ["Audit, sinks and the change feed"]
      summary: List configured sinks with backlog, since-boot tallies and parked (dead-letter) counts
      description: >
        The operator door onto sink delivery health. One row per sinks[] entry,
        in config order: the redacted
        target (query masked, as the boot announce prints it), the effective
        subject filters, one sub-row per spine stream the sink drains
        (pending = not yet delivered, inflight = delivered but unacked, i.e.
        awaiting a backoff redelivery; delivered / duplicates / parked since
        boot; the last failure), and `parked`, the LIVE count of this sink's
        records in the dead-letter lane. A non-zero parked count means the
        receiver refused events it will never accept by repetition (a 4xx
        other than 408/425/429, or a transient failure past its attempt
        budget): the events are preserved, counted
        (straza_sink_deadletter_total) and replayable via replaySink.
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Sinks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    type: { type: string, enum: [webhook, file] }
                    target: { type: string, description: "webhook URL with the query masked, or the file path" }
                    batch: { type: integer }
                    subjects: { type: array, items: { type: string } }
                    parked: { type: integer, description: "records this sink holds in the dead-letter lane right now" }
                    streams:
                      type: array
                      items:
                        type: object
                        properties:
                          stream: { type: string }
                          pending: { type: integer }
                          inflight: { type: integer }
                          delivered: { type: integer }
                          duplicates: { type: integer, description: "409 answers acked as delivered (receiver already holds the event)" }
                          parked: { type: integer, description: "parked by this runner since boot" }
                          last_error: { type: string }
                          last_error_at: { type: string, format: date-time }

  /v1/admin/sinks/{name}/replay:
    post:
      operationId: replaySink
      tags: ["Audit, sinks and the change feed"]
      summary: Re-deliver a sink's parked (dead-letter) events, oldest first
      description: >
        Re-feeds the named sink's parked records to the receiver in park
        order, deleting each from the lane as the receiver accepts it (a 409
        counts: the receiver holds it). Stops at the FIRST refusal and reports
        it in `stopped`, leaving that record and everything behind it parked;
        nothing is re-parked, nothing is dropped. Bounded per call (`limit`,
        default and cap 1000) so the request stays short; `remaining` says
        whether to call again. Emits straza.audit.admin action sink.replay.
      security: [{ adminBearer: [] }]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: sinks[].name from strazad config
      requestBody:
        description: "The most records to re-deliver in this call, at most 1000, which is also the default."
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit: { type: integer, minimum: 1, maximum: 1000, description: "max records to replay in this call (default 1000)" }
      responses:
        "200":
          description: Replay outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  sink: { type: string }
                  replayed: { type: integer }
                  remaining: { type: integer }
                  stopped: { type: string, description: "the refusal that ended the replay early; empty when it ran to its limit or emptied the lane" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/admin/revocations:
    get:
      operationId: listRevocations
      tags: ["Users and devices"]
      summary: List revocation rows, the rows the lock and kill-switch lanes write
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Revocations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    kind: { type: string, enum: [user, session, device, jti] }
                    target_id: { type: string }
                    reason: { type: string }
                    origin: { type: string, enum: [scim, admin, external] }
                    created_at: { type: string, format: date-time }

  /v1/admin/users/{id}/nhi-key:
    get:
      operationId: getNHIKey
      tags: ["Users and devices"]
      summary: Read an agent's assertion-key posture (presence, creation time and fingerprint), never the key
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Key posture
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string }
                  registered: { type: boolean }
                  created: { type: string, format: date-time }
                  fingerprint: { type: string, description: "sha256:<hex> of the raw public key" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: setNHIKey
      tags: ["Users and devices"]
      summary: Register (or rotate) an agent's headless assertion key
      description: >
        Stores the Ed25519 public key the
        built-in issuer's client_credentials grant verifies client assertions
        against. One key per agent identity, so a PUT overwrites (rotation). Refused for
        people: a person signs in interactively, and a stolen key must
        never become a password-equivalent bypass.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The Ed25519 public key, base64 encoded raw 32 bytes, that the identity's client assertions are verified against."
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_key: { type: string, description: "base64 (std) raw Ed25519 public key, 32 bytes" }
              required: [public_key]
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteNHIKey
      tags: ["Users and devices"]
      summary: Revoke an agent's headless assertion key
      description: >
        The next client_credentials grant fails; running sessions die through
        the normal session/user kill-switch lanes. A user who holds no key
        answers 404 with a sentence that says there is nothing to remove, and
        no record is written, because nothing changed.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/roles:
    get:
      operationId: listRoles
      tags: ["Roles, assignments and knowledge packs"]
      summary: List roles
      description: >
        Every role under an identity scope. Under the standing of a server's
        admin role the list holds only the roles owned by the caller's
        servers, never a global role (0.106.0). A server-owned row carries
        server and tools.
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Role" } }
    post:
      operationId: createRole
      tags: ["Roles, assignments and knowledge packs"]
      summary: Create a role, global or owned by one server
      description: >
        Since 0.106.0 a role may be server-owned: server names the owning
        server and tools its tool list, the kind is application,
        the name is the server's folded name, a hyphen and a suffix, and the
        role and its access row on the server land in one transaction. A
        server's prefix is exclusive, so a global role wearing it answers
        400 with the way. The holder of a server's admin role creates roles
        for that server only: server is required (400) and another server
        answers 403. Since 0.138.0 tools may be ["*"], every tool and the
        tools the server adds later, when a global admin (root, or the
        scope identity:write) creates the role, and the holder of a server's
        admin role who sends it answers 400. An application role created
        without server is stored and reaches no MCP server: policy sets may
        match it, and its first access row is refused (see
        createToolBinding). Every create writes straza.audit.admin roles.create
        with the role id, its name and, for a server-owned role, its server.
        Since 0.120.0 the role is published as a one-item draft of the api
        door by the caller: a server-owned role's records add
        apps.binding.create for its access row, and a secret-shaped value in
        the description answers 400 with the secret scan's sentence and fix.
        A name that holds a character which prints nothing (anything but
        letters, numbers, punctuation, symbols, marks and the plain space,
        with the braille blank, the variation selectors, the combining
        grapheme joiner and the default ignorable code points such as a
        Hangul filler refused), a whitespace character other than a plain
        space, a leading, trailing or doubled space, or letters from scripts
        that no one writing mixes answers 400 with a sentence that says what
        was found, such as "holds letters from both Cyrillic and Latin",
        where Latin with Han, Hiragana and Katakana, Latin with Han and
        Hangul, and Latin with Han and Bopomofo each read as one writing,
        while a live role whose name predates the rule still changes under
        its stored name, since 0.125.0.
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The new role's name and, optionally, its description and kind, or the server that owns it and its tools."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/DirectConflict" }
        "503": { $ref: "#/components/responses/DirectBusy" }

  /v1/admin/roles/{id}/export:
    get:
      operationId: exportRole
      tags: ["Roles, assignments and knowledge packs"]
      summary: Export the role as a canonical version-control document in application/yaml, name-keyed, id-free and byte-stable across exports
      description: >
        Canonical VCS document for the role (0.59.0; spec/objects kind
        Role): name-keyed, id-free, every list sorted so re-exports are
        byte-stable. application/yaml with a download disposition; one
        server serializer feeds strazactl and the console Download button.
        A server admin exports the roles their server owns and no other,
        and a global role answers 403 to them.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The role document
          content:
            application/yaml:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/roles/{id}:
    patch:
      operationId: updateRole
      tags: ["Roles, assignments and knowledge packs"]
      summary: Update a role's description, since the name and the kind are fixed at create
      description: >
        Update a role's description (0.58.0). Since 0.108.0 the kind is
        fixed at create for every role, so a kind other than the one the
        role has answers 400 and restating it is a no-op. Name is
        deliberately immutable: role names are policy selectors and IGA
        correlation keys, so a rename is a design act, not a field edit.
        Since 0.59.0 the control plane has its own kind (roles that
        carry standing in strazad itself; spelled "console" until 0.81.0 renamed the
        wire value to "straza"): the plane is fixed at create, straza and
        access kinds do not interconvert (400), and Straza roles
        take neither tools nor knowledge packs. Since 0.73.0 kind
        "approver" (spec/policyset revision 15) is decide authority only,
        on the access plane: it is fixed at create too (approver and
        access kinds do not interconvert, 400), it takes neither tools
        nor packs (400), it neither composes nor is composed (400), and it
        is the only kind, besides straza-admin by name, a policy may name
        in approve.roles. Since 0.106.0 the kind of a server-owned role is
        fixed at application (400), and the holder of a server's admin role
        changes the description of the roles their server owns and nothing
        else. Since 0.120.0 the change is published as a one-item draft of the
        api door by the caller, the role's live document with the new
        description. A PATCH that changes nothing answers 200 and writes
        nothing, no draft and no roles.update, and a secret-shaped value in
        the description answers 400.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The description or kind to change; an absent field keeps its value."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/DirectConflict" }
        "503": { $ref: "#/components/responses/DirectBusy" }
    delete:
      operationId: deleteRole
      tags: ["Roles, assignments and knowledge packs"]
      summary: Delete a role and cascade its assignments and access rows, 409 when a policy set, the product or a server still names it
      description: >
        Delete a role (cascades assignments and access rows). 409 when an ACTIVE
        policy set names the role in approve.roles: the body names every (set,
        rule) and the fix; drafts do not block (0.74.0). A product role, one
        whose name begins with straza-, answers 409 as well and can never be
        deleted, because straza-admin and the straza-enroll-* pair come with
        the product and a delete would cascade the assignments that carry
        console access and self-enrollment away from every holder (0.103.0).
        A role that a server names as its admin role answers 409 too, with
        the server's name: the role lives as long as the server does, so the
        fix is removing the server, which takes the role with it (0.104.0).
        Since 0.106.0 the holder of a server's admin role deletes a role
        their server owns while nobody holds it, directly or through a
        business role, else 409 with the count and the way. Every delete
        writes straza.audit.admin roles.delete with the role id, its name
        and, for a server-owned role, its server.
        Since 0.120.0 the deletion is published as a one-item draft of the
        api door by the caller: it writes one roles.unassign per direct
        holder with the reason "role deleted", one roles.implication.delete
        per edge that goes, and straza.apps.updated for the server whose
        access row the role held.
        Since 0.125.0 the delete also turns off, in the same publish, every
        live policy set whose match.roles names the role and no other live
        role, since such a set would match nobody, writes one
        policy.deactivate per set, and answers sets_off with their names; a
        set turned off this way is deleted with 204 like any set that is
        off.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/RoleDeleted" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/DirectConflict" }
        "503": { $ref: "#/components/responses/DirectBusy" }

  /v1/admin/roles/{id}/implications:
    get:
      operationId: listRoleImplications
      tags: ["Roles, assignments and knowledge packs"]
      summary: List the roles this role composes, where each edge id is the composed role's id, the value the DELETE path takes
      description: >
        List the roles this role composes (0.58.0; the edges the
        resolver applies). Each edge's
        id IS the composed role's id (the edge has no row id of its own)
        and is what the DELETE path consumes.
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Composition edges
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, description: "the composed role's id (natural key; feed it to DELETE)" }
                    implies_id: { type: string }
                    implies_name: { type: string }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: addRoleImplication
      tags: ["Roles, assignments and knowledge packs"]
      summary: Add a composition edge (rejected if it would create a cycle)
      description: >
        Since 0.120.0 the edge is published as a one-item draft of the api
        door by the caller, the role's live document with the composed role
        added, and writes straza.audit.admin roles.implication.create. An id
        no role has answers 400 "add implication failed: no role has the id
        <id>. Read the ids with strazactl roles list.", and an edge that
        exists answers 400 "add implication failed: <role> implies <implied>
        already.".
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The id of the role this role composes."
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                implies_role_id: { type: string }
              required: [implies_role_id]
      responses:
        "201": { description: Edge added }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/DirectConflict" }
        "503": { $ref: "#/components/responses/DirectBusy" }

  /v1/admin/roles/{id}/implications/{implicationId}:
    delete:
      operationId: deleteRoleImplication
      tags: ["Roles, assignments and knowledge packs"]
      summary: Remove a composition edge, named by the composed role's id, effective at the subjects' next check-in
      description: >
        Remove a composition edge (0.58.0). implicationId is the composed
        role's id, exactly as the list serves it. Edges shape role
        resolution, so the removal takes effect at the subjects' next
        check-in like every identity write.
        Since 0.120.0 the removal is published as a one-item draft of the
        api door by the caller and writes straza.audit.admin
        roles.implication.delete.
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: implicationId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/DirectConflict" }
        "503": { $ref: "#/components/responses/DirectBusy" }

  /v1/admin/assignments:
    get:
      operationId: listAssignments
      tags: ["Roles, assignments and knowledge packs"]
      summary: List role assignments (optionally filtered by subject)
      security: [{ adminBearer: [] }]
      parameters:
        - { name: subject_kind, in: query, schema: { type: string, enum: [user] } }
        - { name: subject_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Assignment" } }
    post:
      operationId: createAssignment
      tags: ["Roles, assignments and knowledge packs"]
      summary: Assign a role to a user (optionally time-boxed; group subjects retired with the unified role model)
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The subject, the role to assign and, optionally, the validity window."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Assignment" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/assignments/{id}:
    delete:
      operationId: deleteAssignment
      tags: ["Roles, assignments and knowledge packs"]
      summary: Remove an assignment
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/packs:
    get:
      operationId: listPacks
      tags: ["Roles, assignments and knowledge packs"]
      summary: List knowledge packs
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Packs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Pack" } }
    post:
      operationId: createPack
      tags: ["Roles, assignments and knowledge packs"]
      summary: Create a knowledge pack (checksum computed server-side)
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The pack's name, version and content; the checksum is computed by the server."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pack" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/packs/{id}:
    delete:
      operationId: deletePack
      tags: ["Roles, assignments and knowledge packs"]
      summary: Delete a knowledge pack that no role is bound to
      description: >
        Delete a knowledge pack. A pack a role is still bound to is refused,
        because the delete would take the pack away from every session that
        holds one of those roles at its next check-in: the answer names the
        roles to a caller who may read them and counts them for any other,
        and the fix is unbinding the pack from each of them first.
        The bound check is part of the delete statement, so a binding that
        lands while the request runs is refused the same way (0.125.0).
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: A role is still bound to the pack. The sentence names the roles to a caller who may read them, counts them for any other, and says to unbind the pack from each first.
          content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } }

  /v1/admin/packs/{id}/bindings:
    post:
      operationId: bindPack
      tags: ["Roles, assignments and knowledge packs"]
      summary: Bind a knowledge pack to a role
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The id of the role that receives the pack."
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role_id: { type: string }
              required: [role_id]
      responses:
        "201":
          description: Bound
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackBinding" }

  /v1/admin/packs/{id}/bindings/{bindingId}:
    delete:
      operationId: unbindPack
      tags: ["Roles, assignments and knowledge packs"]
      summary: Unbind a knowledge pack from a role, named by the role id, exactly as the packs list serves each binding's id
      description: >
        Unbind a knowledge pack from a role (0.58.0). bindingId is the role id,
        exactly as the packs list serves each binding's id (the edge has
        no row id of its own).
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: bindingId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/sessions:
    get:
      operationId: listSessions
      tags: ["Sessions and transcripts"]
      summary: List sessions, newest first or sorted by last seen, user, status or attestation, optionally filtered by status or user
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/pageLimit" }
        - { $ref: "#/components/parameters/pageCursor" }
        - { name: status, in: query, schema: { type: string, enum: [active, revoked, closed] }, description: "Unknown values are a 400, never an empty 200." }
        - { name: user, in: query, schema: { type: string }, description: "Filter to one user's sessions (user id)." }
        - name: sort
          in: query
          schema: { type: string, enum: [started, last_seen, user, status, attestation] }
          description: >
            The order of the page (0.100.0, paged lane only): started and
            last_seen open on the newest, user (the owner's username),
            status and attestation on A; absent is started. A cursor
            continues only the sort and order it was minted under; any
            other is a 400.
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
          description: The direction of the sort; absent takes the key's own default
      responses:
        "200":
          description: Sessions, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
        "400": { $ref: "#/components/responses/Error" }

  /v1/admin/sessions/{id}/revoke:
    post:
      operationId: revokeSession
      tags: ["Sessions and transcripts"]
      summary: Revoke one session (the kill switch)
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/sessions/revoke:
    post:
      operationId: revokeSessionsBulk
      tags: ["Sessions and transcripts"]
      summary: Revoke a named set of sessions (at most 1000) or every active session of one user, and count what was revoked
      description: >
        Bulk session stand-down: one call revokes a set of
        sessions, named explicitly (≤1000) or every ACTIVE session of a
        user, emitting ONE straza.revocation.sessions control event per
        1000-id chunk (spec/events rev 17) instead of per-session control
        traffic. Per-id semantics match the single revoke exactly
        (stand-down, not lockout). Unknown/already-dead ids are skipped;
        the response counts what was actually revoked.
      security: [{ adminBearer: [] }]
      requestBody:
        description: "Either the session ids to revoke, at most 1000, or the user whose active sessions to revoke, plus an optional reason."
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessions: { type: array, items: { type: string }, maxItems: 1000 }
                user: { type: string, description: user id or username; expands server-side to their active sessions }
                reason: { type: string }
      responses:
        "200":
          description: Count of sessions revoked by this call
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /v1/admin/signing-keys/rotate:
    post:
      operationId: rotateSigningKey
      tags: ["Sessions and transcripts"]
      summary: Stage a new session signing key
      description: >
        Phase one of a two-phase rotation (0.93.0). The server creates a
        session signing key with status staged and publishes its public key
        in the JWKS at once, so every replica verifies tokens signed with it
        from its next key reload, which runs every 30 seconds. No replica
        signs with the staged key yet. Two reload intervals later the
        rotation janitor on any replica promotes it: the staged key becomes
        active and the previous key becomes retiring, which still verifies.
        The retiring key is retired once every credential it could have
        signed has expired, the 30-day enroll and approver device
        credentials included, plus one reload interval; a raised
        governance.deviceTokenTTL lengthens that wait. The response carries
        both timings in seconds. A call while a staged key exists answers
        with that key and creates no second one. Every call writes one
        straza.audit.admin record with action signing-keys.rotate and the
        kid. The scope area is sessions.
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: The staged key and when it takes effect
          content:
            application/json:
              schema:
                type: object
                properties:
                  kid: { type: string }
                  status: { type: string, enum: [staged] }
                  active_in_seconds: { type: integer, description: "Seconds until the janitor promotes the key, two reload intervals." }
                  previous_key_verifies_for_seconds: { type: integer, description: "Seconds from now until the previous key stops verifying." }
                required: [kid, status, active_in_seconds, previous_key_verifies_for_seconds]

  /v1/admin/signing-keys:
    get:
      operationId: listSigningKeys
      tags: ["Sessions and transcripts"]
      summary: Every signing key with its purpose and status
      description: >
        Lists the client assertion, session and snapshot keys (0.111.0) so an
        operator can see that a staged key was promoted or an old key
        retired. The answer carries no key material of either half. The
        scope area is sessions.
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: The keys, grouped by purpose, newest first within one
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    kid: { type: string }
                    purpose: { type: string, enum: [client_assertion, session, snapshot] }
                    status: { type: string, enum: [staged, active, retiring, retired] }
                    created_at: { type: string, format: date-time }
                    rotated_at: { type: string, format: date-time, description: "When the status last changed. Absent for a key whose status never changed." }
                  required: [kid, purpose, status, created_at]

  /v1/admin/signing-keys/client-assertion/rotate:
    post:
      operationId: rotateClientAssertionKey
      tags: ["Sessions and transcripts"]
      summary: Stage a new client assertion key, or create the first one
      description: >
        The client assertion key signs the assertion with which an agent's
        client gets a token at the customer's identity provider, so whoever
        holds it can sign in as any agent (0.111.0). The route therefore
        passes a full administrator only, the role straza-admin or an admin
        API token with the scope full, and no area grant opens it. A session
        that a coding harness checked in is refused even for a full
        administrator. The server creates an RSA 3072 key with status staged,
        seals its private half under the secrets KEK and publishes the public
        half in the client assertion key document at once. Two reload
        intervals later the janitor promotes it, and the previous key stays
        published until every assertion it signed has expired. The database
        holds at most one staged and one active key, so concurrent calls on
        several replicas stage one key, and a call while a staged key exists
        answers with that key. The call that created the key writes one
        straza.audit.admin record with purpose and kid: signing-keys.create
        when no key signs today, else signing-keys.rotate.
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: The staged key and when it takes effect
          content:
            application/json:
              schema:
                type: object
                properties:
                  kid: { type: string }
                  status: { type: string, enum: [staged] }
                  previous_kid: { type: string, description: "The key that signs today. Absent when none does." }
                  active_in_seconds: { type: integer, description: "Seconds until the janitor promotes the key, two reload intervals." }
                  previous_key_verifies_for_seconds: { type: integer, description: "Seconds from now until the previous key leaves the key document." }
                  jwks_uri: { type: string, description: "The key document, to register as the JWKS URL of each agent's client." }
                required: [kid, status, active_in_seconds, previous_key_verifies_for_seconds, jwks_uri]
        "403": { $ref: "#/components/responses/Error" }

  /v1/admin/signing-keys/client-assertion/{kid}/retire:
    post:
      operationId: retireClientAssertionKey
      tags: ["Sessions and transcripts"]
      summary: Retire one client assertion key at once
      description: >
        The lever for a key that may have been copied (0.111.0), behind the
        same full administrator gate as the rotate route. The key leaves this
        replica's key document at once and every other replica's at its next
        reload. Retiring the key that signs leaves nothing to sign with until
        a new key is staged and promoted, so every agent that uses client
        credentials is refused for about a minute after the next rotate call.
        The identity provider may hold the retired key in its own cache. The
        call that retired the key writes one straza.audit.admin record with
        action signing-keys.retire, purpose, kid and was. A key that is
        retired already answers 200 with was retired and writes no record. A
        key of another purpose answers 409.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: kid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The retired key and the state it was in
          content:
            application/json:
              schema:
                type: object
                properties:
                  kid: { type: string }
                  status: { type: string, enum: [retired] }
                  was: { type: string, enum: [staged, active, retiring, retired] }
                  leaves_document_in_seconds: { type: integer, description: "Seconds until every replica has dropped the key, one reload interval." }
                  next_key_active_in_seconds: { type: integer, description: "Seconds a key staged now would need before it signs." }
                required: [kid, status, was, leaves_document_in_seconds, next_key_active_in_seconds]
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/admin/sessions/{id}/transcript:
    get:
      operationId: getSessionTranscript
      tags: ["Sessions and transcripts"]
      summary: One session's recorded conversation, in order (recording is policy-opted-in; empty when the session was never recorded)
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Transcript
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  username: { type: string }
                  turns:
                    type: array
                    items: { $ref: "#/components/schemas/ConversationTurn" }

  /v1/admin/transcripts:
    get:
      operationId: listTranscripts
      tags: ["Sessions and transcripts"]
      summary: List recorded conversations, one row per session, newest activity first, with turn count and a preview of the latest turn
      security: [{ adminBearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 1000 } }
      responses:
        "200":
          description: Recorded conversations, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    session_id: { type: string }
                    user_id: { type: string }
                    username: { type: string }
                    turns: { type: integer }
                    first_at: { type: string, format: date-time }
                    last_at: { type: string, format: date-time }
                    preview: { type: string, description: "First 200 chars of the latest turn" }

  /v1/admin/transcripts/search:
    get:
      operationId: searchTranscripts
      tags: ["Sessions and transcripts"]
      summary: Search recorded turns by substring or by exact content hash, or list the newest recorded turns when neither is given
      description: >
        Recorded-turn read surface. With q (substring scan) and/or hash (exact
        full-content match; the client hashes secret values locally so plaintext
        never travels) it is the leak hunt; with neither it lists the newest
        recorded turns (browse view), optionally user-scoped (0.28.0, previously
        a filter was required)
      security: [{ adminBearer: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: hash, in: query, schema: { type: string }, description: "sha256:<hex> of the exact full content" }
        - { name: user, in: query, schema: { type: string }, description: user id or username
          }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000 } }
      responses:
        "200":
          description: Matching (or, unfiltered, the most recent) turns, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConversationTurn" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/admin/approvals:
    get:
      operationId: listApprovals
      tags: ["Approvals"]
      summary: List approval records (mode:approve workflow)
      security: [{ adminBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/pageLimit" }
        - { $ref: "#/components/parameters/pageCursor" }
        - { name: state, in: query, schema: { type: string, enum: [pending, approved, denied, expired, all] }, description: "Default pending. Unknown values are a 400 (0.46.0; they used to coerce to pending)." }
      responses:
        "200":
          description: Approval records
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/admin/approvals/{id}:
    get:
      operationId: getApproval
      tags: ["Approvals"]
      summary: Read one approval record
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval: { $ref: "#/components/schemas/Approval" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/admin/approvals/{id}/approve:
    post:
      operationId: approveApproval
      tags: ["Approvals"]
      summary: Approve a pending request as a person who may decide it
      description: >
        Approve the record as the person the bearer names. A person's session
        or ID token passes; an admin API token carries no person and reads
        401. A session a coding harness checked in reads 403, as does, while
        the record is pending, a person outside the record's deciders or a
        requester deciding their own request.
      security: [{ userBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The decider's optional reason; the body may be absent."
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecideBody" }
      responses:
        "200":
          description: The resolved record
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            The record was already decided with the other verdict. A decider
            who repeats the verdict the record carries reads 200 with the
            record.
          content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } }
        "410": { $ref: "#/components/responses/Error" }

  /v1/admin/approvals/{id}/deny:
    post:
      operationId: denyApproval
      tags: ["Approvals"]
      summary: Deny a pending request as a person who may decide it
      description: >
        Deny the record as the person the bearer names. A person's session
        or ID token passes; an admin API token carries no person and reads
        401. A session a coding harness checked in reads 403, as does, while
        the record is pending, a person outside the record's deciders or a
        requester deciding their own request.
      security: [{ userBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        description: "The decider's optional reason; the body may be absent."
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalDecideBody" }
      responses:
        "200":
          description: The resolved record
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: >
            The record was already decided with the other verdict. A decider
            who repeats the verdict the record carries reads 200 with the
            record.
          content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } }
        "410": { $ref: "#/components/responses/Error" }

  /v1/admin/approvals/channels:
    get:
      operationId: listApprovalChannels
      tags: ["Approvals"]
      summary: Notification channel status, covering configuration, enrolled devices vs push routes, last delivery attempt
      description: >
        One row per channel the deployment knows (console, slack, push),
        configured or not; an unconfigured row names the config key that
        would enable it. The push row carries the enrolled-devices vs
        registered-push-routes gap (a device without a route decides but never
        notifies its owner). last_delivery is the most recent REAL delivery attempt
        (test sends included); its note never carries approval content.
      security: [{ adminBearer: [] }]
      responses:
        "200":
          description: Channel statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/ApprovalChannelStatus" }

  /v1/admin/approvals/channels/{name}/test:
    post:
      operationId: testApprovalChannel
      tags: ["Approvals"]
      summary: Fire a synchronous test notification through one channel's real delivery path
      description: >
        Rides the SAME senders as live deliveries (allowlist, timeouts,
        pruning), so a green result is evidence the real pipe works. Returns
        200 with per-target outcomes even when individual targets fail; the
        report carries the truth. 400 for the console (a pull surface, nothing
        to send) or an unconfigured channel; 404 for an unknown channel name.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, enum: [console, slack, push] } }
      responses:
        "200":
          description: Per-target test outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel: { type: string }
                  targets:
                    type: array
                    items:
                      type: object
                      properties:
                        target: { type: string }
                        ok: { type: boolean }
                        error: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/approval/callbacks/slack:
    post:
      operationId: slackApprovalCallback
      tags: ["Approvals"]
      summary: Slack interactive (block_actions) approval callback, verified by X-Slack-Signature, not a bearer token
      requestBody:
        description: "A form with one field, payload, carrying the Slack block_actions interaction JSON that Slack signed."
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                payload: { type: string, description: "Slack block_actions interaction JSON" }
      responses:
        "200": { description: "Acknowledged: the decision was recorded, or the ephemeral reply says in words why not, including a person whose Straza user is disabled or locked" }
        "401": { $ref: "#/components/responses/Error" }

  # --- Mobile approver surface, the routes the phone approver app calls.
  # Enrollment is unauthenticated (the one-time enroll token
  # is the credential); every other route requires a use=approver DEVICE token
  # (a session/login/device/connect token is refused). Decisions are
  # hardware-signed (ECDSA P-256), single-use (per-fetch challenge), idempotent.
  /v1/admin/approvers/enroll-token:
    post:
      operationId: mintApproverEnrollToken
      tags: ["Approvals"]
      summary: Mint a one-time approver enroll token (rendered as a QR) for a user
      security: [{ adminBearer: [] }]
      requestBody:
        description: "The user to mint the enroll token for, by id or username."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproverEnrollTokenRequest" }
      responses:
        "200":
          description: >
            The one-time enroll token plus everything a client needs to render
            the enroll QR verbatim: the server base-URL list, the
            TLS SPKI pin (only when strazad serves its own TLS, absent on
            plaintext/ingress-terminated deployments, where public-CA trust is
            assumed), the deployment's public Firebase app config (BYO-Firebase,
            only when configured; see FCMAppConfig), the WebPush VAPID advert
            (only when that lane is configured, see WebPushAdvert; since
            0.42.0 the QR carries the same object the enroll 201 returns), and
            qr_payload, the exact JSON string to encode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproverEnrollTokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/approvals/self/enroll-token:
    post:
      operationId: mintSelfApproverEnrollToken
      tags: ["The calling user"]
      summary: Mint a one-time approver enroll token for the CALLING user (self-service)
      description: >
        The self-service twin of the admin mint, added for the browser
        approvals surface (0.57.0): any authenticated USER identity (session
        token or login token; wat_ admin API tokens are refused, they carry no user)
        mints an enroll token bound to themself. Since 0.81.0 the body carries
        exactly one field, the required channel; every OTHER body field stays
        deliberately ignored, self-scoping is by construction and minting for
        another user stays the admin surface. The caller must be a person
        holding the channel's enrollment role (straza-enroll-mobile or
        straza-enroll-browser) or straza-admin; agent and service identities
        are refused. The minted token is channel-scoped and enrolls only a
        matching device platform (mobile takes ios and android, browser takes
        browser); admin-minted tokens stay unscoped. Answers 429 with
        Retry-After inside the per-user cooldown window; a 403 refusal does
        not consume the cooldown.
      security: [{ userBearer: [] }]
      requestBody:
        description: "The device class the token may enroll; every other field is ignored."
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [mobile, browser]
                  description: >
                    Which device class this token may enroll. Checked against
                    the caller's enrollment roles at mint and against the
                    device platform at consume.
      responses:
        "200":
          description: >
            Identical envelope to the admin mint (same assembly path, the two
            surfaces cannot disagree), bound to the calling user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproverEnrollTokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/self:
    get:
      operationId: getSelf
      tags: ["The calling user"]
      summary: The calling user's identity, admin standing, and enrollment eligibility
      description: >
        The one whoami read both browser surfaces consult after sign-in
        (0.83.0; supersedes GET /v1/approvals/self/enrollment). Accepts a
        session or login token (wat_ admin API tokens are refused: no user, no
        self). admin_grants speaks the checkin vocabulary ("full" or the
        canonical "area:verb,..." union) and is OMITTED when the caller has
        no admin standing, exactly like the checkin response, so the
        approvals page's "Open the console" link and the console's tab
        discovery read the same truth. enroll_channels is ALWAYS present
        and computed by the same logic that gates the self mint, so an
        offered button and a minted token can never disagree: an empty list
        is a normal answer, not a refusal (role-less people and agent
        identities are eligible for nothing), channels are sorted (browser
        before mobile), and straza-admin reads as eligible for both.
        sponsored is always present as well (0.97.0): the usernames of the
        active users the caller sponsors, sorted, an empty list when there
        are none; the connections page reads the servers of each.
        Display only; every admin route re-derives authority per request.
      security: [{ userBearer: [] }]
      responses:
        "200":
          description: The caller's self view.
          content:
            application/json:
              schema:
                type: object
                required: [username, user_kind, enroll_channels, sponsored]
                properties:
                  username: { type: string }
                  user_kind:
                    type: string
                    enum: [human, nhi]
                  admin_grants:
                    type: string
                    description: >
                      "full" or the canonical "area:verb,..." union; the key
                      is absent when the caller has no admin standing.
                  enroll_channels:
                    type: array
                    items:
                      type: string
                      enum: [mobile, browser]
                  sponsored:
                    type: array
                    description: The usernames of the active users whose sponsor is the caller, sorted; an empty list when there are none.
                    items: { type: string }
        "401": { $ref: "#/components/responses/Error" }

  /v1/self/servers:
    get:
      operationId: getSelfServers
      tags: ["The calling user"]
      summary: The servers the acting user reaches or is connected to, with the state of their account on each
      description: >
        One row per managed MCP server that the acting user's roles reach through an
        access row or that holds the user's own connection, sorted by server
        name (0.97.0). The connections page reads it to show a person the
        state of the account each server uses for them. A server of credential
        kind none is listed when reached, so the page can count it; a server
        that is neither reached nor connected is left out. user names an
        agent the caller sponsors, or any user when the caller is an
        administrator, under the same rule as the connect routes. No row
        ever carries a token value.
        The session is judged on every request as on the admin API: a user
        who is disabled, deleted or locked, a revoked session and a revoked
        device are refused with 403 or 401 and one straza.audit.authn login
        failure record, and a store outage answers 503.
        An AI agent's own session is admitted, as on the other connect
        routes.
      security: [{ sessionBearer: [] }]
      parameters:
        - { name: user, in: query, schema: { type: string }, description: "Act for this user (username or id), for a sponsor or an administrator" }
      responses:
        "200":
          description: The rows, sorted by server name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServerRow" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/admin/approvers:
    get:
      operationId: listApproverDevices
      tags: ["Approvals"]
      summary: List enrolled approver devices, the id source for the revoke route
      description: >
        The discoverability half of the approver-device kill switch: the
        DELETE below needs the apd_ device id, and the enroll response that
        carried it went to the phone, not the admin. One row per enrolled
        phone with owner (username-resolved), posture
        (platform/key_security_level/attestation), enrolled/last-seen times,
        and its push-registration count; a device without a push route
        decides but never notifies its owner, and the count attributes the channel-status
        "enrolled vs push routes" diagnostic to a specific phone. ?user
        filters by username or user id; an unknown value lists empty.
      security: [{ adminBearer: [] }]
      parameters:
        - { name: user, in: query, schema: { type: string, description: username or user id } }
      responses:
        "200":
          description: Enrolled approver devices, in enrollment order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, description: apd_-prefixed device id (what the revoke takes) }
                    user_id: { type: string }
                    username: { type: string }
                    name: { type: string }
                    platform: { type: string }
                    key_security_level: { type: string }
                    attestation: { type: string }
                    enrolled_at: { type: string, format: date-time }
                    last_seen: { type: string, format: date-time }
                    push_routes: { type: integer }

  /v1/admin/approvers/{id}:
    delete:
      operationId: revokeApproverDevice
      tags: ["Approvals"]
      summary: Revoke (delete) an enrolled approver device, so its use=approver token then fails immediately (row-backed)
      security: [{ adminBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/approver/enroll:
    post:
      operationId: approverEnroll
      tags: ["The approver surface"]
      summary: Enroll an approver device (no auth; the one-time enroll token is the credential)
      description: >
        Consumes the one-time enroll token and registers a hardware ECDSA P-256
        key. The public_key is base64 X.509 SubjectPublicKeyInfo DER; the curve
        is read from the key itself (the SPKI OID is authoritative), so a lying
        key_alg cannot steer the server. Returns a 30-day use=approver device
        token. key_security_level and attestation.kind are recorded as posture,
        never trusted as claims. When the deployment carries a public Firebase
        app config, the response also hands the phone the fcm object
        (BYO-Firebase, see FCMAppConfig); absent, the Straza approver app stays on the
        UnifiedPush/ntfy lane. When the WebPush lane is configured the
        response also carries webpush.vapid_public_key (see
        ApproverEnrollResponse); absent, only the legacy keyless UnifiedPush
        lane exists.
      requestBody:
        description: "The one-time enroll token and the device's public key, name, platform and reported key posture."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproverEnrollRequest" }
      responses:
        "429": { $ref: "#/components/responses/ApproverThrottled" }
        "201":
          description: Enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproverEnrollResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/approver/refresh/challenge:
    post:
      operationId: approverRefreshChallenge
      tags: ["The approver surface"]
      summary: Mint a challenge for a device-key-signed token refresh (no bearer; an expired token must not block its own refresh)
      description: >
        Returns a fresh single-use challenge (base64, ≤5m) the device signs with
        its enrolled hardware key to obtain a new token without a QR re-scan. No
        auth by design: an expired token cannot block its own refresh, and the
        challenge is inert without the private key, so echoing a device id is not
        a leak. Reuses the approver_challenges table under a refresh sentinel
        (no schema change). An unknown/revoked device is 404; there is nothing
        to retire here.
      requestBody:
        description: "The id of the approver device that signs the challenge."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproverRefreshChallengeRequest" }
      responses:
        "429": { $ref: "#/components/responses/ApproverThrottled" }
        "200":
          description: A fresh single-use refresh challenge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproverRefreshChallengeResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ApproverError" }

  /v1/approver/refresh:
    post:
      operationId: approverRefresh
      tags: ["The approver surface"]
      summary: Exchange a device-key signature over a refresh challenge for a fresh 30-day token (no bearer)
      description: >
        signature = ECDSA-P256/SHA-256, ASN.1 DER, base64, over the exact byte
        string "refresh" + "\n" + approver_device_id + "\n" + challenge, a
        distinct domain from the decide message, so a decide signature can never
        be replayed as a refresh. The server verifies against the enrolled key,
        re-checks the device row (revocation) and bound-user activity, consumes
        the challenge atomically (single-use), then mints the SAME 30-day
        use=approver token (no scope change). On failure it returns a
        machine-readable 401 code (device_revoked ⇒ the app destroys its key;
        token_invalid / user_inactive ⇒ it does not).
      requestBody:
        description: "The device id, the challenge it received and the device key's signature over the refresh string."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproverRefreshRequest" }
      responses:
        "429": { $ref: "#/components/responses/ApproverThrottled" }
        "200":
          description: A fresh device token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproverRefreshResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/ApproverError" }
        "503": { $ref: "#/components/responses/ApproverError" }

  /v1/approver/pending:
    get:
      operationId: approverPending
      tags: ["The approver surface"]
      summary: List pending approvals for this device's bound user
      description: >
        scope=decidable (default) returns records the bound user MAY decide;
        eligibility is filtered server-side (approve-role membership or
        straza-admin fallback, requester self-exclusion, and kind=nhi is never a decider) and
        each row carries a fresh single-use challenge. scope=mine returns the
        bound user's OWN requests (status-watching): rows carry state and no
        challenge. summary is the redacted tool identity only (never raw
        arguments); justification is the agent's stated reason, UNVERIFIED,
        render as such.
      security: [{ approverBearer: [] }]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [decidable, mine] }, description: "Default decidable." }
      responses:
        "429": { $ref: "#/components/responses/ApproverThrottled" }
        "200":
          description: Pending rows
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ApproverRow" } }
        "401": { $ref: "#/components/responses/ApproverError" }
        "503": { $ref: "#/components/responses/ApproverError" }

  /v1/approver/decide:
    post:
      operationId: approverDecide
      tags: ["The approver surface"]
      summary: Submit a hardware-signed, single-use approval decision
      description: >
        The signature is ECDSA-P256/SHA-256, ASN.1 DER, base64, over the exact
        byte string request_id + "\n" + verdict + "\n" + challenge + "\n" + ts
        (verdict is the literal approve|deny; ts is decimal unix seconds). When
        the optional reason travels (0.63.0), the string grows a 5th line:
        + "\n" + lowercase hex sha256(reason), binding the decider's words to
        the same key as the verdict. The
        server rebuilds that string from the parsed fields, verifies against the
        enrolled key (variable-length sig, no length check), enforces a ±5m ts
        window, consumes the challenge atomically (single-use; replay ⇒ 401),
        then applies the same authorization every lane runs (fresh approve-role
        check, and kind=nhi is never a decider). Idempotent: a double-tap (fresh challenge) on
        a resolved record returns 409 with the final state. The resolved record
        persists the honest decider surface (phone|browser from the enrolled
        device) and the signing device id.


        Failures carry a machine-readable `code` (ApproverError envelope) the app
        branches on. The 401 splits two ways: `challenge_rejected` is the single
        COARSE code for the whole verification family, covering stale/skewed timestamp,
        bad or unparseable device key, bad signature, or a missing/expired/spent
        (replayed) challenge, and means "re-fetch a fresh challenge and retry",
        never a key-destroy (per-cause codes would be a signature/verifier
        oracle); `device_revoked` is the ONLY key-destroy signal (the device row
        is gone). The 403 carries `not_authorized`, meaning the bound user may not decide
        THIS record: no approve role on a fresh check, requester self-exclusion bars
        self-approval, or the user is no longer a person because an administrator or
        the identity manager retyped it as an AI agent or a service account, in which
        case the error sentence names the user and how to set its type back. Token and
        key stay valid. The 400 (bad verdict / malformed
        body), 404 (unknown id), 410 (expired) and the 409 final-state body are
        plain (no code).
      security: [{ approverBearer: [] }]
      requestBody:
        description: "The request id, the verdict, the challenge, the client timestamp, the device key's signature and optionally the decider's reason."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproverDecideRequest" }
      responses:
        "429": { $ref: "#/components/responses/ApproverThrottled" }
        "200":
          description: Resolved
          content:
            application/json:
              schema: { type: object, properties: { state: { type: string, enum: [approved, denied] } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/ApproverError" }
        "503": { $ref: "#/components/responses/ApproverError" }
        "403": { $ref: "#/components/responses/ApproverError" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: Already resolved, final state returned
          content:
            application/json:
              schema: { type: object, properties: { state: { type: string } } }
        "410": { $ref: "#/components/responses/Error" }

  /v1/approver/push:
    put:
      operationId: approverPushRegister
      tags: ["The approver surface"]
      summary: Register (or dedupe) a push route for this approver device
      description: >
        kind=unifiedpush and kind=webpush endpoints must be https with a host
        present in approval.push.allowedPushHosts ("*.suffix" entries match
        subdomains); otherwise 400 (fail-safe: an empty allowlist refuses
        every endpoint-bearing registration). Delivery is server-side outbound
        only and carries the opaque {v,ref,kind} envelope. fcm delivers when
        approval.push.fcm is configured. webpush delivers the full Web Push
        protocol (RFC 8291 aes128gcm body, RFC 8292 VAPID, RFC 8030
        TTL/Urgency/Topic) and REQUIRES p256dh+auth plus a configured
        approval.push.webpush.vapidKeyFile. unifiedpush WITHOUT keys keeps the
        legacy plain-JSON POST (spec-2, the current app's lane; existing
        registrations are never flipped); WITH keys it opts in to the same
        encrypted protocol (UnifiedPush spec 3). apns delivers when
        approval.push.apns is configured, and an apns registration is stored
        but not delivered while it is not.
      security: [{ approverBearer: [] }]
      requestBody:
        description: "The push route to register: its kind, the token or endpoint, and for Web Push the subscription keys."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproverPushRequest" }
      responses:
        "429": { $ref: "#/components/responses/ApproverThrottled" }
        "200": { $ref: "#/components/responses/Status" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/ApproverError" }
        "503": { $ref: "#/components/responses/ApproverError" }
    delete:
      operationId: approverPushDelete
      tags: ["The approver surface"]
      summary: Remove a push route for this approver device (idempotent)
      security: [{ approverBearer: [] }]
      requestBody:
        description: "The push route to remove, addressed by the same kind, token or endpoint and keys it registered with."
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproverPushRequest" }
      responses:
        "429": { $ref: "#/components/responses/ApproverThrottled" }
        "200": { $ref: "#/components/responses/Status" }
        "401": { $ref: "#/components/responses/ApproverError" }
        "503": { $ref: "#/components/responses/ApproverError" }

  /v1/approver/history:
    get:
      operationId: approverHistory
      tags: ["The approver surface"]
      summary: Resolved records visible to the bound user (own OR decidable-eligible), newest first, keyset paginated
      security: [{ approverBearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 200, default: 50 }, description: "Page size; over-max is clamped to 200, not rejected." }
        - { name: cursor, in: query, schema: { type: string }, description: "Opaque next_cursor from a previous page; absent = newest page. A stale/garbled cursor is 400 invalid_cursor. Drop it and re-fetch from the top." }
      responses:
        "429": { $ref: "#/components/responses/ApproverThrottled" }
        "200":
          description: A page of resolved rows plus an opaque continuation token
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ApproverRow" }
                  next_cursor:
                    type: string
                    description: "Opaque; pass verbatim as ?cursor= to load older rows. Empty ⇒ no more pages. Pages may be shorter than limit after visibility filtering yet still carry a next_cursor. Keep paging until it is empty."
                required: [items, next_cursor]
        "400": { $ref: "#/components/responses/ApproverError" }
        "401": { $ref: "#/components/responses/ApproverError" }
        "503": { $ref: "#/components/responses/ApproverError" }

  /v1/approver/enrollment:
    delete:
      operationId: approverSelfUnenroll
      tags: ["The approver surface"]
      summary: Retire the CALLING device's own enrollment (self-unenroll; row-backed, effect identical to the admin revoke)
      description: >
        The device's use=approver bearer is both the credential and the
        target: the server deletes the calling device row, so every future
        bearer use answers 401 device_revoked and the device's push
        registrations go inert, exactly as after
        DELETE /v1/admin/approvers/{id}. No request body. The audit event
        names the initiator (via=self here, via=admin on the admin lane).
        Deliberately bearer-only: the one net-new capability a stolen bearer
        gains is a visible fail-closed self-DoS, accepted because recovery is
        one re-enrollment and the quiet alternative (reading pending metadata
        undetected) is the more attractive attack. The app calls it
        best-effort before destroying its local key; a repeat call answers
        401 device_revoked (idempotence lives at the credential layer).
      security: [{ approverBearer: [] }]
      responses:
        "429": { $ref: "#/components/responses/ApproverThrottled" }
        "204":
          description: Enrollment retired; the bearer that made this call is dead from here on
        "401": { $ref: "#/components/responses/ApproverError" }
        "503": { $ref: "#/components/responses/ApproverError" }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: >-
        A session token or an ID token whose user holds the straza-admin role
        or a role mapped in admin.roleAreas, or an admin API token (prefix
        wat_, minted by strazactl api-token create) whose scope covers the
        route's area. The scim area of the same token is what opens /scim/v2.
        A session that a coding harness checked in is refused whatever roles
        its user holds, because the agent in that harness holds the token;
        the sessions of strazactl, the console and the self-service page pass.
        The user must be a person: an AI agent or a service account is
        refused on every admin route whatever roles it holds, a session
        whose user is disabled or locked is refused on its next request, and
        an ID token of a disabled or locked user is refused with 403 and one
        login failure record.
    userBearer:
      type: http
      scheme: bearer
      description: >-
        A person's session token or ID token. An admin API token is refused
        because it carries no user, so it can neither decide nor speak for
        itself. An ID token of a disabled or locked user is refused with 403
        and one login failure record.
    sessionBearer:
      type: http
      scheme: bearer
      description: >-
        The session token a client received at check-in; it names the only
        session the route acts on.
    approverBearer:
      type: http
      scheme: bearer
      description: >-
        The approver device token a phone or a browser receives at approver
        enrollment; every other token kind is refused.
  parameters:
    pageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1 }
      description: >
        Opt-in pagination (0.47.0): presence of limit or cursor switches the
        response to the {items, next_cursor} envelope; a bare request keeps the
        legacy shape. Default 100, over 500 clamps.
    pageCursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque continuation token from next_cursor; malformed or stale = 400.
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    ServiceUnavailable:
      description: >
        Straza could not reach its store or the issuer while checking the
        credential. The body is generic, the cause is in the server log
        only, and the Retry-After header gives seconds. Not a refusal:
        clients retry and keep every local credential. Answered by
        /v1/enroll, /v1/checkin and the
        admin/approvals bearer lanes; the approver surface answers the same
        condition as ApproverError code service_unavailable.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ApproverThrottled:
      description: >
        Per-IP rate limit on the DEDICATED approver listener (server.
        approverTLS.perIPRPS; the surface designed to face hostile networks).
        Any approver-surface request can receive it there; carries a
        Retry-After header (seconds). The app should back off and retry;
        never destroy or re-enroll anything on a 429. Absent on deployments
        serving the approver surface from the main listener or an ingress.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Error:
      description: >
        Error with actionable reason. Every response (this one included)
        carries an X-Request-Id header: a sane client-supplied id (at most 64
        printable ASCII bytes) is echoed, anything else is replaced by a
        minted UUIDv7.
        An admin write under /v1/admin/ (a POST, PUT, PATCH or DELETE,
        except the drafts routes and the approve and deny routes) runs to
        its end once authorized, also when its client disconnects, for up to
        five minutes. A write that runs longer answers 503 with this body,
        whatever it would have answered: the error says the change may or
        may not have been applied and to read it back before trying again.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              correlation_id:
                type: string
                description: >
                  The correlation id of this answer, present on 5xx and
                  recovered-panic answers. The same value is in the
                  X-Request-Id response header and the server log record
                  (key correlation_id). Not the approval request_id of the
                  approver surface.
            required: [error]
    DirectConflict:
      description: >
        The change did not land, and nothing was changed. Since 0.120.0 a
        direct admin write publishes its change as a one-item draft of the
        api door by the caller, so besides the route's own 409s it answers
        409 when the draft's check refuses the change, with the check's
        sentence and fix; when other changes kept landing at the same
        moment three times ("Straza could not make this change, because
        other changes kept landing at the same moment. Nothing was changed.
        Try again."); and, while admin.secondPerson is on, for a change
        whose check found a risk ("This deployment needs a second person to
        publish a change that widens access (admin.secondPerson), so this
        route cannot make it alone. Save it as a draft on the console under
        Drafts or with strazactl drafts create, and ask another
        administrator to publish it.").
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              correlation_id: { type: string }
            required: [error]
    DirectBusy:
      description: >
        The database turned the change away three times while other changes
        were written, and nothing was changed. Since 0.120.0 the error reads
        "Straza could not make this change, because the database turned it
        away three times while other changes were written. Nothing was
        changed. Try again in a moment." A store outage answers 503 with the
        generic body and a Retry-After header, as ServiceUnavailable
        describes.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              correlation_id: { type: string }
            required: [error]
    ApproverError:
      description: >
        Approver-surface error envelope. `error` is the reason in plain words;
        `code` is a machine-readable classifier present on every requireApprover
        401, on /v1/approver/refresh failures, on the /v1/approver/decide 401/403
        outcomes, and on the history feed's 400 invalid_cursor (only bare-prose
        approver errors, malformed-JSON 400s and the like, omit it). The app
        branches on it before touching its hardware key: token_expired ⇒ attempt
        a device-key-signed refresh (KEEP the key); device_revoked ⇒ the device
        was retired, DESTROY the key; missing_token / token_invalid /
        user_inactive ⇒ the credential is unusable and a refresh cannot fix it
        (key untouched); challenge_rejected ⇒ a decide failed verification
        (stale timestamp, bad key/signature, or a missing/expired/spent
        challenge; deliberately one coarse code, never a signature oracle) ⇒
        re-fetch a fresh challenge and retry, key untouched; not_authorized ⇒ the
        bound user may not decide THIS record (role, four-eyes, or the user is no longer a person), key untouched;
        invalid_cursor ⇒ a 400 on history, so drop the cursor and re-fetch from the
        top (NOT an auth failure; the key is untouched).
        service_unavailable ⇒ a 503, the store behind the check was down: retry
        later, key untouched (neither device_revoked nor user_inactive).
        Every answer also carries an X-Request-Id header.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code:
                type: string
                enum: [missing_token, token_expired, token_invalid, device_revoked, user_inactive, challenge_rejected, not_authorized, invalid_cursor, service_unavailable]
              correlation_id:
                type: string
                description: >
                  The correlation id of this answer, present on 5xx and
                  recovered-panic answers. The same value is in the
                  X-Request-Id response header and the server log record
                  (key correlation_id). Not the approval request_id of the
                  approver surface.
            required: [error]
    DraftTooLarge:
      description: >
        The body holds more than server.maxBodyBytes, the most strazad reads
        in one request, so it was not read. The error says to split the draft
        into smaller drafts, or to raise that setting.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
            required: [error]
    DraftsUnavailable:
      description: >
        Straza could not read what the route needs, live state above all, so
        nothing was saved or published. The error names the read that failed
        and says to try again. A Retry-After header, when present, gives the
        seconds to wait.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              correlation_id: { type: string, description: "The correlation id of the answer, as the server log records it." }
            required: [error]
    Status:
      description: Operation result
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
    RoleDeleted:
      description: >
        The role is deleted. sets_off names the live policy sets the delete
        turned off because their match.roles named only this role, and is
        absent when none was turned off.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              sets_off: { type: array, items: { type: string } }
  schemas:
    Count:
      type: object
      properties:
        total: { type: integer }
        active: { type: integer }
    ApprovalChannelStatus:
      description: >
        One notification-channel status row. devices/registrations
        are push-only (omit-empty): enrolled approver devices vs registered
        push routes; the gap is the diagnostic. last_delivery is the most
        recent delivery attempt on this channel (real or test); note is a
        short operator-facing description, never approval content.
      type: object
      properties:
        name: { type: string, enum: [console, slack, push] }
        configured: { type: boolean }
        detail: { type: string }
        devices: { type: integer }
        registrations: { type: integer }
        last_delivery:
          type: object
          properties:
            at: { type: string, format: date-time }
            ok: { type: boolean }
            note: { type: string }

    Approval:
      description: >
        One approval record a person decides (mode:approve workflow).
        decidedAt is null while pending; times are RFC3339. A record's class is
        `hold` (a bounded wait whose approval runs one call) or `ticket`: a
        day-scale request whose approval a later call consumes. The use fields (grantExpiresAt, consumedAt, consumedBy)
        are omit-empty; since policyset revision 23 a hold carries them once
        approved, as a ticket does.
      type: object
      properties:
        id: { type: string }
        state: { type: string, enum: [pending, approved, denied, expired] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
        user: { type: string }
        username: { type: string }
        session: { type: string }
        rule: { type: string }
        set: { type: string }
        lane: { type: string, enum: [hook, gateway] }
        summary: { type: string }
        justification: { type: string }
        approverRoles: { type: array, items: { type: string } }
        approverUsers: { type: array, items: { type: string }, description: "The usernames allowed to decide this record, resolved from the rule's approve.deciders at request time, today the requester's sponsor. Composable with approverRoles. A request whose deciders and roles both resolve to nobody is denied at request time and writes no record. straza-admin keeps decide rights only on a pending record with neither field that a server wrote before that deny landed, and on a selfApproval record with no deciders (policyset revision 14). Omitted when empty." }
        selfApproval: { type: boolean }
        mode: { type: string, enum: [approve, confirm], description: "Who decides the record: approve means the deciders in approverRoles plus selfApproval, confirm means the requester alone with those fields empty. Older servers omit the field; read that as approve." }
        decidedBy: { type: string }
        decidedByName: { type: string }
        channel: { type: string, enum: [console, slack, phone, browser, api], description: "The surface the decider used. Signed-lane decisions carry the enrolled device's own surface, phone or browser; rows decided before the surface was recorded carry the retired transport constant api." }
        decidedReason: { type: string, description: "The decider's own words on either verdict, optional, at most 500 bytes. On the signed lane its sha256 is the fifth line of the signed string, so it is key-bound. Omitted when none was given." }
        decidedDeviceId: { type: string, description: "The enrolled device whose key signed the decision, signed lane only. Omitted on console and Slack decisions." }
        class: { type: string, enum: [hold, ticket], description: "The approve class of the record, hold or ticket." }
        grantExpiresAt: { type: string, format: date-time, description: "The last moment the approval can be used by a later call: decidedAt + grantTTL for a ticket, decidedAt + retryTTLSeconds for a retry of a hold (revision 23). The held call that waited uses its approval when its wait ends. Omitted until approved, and on a hold approved by an older server." }
        consumedAt: { type: string, format: date-time, description: "When a call used the approval, a ticket's grant or a hold's one run. Omitted while unused." }
        consumedBy: { type: string, description: "The session that used the approval. Omitted while unused." }
        argsPreview: { type: string, description: "Redacted, display-safe, 2 KiB-capped preview of the concrete call arguments the fingerprint binds. Absent when the server-wide approval.preview knob is off or the call had no concrete args. The five preview fields travel together." }
        argsTruncated: { type: boolean, description: "True when argsPreview was head+tail elided past the 2 KiB cap." }
        argsBytes: { type: integer, description: "The byte length of the redacted preview before truncation, the size a person could have seen at full length. Not the raw pre-redaction size and not the audit copy's size." }
        argvHashPrefix: { type: string, description: "First 12 hex of the argv_hash digest (no 'sha256:' prefix); the visible non-binding tag beside the honesty line. Present only with argsPreview." }
        bindingScope: { type: string, enum: [call, tool_identity], description: "What the record's fingerprint covers. call means the concrete call including canonicalized mcp arguments under approve.binding call; tool_identity means MCP server and tool name only, from an explicit binding tool rule, arguments the server never observed, or an older record. Drives the honesty-line wording. Present only with argsPreview." }
    ApprovalDecideBody:
      description: >
        Optional body for the console and strazactl decide lanes. The
        endpoints predate it, so no body at all stays legal.
      type: object
      properties:
        reason: { type: string, description: "The decider's own words on either verdict, at most 500 bytes of plain text. No control characters beyond newline and tab, and no invisible direction or zero-width characters (U+202A..U+202E, U+2066..U+2069, U+200E, U+200F, U+061C, U+200B, U+FEFF), while ZWJ and ZWNJ stay legal; a failed check is a 400. Unsigned on this lane, while the signed approver lane binds it to the device key." }
    ApproverEnrollTokenRequest:
      description: Identify the user to mint an approver enroll token for (one of the two).
      type: object
      properties:
        user_id: { type: string }
        username: { type: string }
    ApproverEnrollTokenResponse:
      type: object
      properties:
        enroll_token: { type: string, description: "One-time secret; shown once." }
        expires_in: { type: integer, description: "Seconds until the enroll token expires." }
        user:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
        servers:
          type: array
          items: { type: string }
          description: "Server-computed base-URL list, in precedence order: [server.approverTLS.publicUrl], else [server.approverPublicUrl], else [server.publicUrl] (trailing slash trimmed; empty when none is set). Clients may append alternates client-side."
        tls_spki_pin:
          type: string
          description: "The pin of the approver listener's TLS key, as sha256, a slash and the standard base64 digest of the SubjectPublicKeyInfo. Present only when the listener that minted it is the endpoint servers names: the dedicated approver listener, or server.publicUrl when strazad serves its own TLS and no approver listener is configured. Absent on plaintext and always absent behind an ingress or load balancer, since a pin over strazad's own key would name a host the ingress terminates, and every phone holding it fail-closes at the ingress's next certificate renewal."
        project:
          $ref: "#/components/schemas/ProjectRef"
        qr_payload:
          type: string
          description: "The exact compact JSON string the enroll QR must encode, rendered verbatim and never rebuilt client-side. Its shape is {v,servers,token[,pin],project[,fcm][,webpush]} in deterministic key order, with the pin, fcm and webpush keys omitted entirely when inapplicable (see tls_spki_pin, FCMAppConfig and WebPushAdvert)."
        qr:
          description: The structured twin of qr_payload (same bytes, parsed).
          type: object
          properties:
            v: { type: integer, enum: [1] }
            servers: { type: array, items: { type: string }, description: "Same list as the top-level servers field." }
            token: { type: string }
            pin: { type: string, description: "Same value as tls_spki_pin; omitted when absent." }
            project: { $ref: "#/components/schemas/ProjectRef" }
            fcm: { $ref: "#/components/schemas/FCMAppConfig" }
            webpush: { $ref: "#/components/schemas/WebPushAdvert" }
    ApproverEnrollRequest:
      type: object
      required: [enroll_token, device]
      properties:
        enroll_token: { type: string }
        device:
          type: object
          required: [public_key]
          properties:
            name: { type: string }
            platform: { type: string, enum: [android, ios, browser] }
            key_alg: { type: string, description: "Advisory (e.g. ecdsa-p256); the SPKI curve OID is authoritative." }
            public_key: { type: string, description: "base64 X.509 SubjectPublicKeyInfo DER; must be ECDSA on P-256." }
            key_security_level: { type: string, enum: [strongbox, tee, secure-enclave, software], description: "Reported posture; software = no hardware binding." }
            attestation:
              type: object
              properties:
                kind: { type: string, enum: [play-integrity, app-attest, none] }
                blob: { type: string }
    ApproverEnrollResponse:
      type: object
      properties:
        approver_device_id: { type: string, description: "apd_ prefixed." }
        device_token: { type: string, description: "use=approver, ~30 day TTL; opens only /v1/approver/*." }
        expires_in: { type: integer }
        project: { $ref: "#/components/schemas/ProjectRef" }
        fcm: { $ref: "#/components/schemas/FCMAppConfig" }
        webpush: { $ref: "#/components/schemas/WebPushAdvert" }
    ApproverRefreshChallengeRequest:
      type: object
      required: [approver_device_id]
      properties:
        approver_device_id: { type: string, description: "apd_ prefixed; the device that signs the challenge." }
    ApproverRefreshChallengeResponse:
      type: object
      properties:
        challenge: { type: string, description: "base64url single-use nonce, ≤5m; sign it to obtain a new token." }
        expires_in: { type: integer, description: "Seconds until the challenge expires." }
    ApproverRefreshRequest:
      type: object
      required: [approver_device_id, challenge, signature]
      properties:
        approver_device_id: { type: string }
        challenge: { type: string, description: "The challenge from /v1/approver/refresh/challenge." }
        signature:
          type: string
          description: >
            base64 ECDSA-P256/SHA-256, ASN.1 DER (variable length), over the exact
            byte string "refresh" + "\n" + approver_device_id + "\n" + challenge.
    ApproverRefreshResponse:
      type: object
      properties:
        device_token: { type: string, description: "A fresh use=approver token, same 30-day TTL and scope as enroll's." }
        expires_in: { type: integer, description: "Seconds until the new device token expires (~30 days)." }
    FCMAppConfig:
      description: >
        The deployment's public Firebase app config for the bring-your-own
        Firebase push lane. The Straza approver app ships no google-services.json;
        it initializes the default FirebaseApp at runtime from these values,
        persisted at enroll time. All four values
        are public identifiers, not secrets (they ship verbatim in any
        ordinary APK); the FCM service-account credential never rides any
        payload. Present only when the server config carries the full
        approval.push.fcm app-config set (all-or-nothing, independent of the
        server-side sender's enabled flag); the key is omitted entirely when
        unconfigured, and the app then stays on the UnifiedPush/ntfy lane. Maps
        1:1 to the deployment's google-services.json.
      type: object
      required: [project_id, app_id, api_key, sender_id]
      properties:
        project_id: { type: string, description: "project_info.project_id." }
        app_id: { type: string, description: "client[].client_info.mobilesdk_app_id (1:NNN:android:HEX, NOT the package name)." }
        api_key: { type: string, description: "client[].api_key[0].current_key. Public Firebase services key, not a secret." }
        sender_id: { type: string, description: "project_info.project_number. Derivable from app_id, but carried so a mismatch fails loudly at enroll instead of silently at token time." }
    WebPushAdvert:
      description: >
        The deployment's WebPush advert, the same object on the enroll 201
        and in the enroll QR, so the two surfaces cannot diverge. Present
        only when the deployment configures
        approval.push.webpush.vapidKeyFile; absent means only the legacy
        keyless UnifiedPush lane exists, as with the fcm key. Phones paired
        before the lane was configured stay on the legacy lane until they
        re-pair.
      type: object
      properties:
        vapid_public_key:
          type: string
          description: >
            The deployment's VAPID public key (RFC 8292): unpadded
            base64url of the 65-octet uncompressed P-256 point. The app
            hands it to its UnifiedPush distributor at REGISTER (spec 3);
            a browser passes it as pushManager.subscribe's
            applicationServerKey. Rotation of the server key invalidates
            every subscription made under it.
    ProjectRef:
      description: >
        This deployment's identity for the Straza approver app across backends. id is
        stable and opaque (settings-KV persisted, first-boot generated), so
        clients MUST key enrollments on it. name is a mutable display label
        (server.projectName, or a stable derived "straza-<4hex>" default)
        and MAY collide across deployments; never use it as a key. Absent on
        older servers; clients fall back to a local label / QR hostname.
      type: object
      properties:
        id: { type: string, description: "prj_ prefixed, stable per deployment." }
        name: { type: string, description: "Display label, <=64 chars." }
    ApproverRow:
      description: >
        One pending/history record for the Straza approver app. summary is the redacted tool
        identity ONLY (never raw arguments). justification is the agent's stated
        reason and is UNVERIFIED, so render as such. challenge is present on
        scope=decidable rows only; state/decided_by/decided_at describe
        resolution on scope=mine and history rows. The record carries two
        voices: the agent's justification (unverified) and the
        decider's decided_reason (key-bound on the signed lane).
      type: object
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        requester:
          type: object
          description: >
            The subject of the request, the identity whose authority is on
            the line. Not who typed it: today every record is raised by an
            agent session (see origin). kind=nhi means the subject is itself
            an AI agent, so the decider is the only person in the
            loop.
          properties:
            username: { type: string }
            kind: { type: string, enum: [human, nhi] }
        origin:
          type: object
          description: >
            Who actually raised the request. actor is agent_session on every
            record today; the field exists so a future lane where a person raises the request is a
            value change, not a wire change.
          properties:
            actor: { type: string, enum: [agent_session] }
        rule_id: { type: string }
        set_name: { type: string }
        summary:
          type: object
          properties:
            tool: { type: string }
            app: { type: string }
            tool_name: { type: string }
        justification: { type: string, description: "Agent's stated reason, UNVERIFIED." }
        challenge: { type: string, description: "decidable rows only; fresh per fetch, single-use, ≤5m." }
        state: { type: string, enum: [pending, approved, denied, expired], description: "mine/history rows." }
        decided_by: { type: string }
        decided_at: { type: [string, "null"], format: date-time }
        decided_via:
          type: object
          description: >
            How the decision was made: the surface the decider used and, on
            the signed lane, the enrolled device whose key signed it. Present
            on decided rows only, since an expired row was decided by nobody.
            Rows decided before the surface was recorded carry the retired
            transport constant "api" as surface; render those as a generic
            enrolled device.
          properties:
            surface: { type: string, enum: [phone, browser, console, slack, api] }
            device_id: { type: string, description: "Signed lane only. Compare with this device's own id to render 'this browser'." }
        decided_reason: { type: string, description: "The decider's own words on either verdict, optional, at most 500 bytes. On the signed lane its sha256 is the fifth line of the signed string, so it carries the same key binding as the verdict; unlike justification it is the person's voice on the record. Omitted when none was given." }
        mode: { type: string, enum: [confirm], description: "Present, as confirm, only on a record the requester alone decides: the row is in your queue because you requested it. Omitted on records the named deciders decide, so older apps see no change." }
        session_id: { type: string, description: "The agent session the requested call would run in: the record's own session reference. Omitted when the record carries no session." }
        harness: { type: string, description: "The harness that session checked in as (e.g. claude-code), resolved from the session store at list time. Omitted when the session row is unknown, so nothing is claimed that was not resolved." }
        approver_roles: { type: array, items: { type: string }, description: "The roles allowed to decide this record, the winning rule's approve.roles persisted at request time. Lets a requester's own surface say 'waiting on straza-admin' instead of a bare undecidable row. Omitted when empty." }
        approver_users: { type: array, items: { type: string }, description: "The usernames allowed to decide this record, resolved from the rule's approve.deciders at request time, today the requester's sponsor. Composable with approver_roles. A request whose deciders and roles both resolve to nobody is denied at request time and writes no record. straza-admin keeps decide rights only on a pending record with neither field that a server wrote before that deny landed, and on a record whose rule allows self-approval and names no deciders (policyset revision 14). Omitted when empty." }
        class: { type: string, enum: [hold, ticket], description: "The approve class of the record, hold or ticket. A ticket is the phone's long-running queue item." }
        grant_expires_at: { type: string, format: date-time, description: "The last moment a later call can use the approval, for a ticket and, since revision 23, for a retry of a hold. Omitted until approved." }
        consumed_at: { type: string, format: date-time, description: "When a call used the approval. Omitted while unused." }
        consumed_by: { type: string, description: "The session that used the approval. Omitted while unused." }
        args_preview: { type: string, description: "Redacted, display-safe, 2 KiB-capped preview of the concrete call arguments the fingerprint binds. Absent when the server-wide approval.preview knob is off or the call had no concrete args. The five preview fields travel together." }
        args_truncated: { type: boolean, description: "True when args_preview was head+tail elided past the 2 KiB cap." }
        args_bytes: { type: integer, description: "The byte length of the redacted preview before truncation, the size a person could have seen at full length. Not the raw pre-redaction size and not the audit copy's size." }
        argv_hash_prefix: { type: string, description: "First 12 hex of the argv_hash digest (no 'sha256:' prefix); the visible non-binding tag beside the honesty line. Present only with args_preview." }
        binding_scope: { type: string, enum: [call, tool_identity], description: "What the record's fingerprint covers. call means the concrete call including canonicalized mcp arguments under approve.binding call; tool_identity means MCP server and tool name only, from an explicit binding tool rule, arguments the server never observed, or an older record. Drives the honesty-line wording. Present only with args_preview." }
    ApproverDecideRequest:
      type: object
      required: [request_id, verdict, challenge, signature, ts]
      properties:
        request_id: { type: string }
        verdict: { type: string, enum: [approve, deny] }
        challenge: { type: string }
        signature: { type: string, description: "base64 ECDSA-P256/SHA-256, ASN.1 DER (variable length)." }
        ts: { type: integer, description: "Client unix seconds; ±5m window." }
        reason: { type: string, description: "The decider's optional own words on either verdict, at most 500 bytes of plain text. No control characters beyond newline and tab, and no invisible direction or zero-width characters (U+202A..U+202E, U+2066..U+2069, U+200E, U+200F, U+061C, U+200B, U+FEFF), while ZWJ and ZWNJ stay legal; a failed check is a 400. When present, the signature must cover the five-line string whose fifth line is the lowercase hex sha256 of the reason; when absent, the four-line string verifies unchanged as the canonical reason-less form. A reason can therefore never be attached, stripped, or swapped in transit." }
    ApproverPushRequest:
      type: object
      required: [kind, token_or_endpoint]
      properties:
        kind: { type: string, enum: [fcm, apns, unifiedpush, webpush] }
        token_or_endpoint: { type: string }
        p256dh:
          type: string
          description: >
            OPTIONAL Web Push subscription public key (RFC 8291 §3.2):
            unpadded base64url of the 65-octet uncompressed P-256 point,
            exactly PushSubscription.toJSON().keys.p256dh, or UnifiedPush
            connector 3.x PushEndpoint.pubKeySet. Required for kind=webpush;
            on kind=unifiedpush its presence (with auth) opts the route in to
            the encrypted Web Push protocol (spec-3); refused for fcm/apns.
            Validated strictly (length, on-curve); travels with auth, and one
            without the other is 400. DELETE addresses a keyed route with the
            same fields it registered.
        auth:
          type: string
          description: >
            OPTIONAL Web Push subscription auth secret (RFC 8291 §3.2):
            unpadded base64url of exactly 16 octets. Paired with p256dh; see
            its description for the per-kind rules.
    ConversationTurn:
      description: One recorded prompt or reply from a governed session. content_hash covers the full original, so truncation and redaction never lose the witness.
      type: object
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, enum: [prompt, reply] }
        mode: { type: string, enum: [verbatim, redact] }
        content: { type: string }
        truncated: { type: boolean }
        content_hash: { type: string }
        agent_type: { type: string, description: "The delegate class that produced this turn, for a reply recorded when a subagent stopped. Absent or empty means the main agent's own lane." }
        session_id: { type: string }
        user_id: { type: string }
        username: { type: string }
    AttestationHash:
      description: One expected-measurement row in the managed-install registry.
      type: object
      properties:
        id: { type: string, readOnly: true }
        artifact: { type: string, description: "The measurement key: self, config, or hooks followed by a dot and the harness name, such as hooks.claude-code." }
        harness: { type: string, description: "Harness this row applies to; empty = all" }
        platform: { type: string, description: "GOOS/GOARCH this row applies to; empty = all" }
        hash: { type: string, pattern: "^sha256:[0-9a-f]{6,64}$" }
        note: { type: string }
        created_at: { type: string, format: date-time, readOnly: true }
        current:
          type: boolean
          readOnly: true
          description: >
            True when this row's hash is the wiring the answering server
            renders right now for that artifact and harness. False on every
            other row, an upgrade-window survivor and a harness this server
            does not render included, so an operator can tell which rows are
            retirable.
      required: [artifact, hash]
    ToolBinding:
      type: object
      properties:
        id: { type: string }
        app: { type: string }
        role: { type: string }
        tools: { type: array, items: { type: string } }
    App:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        runtime: { type: string, enum: [command, remote, oci] }
        status: { type: string, enum: [pending, starting, running, degraded, stopped, failed] }
        detail: { type: string, description: "The health reason. Every address in it reads without its user information, with ?… in place of its query, #… in place of its fragment, and [REDACTED], written %5BREDACTED%5D, in place of a path part that reads as a generated secret. Each credential shape redact knows (an AWS key id, a GitHub token, a bearer token, a PEM block and a Straza token) reads [REDACTED] (0.126.0)." }
        source: { type: string, enum: [api, gitops, registry] }
        tools: { type: array, items: { type: string } }
        last_probe_at: { type: string, format: date-time, description: Last completed health evaluation (absent until first probe) }
        last_healthy_at: { type: string, format: date-time, description: Last probe that settled the server running (absent while never healthy) }
        status_since: { type: string, format: date-time, description: "When the status word last changed; a new detail under the same word keeps it. Absent until the manager has set a status." }
        paused: { type: boolean, description: "True when an admin disabled this MCP server and GitOps does not resurrect it; absent or false otherwise. Cleared by enable and by removal." }
        reached_by: { type: array, items: { type: string }, description: "The roles holding an access row on this server, sorted; an empty array when none. Present on listApps only." }
        manifest: { type: object, additionalProperties: true, description: "The installed manifest as a JSON object in the app.yaml shape (apiVersion, kind, metadata, server, straza), masked as every route answers a server's document. Each env value, each set value and default of the server block, strings, numbers and booleans alike, and each place the draft secret scan flags read [REDACTED]. Every address in any field names [REDACTED] as its user when it has user information, and reads ?… in place of its query and #… in place of its fragment (0.126.0). Absent when the stored manifest cannot be masked. A document sent back with a mask at the same place keeps the stored value. Present on listApps only." }
        url: { type: string, description: "The remote runtime's address as manifest.straza.runtime.remote.url reads it, masked the same way. Absent on command and oci runtimes. Present on listApps only." }
        file: { type: string, description: "The full path of the watched apps directory file that names this server, absent when no present file does. Present on listApps only." }
        file_differs: { type: boolean, description: "True when that file's manifest differs from the live one, or does not read. Since 0.123.0, absent when false and present on listApps only." }
        offered: { type: array, items: { type: string }, description: "Every tool the server itself lists, sorted, before the manifest's exposure list. tools stays the exposed set, so an exposure picker can offer a tool the manifest leaves out. Absent while the server has no live instance and until its first inventory probe. Present on listApps only." }
        admin_role: { type: string, description: "The Straza role that administers this server. Registration creates one named mcp-admin-<namespace>-<name>, set once and kept as long as the server lives, and a group of people is modeled by a business role that composes it. Every server has one (0.104.0 as adminRole, under this name since 0.127.0)." }
        admin_role_id: { type: string, description: "The id of admin_role." }
        may_change: { type: boolean, description: "Whether the caller may change this server. True under an apps scope, else true on the servers whose admin role the session holds. Display only, because the server re-derives authority per request. Present on listApps only (0.104.0 as mayChange, under this name since 0.127.0)." }
    AppSecret:
      description: One stored static secret of an MCP server, never its value. scope app is the server's own secret (role empty); scope role is that role's override.
      type: object
      properties:
        id: { type: string }
        app: { type: string }
        scope: { type: string, enum: [app, role] }
        role: { type: string }
        kind: { type: string, enum: [static] }
        fingerprint: { type: string, description: "The first four hex characters of the SHA-256 of the value" }
        set_at: { type: string, format: date-time, description: "When the value was last set (listing only)" }
    Tool:
      description: One exposed MCP tool from the live catalog. id is app-qualified (app:tool) because bare tool names collide across servers; name stays bare with app alongside.
      type: object
      properties:
        id: { type: string }
        app: { type: string }
        app_id: { type: string }
        name: { type: string }
        description: { type: string, description: Upstream tool description (absent when the server publishes none) }
    ConnectStatus:
      description: One user's connection on one caller-kind MCP server, an OAuth connection or a pasted token. Never carries token material.
      type: object
      properties:
        app: { type: string }
        kind: { type: string, enum: [oauth, token], description: The server's credential kind }
        provider: { type: string, description: oauth kind only }
        agents: { type: string, enum: [own, sponsor, shared, client_credentials], description: "What an agent with no row of its own runs on, from the app's manifest. client_credentials (0.112.0) is a token of the agent's own client at the provider." }
        connected: { type: boolean }
        fingerprint: { type: string, description: First hex characters of a pasted token's SHA-256; absent on an OAuth connection }
        expires_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: Last connect/rotation time }
        set_by: { type: string, description: Username of whoever set the row when it was not the owner }
        allow_agents: { type: boolean, description: The owner's opt-in for their sponsored agents }
        scopes: { type: array, items: { type: string } }
    ServerRow:
      description: One managed MCP server as the acting user sees it on the connections page. Carries the row fields of ConnectStatus when the server is a caller kind. Never carries token material.
      type: object
      required: [app, runtime, kind, reached, connected]
      properties:
        app: { type: string, description: The MCP server's name }
        runtime: { type: string, enum: [remote, command, oci], description: The server's runtime kind }
        kind: { type: string, enum: [none, static, oauth, token], description: The server's credential kind }
        provider: { type: string, description: The OAuth provider, oauth kind only }
        agents: { type: string, enum: [own, sponsor, shared, client_credentials], description: "What an agent with no row of its own runs on, from the app's manifest. Caller kinds only, and client_credentials (0.112.0) on the oauth kind only." }
        reached: { type: boolean, description: Whether one of the user's roles holds an access row on the server }
        connected: { type: boolean, description: True only for a caller kind with a row for the user }
        fingerprint: { type: string, description: First hex characters of a pasted token's SHA-256; absent on an OAuth connection or without a row }
        expires_at: { type: string, format: date-time, description: When the row stops working, absent when not recorded }
        updated_at: { type: string, format: date-time, description: When the row was last set, absent without a row }
        set_by: { type: string, description: Username of whoever set the row when it was not the owner }
        allow_agents: { type: boolean, description: The owner's opt-in for their sponsored agents; present on caller kinds only }
        scopes: { type: array, items: { type: string }, description: The OAuth scopes on the connection, absent when empty }
    EnrollRequest:
      type: object
      properties:
        id_token: { type: string }
        client_kind:
          type: string
          enum: [kit, human]
          description: >
            The kind of client that enrols and holds the credential. kit is
            the enforcement kit and human is strazactl; the row records it
            and check-in refuses a harness name of the other class. Missing
            means kit, so older kits keep enrolling. A re-enrol of the same
            fingerprint reuses a row of the same kind, binds a row enrolled
            before the kind was recorded, and never reuses a row of the
            other kind. Since 0.114.0.
        device:
          type: object
          properties:
            name: { type: string }
            platform: { type: string }
            fingerprint: { type: string }
      required: [id_token]
    EnrollResponse:
      type: object
      properties:
        user_id: { type: string }
        username: { type: string }
        device_id: { type: string }
        device_token:
          type: string
          description: >
            The long-lived enroll credential, bound to the user and device
            and usable only at /v1/checkin. Revoked by a user disable or a
            device revoke. Its lifetime is governance.deviceTokenTTL, 720h
            by default.
        device_token_expires_in: { type: integer }
    CheckinRequest:
      description: >
        The check-in body: one credential (id_token, device_token or
        session_token), the device id, the harness, the attestation
        measurements and the client build. The checkin-request JSON schema
        in the repository's attestation spec is authoritative.
      type: object
      properties:
        id_token: { type: string }
        device_token: { type: string }
        session_token: { type: string }
        device_id: { type: string }
        harness:
          type: object
          properties:
            name: { type: string }
            version: { type: string }
        attestation:
          type: object
          properties:
            managed: { type: boolean }
            hashes: { type: object, additionalProperties: { type: string } }
        client:
          type: object
          description: The straza build making the check-in; older clients omit it and the server records it on the session unverified.
          properties:
            version: { type: string }
            commit: { type: string }
    CheckinResponse:
      type: object
      properties:
        session_id: { type: string }
        session_token: { type: string }
        expires_in: { type: integer }
        attestation: { type: string, enum: [managed, advisory, none] }
        user: { type: string }
        roles: { type: array, items: { type: string } }
        snapshot_id: { type: string }
        knowledge_packs:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              version: { type: string }
              content: { type: string }
              checksum: { type: string }
        user_type:
          type: string
          enum: [human, agent, service]
          description: >
            The identity typology of the session's user. The client mirrors
            user_type, agency_mode and swarm_id onto its cached session so
            local hook decisions match identity-scoped PolicySets exactly
            like the server. Absent means unclassified.
        agency_mode: { type: string, enum: [interactive, supervised, autonomous] }
        swarm_id: { type: string }
        device_token:
          type: string
          description: >
            A renewed use=device credential, present only on the device-token
            lane when the presented credential is past half its lifetime. The
            client replaces its stored credential with it; a client that
            ignores it keeps working until its old credential expires.
        device_token_expires_in: { type: integer, description: "Seconds until the renewed device credential expires." }
        admin_grants:
          type: string
          description: >
            The session's admin-plane standing, which the console uses to
            hide inaccessible areas. "full" for the straza-admin role, else
            the canonical sorted "area:verb,..." union of the session's
            roles through admin.roleAreas, the straza-global-mcp-admin role's fixed
            apps:read,apps:write included (0.104.0). Omitted entirely for
            sessions with no admin standing, so agent checkins never carry
            an admin-shaped field. Display only; the server re-derives
            authority per request.
        admin_servers:
          type: integer
          description: >
            How many servers name an admin role the session holds. The
            console opens the MCP servers area for a server admin who has no
            area scope. Omitted when zero. Display only (0.104.0).
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string }
        display: { type: string }
        title: { type: string, description: "SCIM core title (RFC 7643): job title / agent function; informational" }
        status: { type: string, enum: [active, disabled] }
        origin: { type: string, enum: [local, scim] }
        kind: { type: string, enum: [human, nhi], description: "what the identity IS (origin says who created it); nhi = created via the agentic-SCIM extension" }
        external_id: { type: string }
        user_type: { type: string, enum: [human, agent, service], description: "The identity typology; absent means unclassified. Mastered over SCIM in the enterprise profile." }
        agency_mode: { type: string, enum: [interactive, supervised, autonomous] }
        sponsor: { type: string, description: "the accountable person behind an agent identity" }
        swarm_id: { type: string }
        ephemeral: { type: boolean }
        sponsored_count:
          type: integer
          readOnly: true
          description: >
            How many agents name this user as their sponsor. Present on the
            paged lane and the detail read; the bare lane keeps the legacy
            row without it.
    UserCreate:
      type: object
      properties:
        username: { type: string }
        email: { type: string }
        display: { type: string }
        title: { type: string }
        password: { type: string }
        kind:
          type: string
          enum: [human, nhi]
          description: >
            nhi provisions an agent identity, such as a headless AI agent. It
            is the same attrs.kind convention the agentic-SCIM extension
            stores, so IGA and the client_credentials grant see one signal.
            Default human.
        user_type:
          type: string
          enum: [agent, service]
          description: >
            The type of an nhi, an AI agent or a service account. An agent
            acts for a person, and a service account is a technical account
            with no agency. Absent on an nhi means agent, so no non-human
            identity is created untyped. Any other value is a 400, and so is
            any value on a create whose kind is not nhi. Since 0.115.0.
      required: [username]
    UserUpdate:
      type: object
      properties:
        email: { type: string }
        display: { type: string }
        title: { type: string }
        status: { type: string, enum: [active, disabled] }
        password: { type: string }
        user_type: { type: string, enum: [human, agent, service, ""], description: "set or clear (empty) the typology; standalone-admin lane, since enterprise masters this over SCIM" }
        agency_mode: { type: string, enum: [interactive, supervised, autonomous, ""] }
        sponsor: { type: string }
        swarm_id: { type: string }
        ephemeral: { type: boolean }
    Role:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [business, application, approver, straza] }
        assigned_count:
          type: integer
          readOnly: true
          description: >
            Assignment rows holding this role, grouped server-side (validity
            windows included): the number
            mirrors the assignment list an admin sees and can revoke, not
            effective validity. Effective holders are answered by
            GET /v1/admin/users?role= and counted by holder_count.
        holder_count:
          type: integer
          readOnly: true
          description: >
            Subjects holding the role at read time through any path, each
            subject counted once. Counts assignment rows inside their
            validity window, folded through the composition closure. Off
            the list, on the create and update answers, it is 0.
        implies:
          type: array
          items: { type: string }
          readOnly: true
          description: >
            Names of the roles this role composes directly, sorted; absent
            when none. Present on listRoles only.
        areas:
          type: array
          items: { type: string }
          readOnly: true
          description: >
            A Straza role's console scopes from admin.roleAreas as
            area:verb, sorted, or the one word full for straza-admin.
            Absent on access-plane roles and on a Straza role the config
            does not map. Present on listRoles only.
        decider_in:
          type: array
          items: { type: string }
          readOnly: true
          description: >
            For an approver role, the names of the active policy sets
            naming it in approve.roles, in store order without repeats.
            Absent on other kinds and when no active set names it. Present
            on listRoles only.
        server:
          type: string
          readOnly: true
          description: >
            The name of the server that owns the role, absent on a global
            role. Added in 0.106.0.
        tools:
          type: array
          items: { type: string }
          readOnly: true
          description: >
            The tool list of a server-owned role, read off its one access row
            on its server. ["*"] is every tool, and the list is absent on a
            role no server owns. Added in 0.106.0.
    RoleCreate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [business, application, approver, straza] }
        server:
          type: string
          description: >
            The name of the server that owns the role. When set, the role is
            server-owned: an application role named <server>-<suffix>, given access
            to that server in the same transaction, listed under it and
            deleted with it. The holder of a server's admin role names their
            own server here. An application role created without it reaches
            no MCP server (0.138.0). Added in 0.106.0.
        tools:
          type: array
          items: { type: string }
          description: >
            The tool names a server-owned role reaches on its server,
            required with server. ["*"] is every tool, the tools the server
            adds later included, and only a global admin sends it: the holder
            of a server's admin role who does answers 400 (0.138.0). Added in
            0.106.0.
      required: [name]
    RoleUpdate:
      type: object
      description: >
        PATCH semantics: absent = keep, present = set. At least one field
        is required. The description is the one field an update changes:
        a role's kind is fixed at create, so kind may only restate the
        kind the role has (an explicit "" or a value outside the enum is
        a 400, and since 0.108.0 so is any other kind, with a sentence
        that says to create a new role of the kind you need).
      properties:
        description: { type: string }
        kind: { type: string, enum: [business, application, approver, straza] }
    Assignment:
      type: object
      properties:
        id: { type: string, readOnly: true }
        subject_kind: { type: string, enum: [user] }
        subject_id: { type: string }
        role_id: { type: string }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        origin:
          type: string
          enum: [scim, admin]
          readOnly: true
          description: The lane that wrote the row, scim for an identity manager group membership and admin for the admin API. A value sent in a request body is ignored.
      required: [subject_kind, subject_id, role_id]
    Device:
      type: object
      description: One enrolled client device of a user, with snake_case keys.
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        fingerprint: { type: string }
        platform: { type: string }
        status: { type: string }
        client_kind: { type: string, description: "The kind of client that enrolled the device. kit or human, and empty for a row enrolled before the kind was recorded. Since 0.114.0." }
        enrolled_at: { type: string, format: date-time }
    Pack:
      type: object
      properties:
        id: { type: string, readOnly: true }
        name: { type: string }
        version: { type: string }
        content: { type: string }
        bindings:
          type: array
          readOnly: true
          description: >
            Which roles receive this knowledge pack; empty means bound to nothing, so
            no session ever sees it. Each binding's id is the role id (the
            edge has no row id) and is what the unbind DELETE consumes.
          items:
            type: object
            properties:
              id: { type: string }
              role_id: { type: string }
              role_name: { type: string }
      required: [name]
    PackBinding:
      description: The edge that binds one knowledge pack to one role, as the bind answer returns it.
      type: object
      properties:
        pack_id: { type: string, description: "The id of the bound pack." }
        role_id: { type: string, description: "The id of the role that receives the knowledge pack; also the binding id the unbind DELETE consumes." }
      required: [pack_id, role_id]
    Session:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        username: { type: string, description: Resolved owner username (empty if the user row is gone) }
        harness: { type: string }
        client_version: { type: string, description: The straza build the client named at check-in; absent for a client older than the field or a web login }
        attestation: { type: string }
        status: { type: string, description: active | revoked | closed (janitor closes sessions idle past token expiry) }
        started_at: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        wiring_status:
          type: string
          enum: [current, allowed, mismatch, unmeasured]
          description: >
            The session's managed-wiring hash classified against the published
            harness-config render and the expected-hash registry. current
            means it matches what this server publishes now; allowed means a
            registered row that is not the current render (an upgrade window
            or a per-box custom layout); mismatch means no row allows it;
            unmeasured means no managed measurement. Absent for admin
            harnesses and when the registry read failed.
        wiring_hash: { type: string, description: "The hooks measurement the session checked in with, as hooks, a dot, the harness name, then sha256, a colon and the hex digest. Absent when unmeasured." }
    PolicySet:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        priority: { type: integer }
        status: { type: string, enum: [draft, active] }
        yaml:
          type: string
          description: >-
            The stored policy set source, or the text of the set's open saved
            edit. Present on GET /v1/admin/policies/{name}; the list envelope
            and the apply responses omit it. The saved edit's text is answered
            since 0.120.0.
        updated_at: { type: string, format: date-time }
        drift:
          description: >-
            True while the set has an open saved edit, whose priority, summary
            and updated_at the row then carries. The saved edit is not live
            until activate publishes it, and the field is absent otherwise. It
            reads the saved edit since 0.120.0.
          type: boolean
        summary:
          description: >-
            Server-computed decomposition of the stored set, from the same
            parse validate uses, so clients can render a set's shape without
            re-parsing the YAML. Absent when the stored source no longer
            parses; absence is the honest signal, never an invented shape.
          type: object
          properties:
            name: { type: string }
            description:
              type: string
              description: The set's metadata.description, carried on the summary because the list omits yaml.
            priority: { type: integer }
            rules: { type: integer }
            postures:
              description: >-
                Rule count per decision posture. Keys are deny, allow,
                confirm, hold, ticket, serverCheck, classify; mode wins over
                effect, approve splits by class.
              type: object
              additionalProperties: { type: integer }
            matchRoles: { type: array, items: { type: string } }
            matchOther:
              description: users or identity selectors present beside roles
              type: boolean
            capture:
              type: string
              enum: [verbatim, redact]
            lanes:
              description: >-
                Posture counts per governed surface. Keys are mcp, shell,
                files, net, other; a lane appears only when a rule governs
                it. Explicit tools
                map to their lane; a tool-less rule classifies by matcher
                shape (apps/toolNames = mcp, command/interpreters = shell,
                paths = files); a rule with neither governs every lane, so
                lane sums can exceed the rule count; a rule tied to
                non-tool events only governs none.
              type: object
              additionalProperties:
                type: object
                additionalProperties: { type: integer }
    CanonicalEvent:
      description: >
        The canonical hook event a client asks a decision on, with its
        kind, tool, app, command, argv and paths. The canonical-event JSON
        schema in the repository's hook-profile spec is authoritative.
      type: object
      properties:
        kind: { type: string }
        tool: { type: string }
        app: { type: string }
        toolName: { type: string }
        command: { type: string }
        argv: { type: array, items: { type: string } }
        paths: { type: array, items: { type: string } }
        workspace: { type: string }
      required: [kind]
    Decision:
      type: object
      properties:
        effect: { type: string, enum: [allow, deny] }
        ruleId: { type: string }
        reason: { type: string }
        obligations: { type: array, items: { type: string }, description: "Always empty; the field stays for older clients." }
        snapshotId: { type: string }
        approvalId: { type: string, description: "Set when a mode:approve escalation created or consumed an approval record." }
    EngineDecision:
      type: object
      description: >
        The policy engine's own decision object, returned verbatim by the
        simulate what-if. The /v1/decide response is the slimmer Decision
        above, which carries no setName. Every field but effect is omitted
        when empty.
      properties:
        effect: { type: string, enum: [allow, deny] }
        ruleId: { type: string, description: "winning rule; omitted when no rule fired" }
        setName: { type: string, description: "The policy set the winning rule came from; omitted when no rule fired" }
        reason: { type: string }
        obligations: { type: array, items: { type: string }, description: "Always empty; the field stays for older clients." }
        serverCheck: { type: boolean, description: "a local PDP must not act on this alone; the caller asks POST /v1/decide" }
        classify: { type: boolean, description: "allow pending a classifier verdict (fail-closed)" }
        approve: { type: object, description: "normalized approve spec when a person's decision gates this allow (mode approve or confirm)" }
        confirm: { type: boolean, description: "the requester is the sole decider (mode confirm)" }
        default: { type: boolean, description: "no rule fired; a profile default applied" }
      required: [effect]
    ReadyStatus:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        components:
          type: object
          description: Per-component "ok" or the ping error string (store, bus)
          additionalProperties: { type: string }
      required: [status, components]
    VersionStatus:
      type: object
      description: >
        version.Info flattened (version/commit/go/os/arch) plus profile and
        the optional approver block.
      properties:
        version: { type: string }
        commit: { type: string }
        go: { type: string }
        os: { type: string }
        arch: { type: string }
        profile: { type: string, enum: [standalone, enterprise] }
        runtimes: { type: array, items: { type: string, enum: [remote, command, oci] }, description: "The MCP server runtimes this host can run: remote and command always, oci only when docker was found on PATH at boot. Old readers ignore it." }
        approver: { $ref: "#/components/schemas/ApproverVersion" }
      required: [version, commit, go, os, arch, profile]
    ApproverVersion:
      type: object
      description: >
        The approver listener's public address and TLS pin, present only
        when strazad itself terminates approver TLS. The pin follows the
        host, so behind an ingress this block is absent and the phone trusts
        the public CA. All fields are public by construction (URL and pin
        ride the enroll QR; expiry is visible in any handshake). cert_file
        only for the auto-minted pair, since operator paths stay out of an
        unauthenticated body.
      properties:
        public_url: { type: string }
        tls_spki_pin: { type: string }
        cert_not_after: { type: string, description: "RFC 3339; omitted when unknown" }
        auto_minted: { type: boolean }
        cert_file: { type: string }
      required: [public_url, tls_spki_pin, auto_minted]
    SnapshotKeys:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kid: { type: string }
              alg: { type: string, enum: [ed25519] }
              key: { type: string, description: "base64 (std) raw public key" }
            required: [kid, alg, key]
      required: [keys]
    HarnessConfigDocument:
      type: object
      description: >
        The signed managed harness config a client installs. Each
        artifact's signature covers a NUL-delimited domain-separated input
        (straza.harness-config.v1, harness, platform, artifact name, content),
        verified against the snapshot keys pinned at enroll. content_hash is
        the sha256:<hex> form of the file bytes, so served artifact, on-disk file,
        and attestation registry row are directly comparable.
      properties:
        format: { type: integer, enum: [1] }
        kind: { type: string, enum: [harness-config] }
        harness: { type: string }
        platform: { type: string, description: "GOOS the artifacts render for" }
        artifacts:
          type: array
          items:
            type: object
            properties:
              artifact: { type: string, description: "attestation registry key (hooks.<harness>, mcp.<harness>)" }
              content: { type: string, description: "base64 (std) file bytes, written verbatim by install --managed" }
              content_hash: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
              key_id: { type: string }
              sig: { type: string, description: "base64 (std) ed25519 signature" }
            required: [artifact, content, content_hash, key_id, sig]
      required: [format, kind, harness, platform, artifacts]
    IdPDiscovery:
      type: object
      properties:
        issuer: { type: string }
        client_id: { type: string, description: "Empty in the standalone profile (strazad is the issuer)" }
      required: [issuer, client_id]
    DraftItem:
      description: One object a draft creates, changes, turns off or removes.
      type: object
      properties:
        kind: { type: string, enum: [App, Role, PolicySet] }
        name: { type: string }
        op: { type: string, enum: [put, "off", remove], description: "put writes doc, off stores a PolicySet turned off with doc as its text, and remove deletes." }
        doc: { type: string, description: "The canonical document: the app.yaml of an App, the export form of a Role, the text of a PolicySet. Empty for a removal. A route answers an App document with env values and address secrets masked, so it is for reading and not for sending back." }
        base: { type: string, readOnly: true, description: "The object's content fingerprint at the draft's last check, answered only to a caller who may read the object." }
        withheld: { type: string, readOnly: true, description: "Why doc and base are left out: the caller reaches the draft only as an author, and the object is outside its read standing." }
        existed: { type: boolean, readOnly: true, description: "Whether the object existed at the draft's last check." }
      required: [kind, name, op, existed]
    DraftPrincipal:
      description: Who wrote a revision of a draft or decided it, as the server authenticated them.
      type: object
      properties:
        user_id: { type: string }
        username: { type: string }
        agent: { type: boolean, description: "True for a user who is not a person." }
        via: { type: string, enum: [login, session, api-token, file, upgrade] }
        client: { type: string, description: "The session's client, such as console, strazactl or claude-code, else id-token, api-token, or strazad for the apps directory and the upgrade." }
        sponsor_id: { type: string }
        sponsor: { type: string, description: "The sponsor of an agent author, as its session resolved it." }
      required: [user_id, username, agent, via, client]
    Draft:
      description: A set of items that publish together or not at all.
      type: object
      properties:
        id: { type: string, description: "The draft's number as a decimal string." }
        revision: { type: integer }
        state: { type: string, enum: [open, published, discarded, expired] }
        door: { type: string, enum: [console, strazactl, straza-app, apps-directory, api] }
        source: { type: string, description: "The apps directory file that proposed it." }
        note: { type: string, description: "The proposer's own words, at most 2,000 bytes, never a check." }
        authors: { type: array, items: { $ref: "#/components/schemas/DraftPrincipal" } }
        items: { type: array, items: { $ref: "#/components/schemas/DraftItem" } }
        reverts: { type: string, description: "The published draft this one undoes." }
        title: { type: string, description: "Computed from the items, never from the note." }
        working: { type: boolean }
        policy_edit: { type: string, description: "The policy set whose saved edit this draft holds." }
        refusal: { type: string, description: "Why an apps directory file became no items." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        decided_by: { $ref: "#/components/schemas/DraftPrincipal" }
        decided_reason: { type: string }
        snapshot: { type: string, description: "The policy snapshot the publish left active." }
      required: [id, revision, state, door, authors, items, title, created_at, updated_at]
    DraftFinding:
      description: One line of a verdict. Its sentence never names a person or holds a count.
      type: object
      properties:
        code: { type: string, description: "A dotted code such as policy.pool or access.ungated. A client shows a code it does not know by its class." }
        class: { type: string, enum: [refused, risk, warning, unchecked, passed, info] }
        ack: { type: string, enum: [tick, typed], description: "On a risk: typed when republishing the old state cannot undo the effect." }
        object: { type: string, description: "Kind/Name of the object the line is about." }
        sentence: { type: string }
        fix: { type: string }
        before: { type: string }
        after: { type: string }
        typed: { type: string, description: "The text a publisher types to acknowledge a typed risk." }
        key: { type: string, description: "The finding's key from before any cut for its reader, which a publish echoes in ticked and typed." }
        document: { type: integer, description: "The number of the sent document a reading refusal names, counted from 1 across every text sent. A text refused whole carries the number of its first document. A client that sent the texts can say where it sits, and a warning that replaces such a refusal keeps the number. Absent on every other finding." }
      required: [code, class, sentence, key]
    DraftGain:
      description: One row of who gains what, a role and a tool, today and after publishing.
      type: object
      properties:
        role: { type: string }
        server: { type: string }
        tool: { type: string, description: "* when the server's tools are unknown." }
        holders: { type: array, items: { type: string }, description: "Usernames, sent only to root and to a caller holding identity:read." }
        holders_count: { type: integer, description: "How many users hold the role, directly or through another role." }
        before: { type: string, enum: [runs, needs-approval, denied, not-reachable, unknown] }
        after: { type: string, enum: [runs, needs-approval, denied, not-reachable, unknown] }
        before_words: { type: string }
        after_words: { type: string }
      required: [role, server, tool, holders_count, before, after]
    DraftNeed:
      type: object
      properties:
        object: { type: string }
        standing: { type: string, description: "The standing that object needs from its publisher, in words." }
      required: [object, standing]
    DraftVerdict:
      description: >
        The server's reading of one revision against live state. The routes
        that write or check a draft and GET of an open draft compute it on the
        request, and a publish computes it again. GET of a published,
        discarded or expired draft runs no check: its verdict holds no line
        and no risk digest, and its snapshot and checked_at are those of the
        check the server stored for the draft's revision, which for a
        published draft is the check its publish ran. Both are empty when the
        server stored no check of that revision.
      type: object
      properties:
        draft: { type: string, description: "Empty on POST /v1/admin/drafts/check, which stores nothing." }
        revision: { type: integer, description: "0 on POST /v1/admin/drafts/check." }
        snapshot: { type: string, description: "The active policy snapshot it was checked against, empty when checked_at is." }
        checked_at:
          description: When the check ran. Empty on a draft that is not open when the server stored no check of its revision.
          anyOf:
            - { type: string, format: date-time }
            - { type: string, maxLength: 0 }
        refused: { type: array, items: { $ref: "#/components/schemas/DraftFinding" } }
        risks: { type: array, items: { $ref: "#/components/schemas/DraftFinding" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/DraftFinding" } }
        unchecked: { type: array, items: { $ref: "#/components/schemas/DraftFinding" } }
        passed: { type: array, items: { $ref: "#/components/schemas/DraftFinding" } }
        info: { type: array, items: { $ref: "#/components/schemas/DraftFinding" } }
        gains: { type: array, items: { $ref: "#/components/schemas/DraftGain" } }
        needs: { type: array, items: { $ref: "#/components/schemas/DraftNeed" } }
        risk_digest: { type: string, description: "The hex sha256 over the keys of every risk, which a publish carries back. Empty on GET of a draft that is not open." }
      required: [draft, revision, snapshot, checked_at, refused, risks, warnings, unchecked, passed, info, gains, needs, risk_digest]
    DraftSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        state: { type: string, enum: [open, published, discarded, expired] }
        door: { type: string, enum: [console, strazactl, straza-app, apps-directory, api] }
        source: { type: string }
        revision: { type: integer }
        proposer: { $ref: "#/components/schemas/DraftPrincipal" }
        items:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [App, Role, PolicySet] }
              name: { type: string }
              op: { type: string, enum: [put, "off", remove] }
        checks:
          type: object
          description: The counts the server stored with its last check of an open draft, absent on the others and before the first check.
          properties:
            refused: { type: integer }
            risks: { type: integer }
            warnings: { type: integer }
            unchecked: { type: integer }
            revision: { type: integer, description: "The revision those counts belong to." }
            checked_at: { type: string, format: date-time }
        working: { type: boolean }
        policy_edit: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        decided_by: { $ref: "#/components/schemas/DraftPrincipal" }
      required: [id, title, state, door, revision, proposer, items, created_at, updated_at]
    DraftPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DraftSummary" } }
        next_cursor: { type: string, description: "Empty on the last page." }
      required: [items, next_cursor]
    DraftBodyItem:
      description: One object of a request's items form. The server stamps every item it stores or checks, so the item carries no base.
      type: object
      properties:
        kind: { type: string, enum: [App, Role, PolicySet] }
        name: { type: string }
        op: { type: string, enum: [put, "off", remove], description: "put writes doc, off stores a PolicySet turned off with doc as its text, and remove deletes." }
        doc: { type: string, description: "The document: the app.yaml of an App, a Role document, the text of a PolicySet. Empty for a removal." }
      required: [kind, name, op]
    DraftBody:
      type: object
      properties:
        documents: { type: array, items: { type: string }, description: "YAML streams of App, Role, PolicySet and Removal documents." }
        items: { type: array, items: { $ref: "#/components/schemas/DraftBodyItem" } }
        note: { type: string, description: "At most 2,000 bytes, without invisible direction or zero-width characters." }
        working: { type: boolean, description: "Add to the caller's working draft. People only." }
    DraftUpdate:
      type: object
      properties:
        revision: { type: integer }
        documents: { type: array, items: { type: string } }
        items: { type: array, items: { $ref: "#/components/schemas/DraftBodyItem" } }
        note: { type: string }
      required: [revision]
    DraftDiscard:
      type: object
      properties:
        revision: { type: integer }
        reason: { type: string, description: "At most 500 bytes of plain text." }
    DraftRevert:
      type: object
      properties:
        note: { type: string }
    DraftPublish:
      type: object
      properties:
        revision: { type: integer }
        risk_digest: { type: string, pattern: "^([0-9a-fA-F]{64})?$", description: "The verdict's risk_digest as the publisher read it, 64 hex characters, or empty. Any other text answers 400." }
        ticked: { type: array, items: { type: string }, description: "The key of every risk acknowledged, tick and typed, as each finding carries it." }
        typed: { type: object, additionalProperties: { type: string }, description: "The text typed for each typed risk, by key." }
      required: [revision, risk_digest]
    DraftRebase:
      type: object
      properties:
        revision: { type: integer }
        picks: { type: object, additionalProperties: { type: string, enum: [draft, live] }, description: "Keyed by Kind/Name, a space and the field. The field is an App's manifest leaf, spec.description, spec.bindings or spec.implies of a Role, text of a PolicySet, or state of any kind." }
      required: [revision]
    DraftConflicts:
      type: object
      properties:
        error: { type: string }
        conflicts:
          type: array
          items:
            type: object
            properties:
              object: { type: string }
              field: { type: string }
              base: { type: string, description: "The value at the draft's check, a server's masked as GET masks it, empty when unset." }
              draft: { type: string }
              live: { type: string }
            required: [object, field, base, draft, live]
      required: [error]
    DraftContact:
      type: object
      properties:
        object: { type: string, description: "The App item of the draft to contact, as Kind/Name, such as App/github." }
      required: [object]
    DraftContacted:
      type: object
      properties:
        object: { type: string }
        host: { type: string, description: "The host in its ASCII form." }
        contacted_at: { type: string, format: date-time }
        server:
          type: object
          properties:
            name: { type: string }
            version: { type: string }
        tools:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string, description: "The server's own text." }
              read_only: { type: boolean }
      required: [object, host, contacted_at, server, tools]
    DraftRevision:
      type: object
      properties:
        revision: { type: integer }
        author: { $ref: "#/components/schemas/DraftPrincipal" }
        door: { type: string }
        digest: { type: string }
        mechanical: { type: boolean, description: "A Check again that took live values with no pick, which makes no author under admin.secondPerson." }
        created_at: { type: string, format: date-time }
    DraftChange:
      description: The published before and after of one object, the change record.
      type: object
      properties:
        kind: { type: string, enum: [App, Role, PolicySet] }
        name: { type: string }
        implied: { type: boolean, description: "Changed by another item, such as a role that lost its access row with its server." }
        before_op: { type: string, enum: [put, "off", remove] }
        before_doc: { type: string }
        before_fp: { type: string }
        after_op: { type: string, enum: [put, "off", remove] }
        after_doc: { type: string }
        after_fp: { type: string }
    DraftAnswer:
      type: object
      properties:
        draft: { $ref: "#/components/schemas/Draft" }
        verdict: { $ref: "#/components/schemas/DraftVerdict" }
      required: [draft, verdict]
    DraftCheckAnswer:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DraftItem" } }
        verdict: { $ref: "#/components/schemas/DraftVerdict" }
      required: [items, verdict]
    DraftDetail:
      type: object
      properties:
        draft: { $ref: "#/components/schemas/Draft" }
        verdict: { $ref: "#/components/schemas/DraftVerdict" }
        revisions: { type: array, items: { $ref: "#/components/schemas/DraftRevision" } }
        live:
          type: object
          description: The live state of each item and implied object by Kind/Name, env values and address secrets masked. An object the caller may not read is left out.
          additionalProperties:
            type: object
            properties:
              op: { type: string, enum: [put, "off", remove] }
              doc: { type: string }
        contacted:
          type: object
          description: The tools a Contact read for each App item's current document, by Kind/Name. A server the caller may not read is left out.
          additionalProperties:
            type: object
            properties:
              at: { type: string, format: date-time }
              tools: { type: array, items: { type: string } }
        changes: { type: array, items: { $ref: "#/components/schemas/DraftChange" }, description: "The change record of a published draft. A change of an object the caller may not read is left out." }
        checks:
          type: object
          description: The counts of the stored check of a published, discarded or expired draft. For a published draft that is the check its publish ran, and the verdict does not hold its lines. Absent on an open draft, whose verdict is computed on the read, and when the server stored no check of that revision.
          properties:
            refused: { type: integer }
            risks: { type: integer }
            warnings: { type: integer }
            unchecked: { type: integer }
            revision: { type: integer, description: "The revision those counts belong to, the draft's current one." }
            checked_at: { type: string, format: date-time }
        may_publish: { type: boolean, description: "Whether the caller may publish it now, by who the caller is and the standing each item needs. Display only: a publish checks again, and the second-person setting can still refuse it with 409. False on a draft that is not open." }
        publish_refusal: { type: string, description: "Why the caller may not publish an open draft. Absent when the caller may, and on a draft that is not open." }
      required: [draft, verdict, revisions, live, may_publish]
    DraftPublished:
      type: object
      properties:
        draft: { $ref: "#/components/schemas/Draft" }
        snapshot: { type: string, description: "The policy snapshot the publish left active." }
        servers:
          type: array
          description: The servers the publish created, changed or removed, as this replica runs them after the apply.
          items:
            type: object
            properties:
              name: { type: string }
              change: { type: string, enum: [created, changed, removed] }
              status: { type: string }
              detail: { type: string, description: "The start's error or the health reason, when there is one, left out for a server the caller may not read." }
            required: [name, change, status]
        next: { type: array, items: { type: string }, description: "The fix of every readiness warning the verdict held, each once." }
      required: [draft, snapshot, servers, next]
    DraftRefused:
      description: A refusal with its detail.
      type: object
      properties:
        error: { type: string }
        findings: { type: array, items: { $ref: "#/components/schemas/DraftFinding" } }
        verdict: { $ref: "#/components/schemas/DraftVerdict" }
        code: { type: string, enum: [second_person], description: "second_person on a publish that admin.secondPerson refused to this caller. The error says who may publish instead. Absent on every other refusal." }
      required: [error]
    DraftSubmit:
      description: The input of the straza__draft_submit tool of the built-in straza app.
      type: object
      properties:
        documents: { type: array, items: { type: string }, minItems: 1 }
        note: { type: string }
        draft: { type: string, description: "Your own open draft to revise instead of making a new one." }
      required: [documents]
    DraftAgentStatus:
      description: What straza__draft_submit and straza__draft_status answer, the verdict as the agent may read it.
      type: object
      properties:
        draft: { type: string }
        revision: { type: integer }
        state: { type: string, enum: [open, published, discarded, expired] }
        checked: { type: boolean, description: "False until the server has checked this revision." }
        publishable: { type: boolean, description: "Checked and nothing refused." }
        refused: { type: array, items: { $ref: "#/components/schemas/DraftFinding" } }
        risks: { type: array, items: { $ref: "#/components/schemas/DraftFinding" } }
        warnings: { type: array, items: { $ref: "#/components/schemas/DraftFinding" } }
        unchecked: { type: array, items: { $ref: "#/components/schemas/DraftFinding" } }
        next: { type: string }
      required: [draft, revision, state, checked, publishable]
