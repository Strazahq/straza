version: "2"

run:
  timeout: 5m
  build-tags: [docsgen]

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - gosec
    - revive
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104 # duplicated by errcheck
    revive:
      rules:
        - name: exported
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
      # A test or the load harness may receive from a done channel only to
      # wait for a goroutine to end. errcheck words that finding without a
      # function name, so an unchecked call stays a finding everywhere.
      - path: (_test\.go|^test/load/)
        linters:
          - errcheck
        text: "^Error return value is not checked$"

formatters:
  enable:
    - gofmt
    - goimports
