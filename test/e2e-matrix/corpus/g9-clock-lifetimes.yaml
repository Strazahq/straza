# The clocks a deployment meets every day, run against one stack whose
# governance lifetimes are minutes instead of hours and days. Every identity
# runs its own straza service, which renews a session when a call needs it
# inside the token's last 120 s. Alice shows the refresh and the re-acquire:
# a role she is given after her session started reaches her decisions only
# when her token refreshes inside its last 120 s, and after the janitor
# closes her session at its lifetime her next refresh is refused, her
# service re-acquires once through her key, and a second role arrives with
# that. Bob shows that a policy change reaches a busy session within one
# call plus the pulse lag, no refresh needed. His push stream carries the
# change too and no step can hold it down, so the step passes on whichever
# arrives first and does not tell the pulse from the push. With both
# missing it fails, because bob's next refresh comes only at about 3:00,
# after its window closes at about 1:30. Carol's first decision after the
# lifetime close re-acquires a session on its own. Bob's session then
# outlives a stopped server into the grace window and past it. The sign-in
# deadline closes the run: it counts from the sign-in of each enrollment
# and use never renews it, so bob, who used Straza all along, and dave,
# who never did, are both refused once the server is back, and dave's new
# enrollment works.
# A signing key is rotated under all of them at the start, so every later
# refresh presents a token the retiring key signed.
# Times in the step names count from alice's session start. Fixed in the
# binary: the session token lives 300 s, the service refreshes inside its
# last 120 s, the snapshot pulse fires at most once per 30 s, the session
# janitor ticks every 60 s and the key janitor every 30 s. The lifetimes
# below are chosen against those: the lifetime close starts after alice's
# 3:00 refresh, every re-acquire falls before the sign-in deadline, which
# passes 7m20s after the sign-in of each enrollment and so before about
# 7:20, the server returns after it at about 7:43, and the grace window
# ends after the server stops.
# A policy change reaches a session through the push or the snapshot
# pulse, while a role reaches it only at a check-in, so the refresh and
# re-acquire proofs use role assignments [doc].
id: g9-clock-lifetimes
group: G9
title: The session, sign-in, grace and rotation clocks run their course on a stack with minute lifetimes
provenance: >-
  doc the published lifetimes: the offline grace bound is
  governance.offlineGraceTTL, the session token lives 300 s, a
  401-refused refresh falls back once to the enrolment lane, a person's
  key enrollment lasts governance.signInMaxAge from its sign-in, the
  built-in issuer's auth_time, and use never renews it, the offline deny names what it observed, and the
  snapshotLagSeconds pulse, default 30 s, keeps a busy session at most one
  call plus the lag behind the active policy;
  spec/session-token/SPEC.md (TTL 300 s; refresh via /v1/checkin, refused
  once the person's sign-in deadline has passed; key rotation staged,
  active, retiring; the JWKS carries staged, active and retiring keys);
  spec/attestation/SPEC.md §Key lane (a key check-in past the sign-in
  deadline is refused with 403); spec/snapshot/SPEC.md §Envelope
  (maxAgeSecs is the grace bound); spec/events/SPEC.md revision 28
  (session.end outcome lifetime-closed, reason naming the configured
  lifetime); spec/events/examples/valid-audit-authn-login-device-key.json
  (the login failure reason names governance.signInMaxAge);
  website/content/reference/configuration.md §Governance (the knobs;
  offlineGraceTTL has no env face);
  website/content/reference/lifetimes-and-timeouts.md (the sign-in
  deadline row, whose refusal says "Your last sign-in on this machine was
  more than" the configured period); website/content/reference/api.md
  sections Sessions (newest first, filtered by user or status), Roles and
  assignments, and Signing keys (rotate answers kid, status,
  active_in_seconds, previous_key_verifies_for_seconds);
  website/content/security/credentials-and-sessions.md (the grace deny
  wording, quoted).
  suspect: the sessions list order and the status word closed follow the
  API reference; the JWKS member "kid":"<id>" follows RFC 7517 in compact
  JSON; the service is assumed to pass the server's deadline sentence into
  the hook's refusal unchanged.
harnesses: [claude-code]
governance:
  offlineGraceTTL: 2m40s
  sessionMaxLifetime: 3m45s
  signInMaxAge: 7m20s
identities:
  alice: {kind: human, password: "Walk-2026!"}
  bob: {kind: human, password: "Walk-2026!"}
  carol: {kind: human, password: "Walk-2026!"}
  dave: {kind: human, password: "Walk-2026!"}
steps:
  # Provisioning: four people, two roles alice receives later with a policy
  # each, a role and an app for bob's gateway call. Both of alice's policies
  # are active before any session starts, so the only thing that changes for
  # her decisions later is which roles her session carries.
  - name: the IdM provisions alice over SCIM
    scim:
      method: POST
      path: /scim/v2/Users
      body:
        schemas: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        externalId: idm-g9-alice
        userName: alice
        displayName: Alice Refresh
        active: true
    want: {status: 201}
    save: {aliceId: id}
  - name: the admin sets alice's password
    admin:
      method: PATCH
      path: /v1/admin/users/${aliceId}
      body: {password: "Walk-2026!"}
    want: {status: 200}
  - name: the IdM provisions bob over SCIM
    scim:
      method: POST
      path: /scim/v2/Users
      body:
        schemas: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        externalId: idm-g9-bob
        userName: bob
        displayName: Bob Grace
        active: true
    want: {status: 201}
    save: {bobId: id}
  - name: the admin sets bob's password
    admin:
      method: PATCH
      path: /v1/admin/users/${bobId}
      body: {password: "Walk-2026!"}
    want: {status: 200}
  - name: the IdM provisions carol over SCIM
    scim:
      method: POST
      path: /scim/v2/Users
      body:
        schemas: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        externalId: idm-g9-carol
        userName: carol
        displayName: Carol Lifetime
        active: true
    want: {status: 201}
    save: {carolId: id}
  - name: the admin sets carol's password
    admin:
      method: PATCH
      path: /v1/admin/users/${carolId}
      body: {password: "Walk-2026!"}
    want: {status: 200}
  - name: the IdM provisions dave over SCIM
    scim:
      method: POST
      path: /scim/v2/Users
      body:
        schemas: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        externalId: idm-g9-dave
        userName: dave
        displayName: Dave Idle
        active: true
    want: {status: 201}
    save: {daveId: id}
  - name: the admin sets dave's password
    admin:
      method: PATCH
      path: /v1/admin/users/${daveId}
      body: {password: "Walk-2026!"}
    want: {status: 200}
  - name: the admin creates the role alice receives at 0:15
    admin:
      method: POST
      path: /v1/admin/roles
      body: {name: g9-clock, kind: application, description: "Clock scenario, adopted at the refresh"}
    want: {status: 201}
    save: {roleId: id}
  - name: the admin creates the role alice receives at 3:05
    admin:
      method: POST
      path: /v1/admin/roles
      body: {name: g9-clock-two, kind: application, description: "Clock scenario, adopted at the re-acquire"}
    want: {status: 201}
    save: {roleTwoId: id}
  - name: the admin registers the hermetic upstream as an app
    admin:
      method: POST
      path: /v1/admin/apps
      body:
        yaml: |
          apiVersion: straza.dev/v1beta1
          kind: App
          metadata:
            name: g9-tools
            namespace: dev.e2e
            description: The hermetic upstream, for the clock scenario's gateway calls
          server:
            name: dev.e2e/g9-tools
            version: "0.1.0"
          straza:
            runtime:
              kind: remote
              remote:
                url: "${upstream}"
            exposure:
              tools: ["*"]
    want: {status: 201}
    save: {appId: id}
  - name: the admin creates the role the app owns, over every tool of the app, which bob's gateway access hangs on
    admin:
      method: POST
      path: /v1/admin/roles
      body: {name: g9-tools-gateway, server: g9-tools, tools: ["*"], description: "Clock scenario, the gateway role"}
    want: {status: 201}
    save: {gatewayRoleId: id}
  - name: bob holds the gateway role
    admin:
      method: POST
      path: /v1/admin/assignments
      body: {subject_kind: user, subject_id: "${bobId}", role_id: "${gatewayRoleId}"}
    want: {status: 201}
  - name: the admin applies the policy for the first role, which refuses the first probe
    admin:
      method: PUT
      path: /v1/admin/policies
      body:
        yaml: |
          apiVersion: straza.dev/v1beta1
          kind: PolicySet
          metadata:
            name: g9-clock-one
            description: Clock scenario, the rule role g9-clock brings
          spec:
            match:
              roles: [g9-clock]
            rules:
              - id: probe-one
                tools: [shell.exec]
                command:
                  denyPatterns: ["clock-probe one *"]
                effect: deny
                reason: "G9-CLOCK-ONE: the first probe is refused for role g9-clock"
    want: {status: 201}
  - name: the admin activates it
    admin:
      method: POST
      path: /v1/admin/policies/g9-clock-one/activate
      body: {status: active}
    want: {status: 200}
  - name: the admin applies the policy for the second role, which refuses the second probe
    admin:
      method: PUT
      path: /v1/admin/policies
      body:
        yaml: |
          apiVersion: straza.dev/v1beta1
          kind: PolicySet
          metadata:
            name: g9-clock-two
            description: Clock scenario, the rule role g9-clock-two brings
          spec:
            match:
              roles: [g9-clock-two]
            rules:
              - id: probe-two
                tools: [shell.exec]
                command:
                  denyPatterns: ["clock-probe two *"]
                effect: deny
                reason: "G9-CLOCK-TWO: the second probe is refused for role g9-clock-two"
    want: {status: 201}
  - name: the admin activates that one too
    admin:
      method: POST
      path: /v1/admin/policies/g9-clock-two/activate
      body: {status: active}
    want: {status: 200}
  - name: alice enrolls
    enroll: {as: alice}
  - name: bob enrolls
    enroll: {as: bob}
  - name: carol enrolls
    enroll: {as: carol}
  - name: dave enrolls and then never checks in until his sign-in deadline has passed
    enroll: {as: dave}

  # Clock zero: three sessions start.
  - name: 0:00 alice starts a session on the hook lane, with no role yet
    hook:
      as: alice
      event: {kind: session.start}
    want: {decision: allow}
  - name: 0:00 bob starts a session
    hook:
      as: bob
      event: {kind: session.start}
    want: {decision: allow}
  - name: 0:00 carol starts a session
    hook:
      as: carol
      event: {kind: session.start}
    want: {decision: allow}
  - name: by 0:15 bob's call reaches the upstream through his service and the gateway
    mcp:
      as: bob
      tool: g9-tools__echo
      args: {text: clock-zero}
    want: {result: clock-zero}
  - name: by 0:15 alice's first probe is allowed because her session carries no role
    hook:
      as: alice
      event: {kind: tool.pre, tool: shell.exec, command: "clock-probe one now"}
    want: {decision: allow}
  - name: by 0:15 bob's pulse probe is allowed because no rule names it yet, and this decision arms his snapshot pulse
    hook:
      as: bob
      event: {kind: tool.pre, tool: shell.exec, command: "clock-probe pulse now"}
    want: {decision: allow}

  # Rotation under live sessions: the key is staged now and promoted two key
  # janitor ticks later, so every refresh after about 1:40 presents a token
  # the retiring key signed.
  - name: by 0:15 the admin stages a new session signing key
    admin:
      method: POST
      path: /v1/admin/signing-keys/rotate
    want: {status: 200, body: {status: staged}}
    save: {kid: kid}
  - name: by 0:15 the JWKS already carries the staged key, so every verifier holds it before it signs
    admin:
      method: GET
      path: /.well-known/straza/jwks.json
    want: {status: 200, bodyContains: '"kid":"${kid}"'}
  - name: by 0:15 the rotation is on the chain exactly once
    audit: {kind: straza.audit.admin, action: signing-keys.rotate, count: 1}

  # The two clocks of a running session. A policy change reaches bob's busy
  # session through his push stream or the snapshot pulse within about 30 s
  # of his last decision. A role change reaches alice's session only when
  # her token refreshes inside its last 120 s, because roles are resolved at
  # check-in. A policy activation also renews every live session at once
  # through its push stream, so the pulse policy goes live before alice is
  # given her role, and a short wait lets those renewals land first. Her
  # token is then renewed within seconds of clock zero, which puts her next
  # refresh at about 3:00.
  - name: by 0:15 the admin applies a policy for bob's role that refuses the pulse probe
    admin:
      method: PUT
      path: /v1/admin/policies
      body:
        yaml: |
          apiVersion: straza.dev/v1beta1
          kind: PolicySet
          metadata:
            name: g9-pulse
            description: Clock scenario, the rule the snapshot pulse carries to bob
          spec:
            match:
              roles: [g9-tools-gateway]
            rules:
              - id: probe-pulse
                tools: [shell.exec]
                command:
                  denyPatterns: ["clock-probe pulse *"]
                effect: deny
                reason: "G9-PULSE: the pulse probe is refused for role g9-tools-gateway"
    want: {status: 201}
  - name: by 0:15 the admin activates it
    admin:
      method: POST
      path: /v1/admin/policies/g9-pulse/activate
      body: {status: active}
    want: {status: 200}
  - name: by 0:45 bob's hook denies the pulse probe once his push stream or the snapshot pulse has brought the new policy, at most one call plus the lag after the activation
    hook:
      as: bob
      event: {kind: tool.pre, tool: shell.exec, command: "clock-probe pulse now"}
    want: {decision: deny, reasonContains: "G9-PULSE"}
    within: 1m30s
    timer: policy-pulse
  - name: the renewals the activation pushed to every session have landed
    wait: 5s
  - name: once those renewals landed, alice is given the first role, which her running session does not know yet
    admin:
      method: POST
      path: /v1/admin/assignments
      body: {subject_kind: user, subject_id: "${aliceId}", role_id: "${roleId}"}
    want: {status: 201}
  - name: alice's next decision still allows the first probe, because her session does not know the role yet
    hook:
      as: alice
      event: {kind: tool.pre, tool: shell.exec, command: "clock-probe one now"}
    want: {decision: allow}
  - name: about 3:00 alice's service refreshes her token inside its last 120 s, her session learns the role and the first probe flips to deny
    hook:
      as: alice
      event: {kind: tool.pre, tool: shell.exec, command: "clock-probe one now"}
    want: {decision: deny, reasonContains: "G9-CLOCK-ONE"}
    within: 4m
    timer: refresh-adopt

  # The lifetime clock: a second role waits for alice's re-acquire, and the
  # janitor closes the three sessions started at clock zero.
  - name: 3:05 alice is given the second role, which only a new check-in can bring to her session
    admin:
      method: POST
      path: /v1/admin/assignments
      body: {subject_kind: user, subject_id: "${aliceId}", role_id: "${roleTwoId}"}
    want: {status: 201}
  - name: alice's next decision still allows the second probe, because her session does not know that role yet
    hook:
      as: alice
      event: {kind: tool.pre, tool: shell.exec, command: "clock-probe two now"}
    want: {decision: allow}
  - name: 3:45 to 4:45 the janitor closes carol's session with a chained record that names her and the lifetime
    audit: {subject: carol, kind: straza.audit.authn, reasonContains: "maximum lifetime of 3m45s", count: 1}
    within: 3m
  - name: the janitor closed all three sessions started at clock zero, each with its own record
    audit: {kind: straza.audit.authn, reasonContains: "maximum lifetime of 3m45s", count: 3}
    within: 1m
  - name: carol's next decision is allowed, because her token is in its last 120 s, the refresh is refused for the closed session and her service re-acquires once through her key with no human action
    hook:
      as: carol
      event: {kind: tool.pre, tool: shell.exec, command: "git status"}
    want: {decision: allow}
  - name: carol now has one closed and one active session and no third
    admin:
      method: GET
      path: /v1/admin/sessions?user=${carolId}
    want: {status: 200, body: {0.status: active, 1.status: closed, "2": null}}
    within: 30s
  - name: about 6:00 alice's refresh is refused for the closed session, her service re-acquires once through her key, her session learns the second role and the second probe flips to deny
    hook:
      as: alice
      event: {kind: tool.pre, tool: shell.exec, command: "clock-probe two now"}
    want: {decision: deny, reasonContains: "G9-CLOCK-TWO"}
    within: 3m30s
    timer: reacquire-adopt
  - name: alice has exactly one closed and one active session, so the re-acquire happened once
    admin:
      method: GET
      path: /v1/admin/sessions?user=${aliceId}
    want: {status: 200, body: {0.status: active, 1.status: closed, "2": null}}

  # The grace clock: bob's token expired at 5:00 and the server is gone, so
  # his service decides locally for the grace window and then fails closed.
  - name: about 6:04 the server is stopped
    server: {action: stop}
  - name: bob's hook still allows inside the grace window
    hook:
      as: bob
      event: {kind: tool.pre, tool: shell.exec, command: "git status"}
    want: {decision: allow}
  - name: 7:41 the grace window ends and bob's hook denies with the published wording
    hook:
      as: bob
      event: {kind: tool.pre, tool: shell.exec, command: "git status"}
    want: {decision: deny, reasonContains: "offline grace period"}
    within: 2m30s
    timer: grace-exhausted

  # The sign-in clock: every deadline passed while the server was down. It
  # counts from the sign-in of the enrollment, so using Straza never moved it.
  - name: about 7:43 the server is started again on the same port and data directory
    server: {action: start}
  - name: bob used Straza all along, yet his next decision is refused, because his session needs a check-in and his last sign-in is older than governance.signInMaxAge
    hook:
      as: bob
      event: {kind: tool.pre, tool: shell.exec, command: "git status"}
    want: {decision: deny, reasonContains: "last sign-in on this machine"}
    within: 30s
  - name: bob's refusal is on the chain with the deadline's reason
    audit: {subject: bob, kind: straza.audit.authn, reasonContains: "governance.signInMaxAge"}
  - name: dave never used his enrollment, and his session start is refused at the same deadline
    hook:
      as: dave
      event: {kind: session.start}
    want: {decision: block, reasonContains: "last sign-in on this machine"}
  - name: dave's refusal is on the chain exactly once
    audit: {subject: dave, kind: straza.audit.authn, reasonContains: "governance.signInMaxAge", count: 1}
  - name: dave enrolls again, which is a new sign-in
    enroll: {as: dave}
  - name: dave's session start is allowed on the new sign-in
    hook:
      as: dave
      event: {kind: session.start}
    want: {decision: allow}

  # Deprovisioning.
  - name: the admin deactivates the first policy
    admin:
      method: POST
      path: /v1/admin/policies/g9-clock-one/activate
      body: {status: draft}
    want: {status: 200}
  - name: the first policy is deleted
    admin:
      method: DELETE
      path: /v1/admin/policies/g9-clock-one
    want: {status: 204}
  - name: the admin deactivates the second policy
    admin:
      method: POST
      path: /v1/admin/policies/g9-clock-two/activate
      body: {status: draft}
    want: {status: 200}
  - name: the second policy is deleted
    admin:
      method: DELETE
      path: /v1/admin/policies/g9-clock-two
    want: {status: 204}
  - name: the admin deactivates the pulse policy
    admin:
      method: POST
      path: /v1/admin/policies/g9-pulse/activate
      body: {status: draft}
    want: {status: 200}
  - name: the pulse policy is deleted
    admin:
      method: DELETE
      path: /v1/admin/policies/g9-pulse
    want: {status: 204}
  - name: the admin deletes the gateway role before its server, which would take it along
    admin:
      method: DELETE
      path: /v1/admin/roles/${gatewayRoleId}
    want: {status: 200}
  - name: the admin deletes the app
    admin:
      method: DELETE
      path: /v1/admin/apps/${appId}
    want: {status: 200}
  - name: the admin deletes the first role
    admin:
      method: DELETE
      path: /v1/admin/roles/${roleId}
    want: {status: 200}
  - name: the admin deletes the second role
    admin:
      method: DELETE
      path: /v1/admin/roles/${roleTwoId}
    want: {status: 200}
  - name: the IdM deactivates alice
    scim:
      method: DELETE
      path: /scim/v2/Users/${aliceId}
    want: {status: 204}
  - name: the IdM deactivates bob
    scim:
      method: DELETE
      path: /scim/v2/Users/${bobId}
    want: {status: 204}
  - name: the IdM deactivates carol
    scim:
      method: DELETE
      path: /scim/v2/Users/${carolId}
    want: {status: 204}
  - name: the IdM deactivates dave
    scim:
      method: DELETE
      path: /scim/v2/Users/${daveId}
    want: {status: 204}
