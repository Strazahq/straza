# The rotation rule for the log of the Straza background service, which
# launchd writes from the service's standard error. launchd holds the log
# open for the service, so after a rotation the service writes on into the
# newest archive until its next start. The archives stay uncompressed for
# that reason: compressing one would delete the file the service still
# writes. N sends no signal, because the service keeps no pid file. The new
# log belongs to the service's account, as the one launchd makes does, in
# the folder the account owns, because launchd opens it as that account.
# logfilename                        [owner:group]                    mode count size when flags
/var/log/straza-service/service.log  _straza-service:_straza-service  644  5     1024 *    N
