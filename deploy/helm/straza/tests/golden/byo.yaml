---
# Source: straza/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: straza-straza
  labels:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: straza-1.1.1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
  ports:
    - name: http
      port: 8420
      targetPort: http
---
# Source: straza/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: straza-straza
  labels:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: straza-1.1.1
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: straza
      app.kubernetes.io/instance: straza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straza
        app.kubernetes.io/instance: straza
    spec:
      # strazad's stop waits up to 10 s for requests, then up to 5 s to write
      # the decision records still in memory (5 s more on SQLite behind a
      # lock). A shorter grace kills it first and loses those records.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: strazad
          image: ghcr.io/strazahq/straza:1.1.1
          imagePullPolicy: IfNotPresent
          args: ["serve", "--profile", "enterprise", "--listen", "0.0.0.0:8420"]
          ports:
            - name: http
              containerPort: 8420
          env:
            - name: STRAZA_PROFILE
              value: "enterprise"
            # The session-token issuer + base of every link strazad hands
            # out. Never loopback in k8s: explicit value, else derived
            # (ingress host, else in-cluster Service DNS). Suppressed when
            # configYaml carries server.publicUrl and no chart value
            # overrides it: env beats file, so injecting would clobber it.
            - name: STRAZA_PUBLIC_URL
              value: "https://straza-straza.default.svc:8420"
            - name: STRAZA_STORE_DSN
              valueFrom:
                secretKeyRef:
                  name: straza-db
                  key: STRAZA_STORE_DSN
            - name: STRAZA_STORE_DRIVER
              value: postgres
            - name: STRAZA_EVENTS_URL
              value: "nats://nats.straza.svc:4222"
            - name: STRAZA_OIDC_ISSUER
              value: "https://idp.example.com/realms/prod"
            - name: STRAZA_OIDC_CLIENT_ID
              value: "straza"
            - name: STRAZA_SECRETS_KEK_FILE
              value: /etc/straza/secret.key
            - name: STRAZA_TLS_CERT_FILE
              value: /etc/straza/tls/tls.crt
            - name: STRAZA_TLS_KEY_FILE
              value: /etc/straza/tls/tls.key
            # On by default and visible here. Off renders nothing, so a relay
            # block in configYaml is never clobbered by an env face. The token
            # lives in the emptyDir data dir, so every pod start mints one
            # (values.yaml names the relay's per-address registration limit).
            - name: STRAZA_APPROVAL_PUSH_RELAY_ENABLED
              value: "true"
            - name: STRAZA_APPROVAL_PUSH_RELAY_TOKEN_FILE
              value: /var/lib/straza/push-relay-token
          volumeMounts:
            # Writable data dir (rootfs is read-only): apps dir, and the
            # generated KEK when secrets.kekExistingSecret is unset (that
            # per-pod key is ephemeral; set kekExistingSecret in production).
            - name: data
              mountPath: /var/lib/straza
            - name: kek
              mountPath: /etc/straza/secret.key
              subPath: kek
              readOnly: true
            - name: tls
              mountPath: /etc/straza/tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: http, scheme: HTTPS }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          emptyDir: {}
        - name: kek
          secret:
            secretName: straza-kek
        - name: tls
          secret:
            secretName: straza-tls
