---
# Source: straza/templates/networkpolicy.yaml
# Default-on ingress lockdown for the bundled backends: they are
# cluster-internal and effectively unauthenticated (NATS has no auth at all,
# and any message on a revocation subject is a revocation; Postgres is one
# shared password), so without a policy ANY pod in the cluster can dial
# them. These narrow that to the strazad pods only (straza.selectorLabels,
# same namespace, one service port each). Enforcement is the CNI's job:
# stock k3s enforces via its embedded controller, while flannel-only
# clusters accept the objects and silently ignore them. Bring-your-own
# backends (nats.url / postgres.dsn|existingSecret, or the bundles
# disabled) live outside the cluster, so no policy renders for them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: straza-straza-nats
  labels:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: straza-1.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: straza-nats
      app.kubernetes.io/instance: straza
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: straza
              app.kubernetes.io/instance: straza
      ports: [{ protocol: TCP, port: 4222 }]
---
# Source: straza/templates/networkpolicy.yaml
# Same rationale and CNI caveat as the NATS policy above: only strazad pods
# may dial the bundled Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: straza-straza-postgres
  labels:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: straza-1.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: straza-postgres
      app.kubernetes.io/instance: straza
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: straza
              app.kubernetes.io/instance: straza
      ports: [{ protocol: TCP, port: 5432 }]
---
# Source: straza/templates/nats.yaml
# Bundled in-cluster NATS + JetStream, cluster-internal only, deliberately
# with no external exposure: the
# push channel treats any message on a revocation subject as a revocation
# (spec/events §5), so a public NATS would hand strangers the kill switch.
# Daemons don't need it: they get sub-second push over the gateway-edge SSE
# lane (/v1/push) on the HTTPS origin they already dial.
apiVersion: v1
kind: Service
metadata:
  name: straza-straza-nats
  labels:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: straza-1.1.0
spec:
  selector:
    app.kubernetes.io/name: straza-nats
    app.kubernetes.io/instance: straza
  ports: [{ port: 4222 }]
---
# Source: straza/templates/postgres.yaml
# Bundled single-node in-cluster Postgres, simpler to run than an operator
# such as CNPG at small scale; bring-your-own via postgres.dsn /
# postgres.existingSecret suppresses all of this.
apiVersion: v1
kind: Service
metadata:
  name: straza-straza-postgres
  labels:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: straza-1.1.0
spec:
  selector:
    app.kubernetes.io/name: straza-postgres
    app.kubernetes.io/instance: straza
  ports: [{ port: 5432 }]
---
# Source: straza/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: straza-straza
  labels:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: straza-1.1.0
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
  ports:
    - name: http
      port: 8420
      targetPort: http
---
# Source: straza/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: straza-straza
  labels:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: straza-1.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: straza
      app.kubernetes.io/instance: straza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straza
        app.kubernetes.io/instance: straza
    spec:
      # strazad's stop waits up to 10 s for requests, then up to 5 s to write
      # the decision records still in memory (5 s more on SQLite behind a
      # lock). A shorter grace kills it first and loses those records.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: strazad
          image: ghcr.io/strazahq/straza:1.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--profile", "enterprise", "--listen", "0.0.0.0:8420"]
          ports:
            - name: http
              containerPort: 8420
          env:
            - name: STRAZA_PROFILE
              value: "enterprise"
            # The session-token issuer + base of every link strazad hands
            # out. Never loopback in k8s: explicit value, else derived
            # (ingress host, else in-cluster Service DNS). Suppressed when
            # configYaml carries server.publicUrl and no chart value
            # overrides it: env beats file, so injecting would clobber it.
            - name: STRAZA_PUBLIC_URL
              value: "http://straza-straza.default.svc:8420"
            - name: STRAZA_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: straza-db-password
                  key: password
            # Dependent expansion: the kubelet resolves $(STRAZA_PG_PASSWORD)
            # from the entry above, so the password never lands in a rendered
            # manifest, only in the secret.
            - name: STRAZA_STORE_DSN
              value: postgres://straza:$(STRAZA_PG_PASSWORD)@straza-straza-postgres:5432/straza?sslmode=disable
            - name: STRAZA_STORE_DRIVER
              value: postgres
            - name: STRAZA_EVENTS_URL
              value: "nats://straza-straza-nats:4222"
            - name: STRAZA_OIDC_ISSUER
              value: "https://idp.example.com/realms/prod"
            - name: STRAZA_OIDC_CLIENT_ID
              value: "straza"
            # On by default and visible here. Off renders nothing, so a relay
            # block in configYaml is never clobbered by an env face. The token
            # lives in the emptyDir data dir, so every pod start mints one
            # (values.yaml names the relay's per-address registration limit).
            - name: STRAZA_APPROVAL_PUSH_RELAY_ENABLED
              value: "true"
            - name: STRAZA_APPROVAL_PUSH_RELAY_TOKEN_FILE
              value: /var/lib/straza/push-relay-token
          volumeMounts:
            # Writable data dir (rootfs is read-only): apps dir, and the
            # generated KEK when secrets.kekExistingSecret is unset (that
            # per-pod key is ephemeral; set kekExistingSecret in production).
            - name: data
              mountPath: /var/lib/straza
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          emptyDir: {}
---
# Source: straza/templates/nats.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: straza-straza-nats
  labels:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: straza-1.1.0
spec:
  serviceName: straza-straza-nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: straza-nats
      app.kubernetes.io/instance: straza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straza-nats
        app.kubernetes.io/instance: straza
    spec:
      containers:
        - name: nats
          image: nats:2
          args: ["-js", "-sd", "/data"]
          ports: [{ containerPort: 4222 }]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
# Source: straza/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: straza-straza-postgres
  labels:
    app.kubernetes.io/name: straza
    app.kubernetes.io/instance: straza
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: straza-1.1.0
spec:
  serviceName: straza-straza-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: straza-postgres
      app.kubernetes.io/instance: straza
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straza-postgres
        app.kubernetes.io/instance: straza
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: straza
            - name: POSTGRES_DB
              value: straza
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: straza-db-password, key: password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
