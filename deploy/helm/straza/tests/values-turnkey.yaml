# Golden scenario: turnkey enterprise, stock values plus only what the install
# must name: the OIDC issuer, the KEK Secret the enterprise profile refuses to
# render without, and a pre-created password secret (the generated-password
# path is nondeterministic under `helm template`, covered by a smoke in
# test-render.sh).
oidc:
  issuer: https://idp.example.com/realms/prod
postgres:
  passwordSecret: straza-db-password
secrets:
  kekExistingSecret: straza-kek
