# The helpdesk team's statements, from adaptive-pg-mcp's examples. Each
# entry joins the statement of its name in tickets.sql, with its params in
# $1 order.
version: 1
tools:
  tickets_by_status:
    description: Counts the tickets opened on or after a day, per status. Returns one row per status with its count.
    mode: read
    databases: [helpdesk]
    login: read
    params:
      - name: since
        description: The first day to count, such as 2026-10-01.
        required: true
  close_stale_tickets:
    description: Closes the tickets that have waited in pending for more than a number of days. Returns the id of each ticket it closed, and refuses a call that would close more than 50.
    mode: write
    databases: [helpdesk]
    login: write
    params:
      - name: days
        description: How many days a ticket waits in pending before it closes, from 7 to 90.
        required: true
        minimum: 7
        maximum: 90
    limits: { write_rows: 50 }
