# Straza eval login skin: the front door must not be stock Keycloak.
# Minimal by design: inherit keycloak.v2 wholesale and add one dark
# stylesheet in the console's palette. No FTL overrides, so Keycloak
# upgrades keep working. The values under css/straza.css mirror
# web/ui/src/tokens.css.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/straza.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css
