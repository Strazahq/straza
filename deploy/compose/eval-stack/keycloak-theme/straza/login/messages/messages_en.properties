# Sentence case on the sign-in page, like the rest of the product.
doLogIn=Sign in
# The device page: the person reads these in their own browser tab, so the stock wording about "your device" is wrong. The code came from the console or the terminal.
oauth2DeviceVerificationTitle=Sign in to Straza
verifyOAuth2DeviceUserCode=Enter the code shown in the console or the terminal.
oauth2DeviceVerificationCompleteHeader=Signed in
oauth2DeviceVerificationCompleteMessage=You can close this tab. The console or terminal that showed the code carries on by itself.
oauth2DeviceVerificationFailedHeader=Sign-in did not complete
oauth2DeviceVerificationFailedMessage=Close this tab and start the sign-in again from the console or terminal.
oauth2DeviceInvalidUserCodeMessage=That code is not valid. Check it against the console or terminal and try again.
oauth2DeviceExpiredUserCodeMessage=That code has expired. Start the sign-in again from the console or terminal.
oauth2DeviceConsentDeniedMessage=Sign-in was refused, so nothing was granted.
