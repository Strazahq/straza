# Straza Tier-3 sandbox profile: runnable demo.
#
# Points a governed agent container at an EXISTING strazad (it does not embed
# one, so bring up deploy/compose/ or `strazad serve` yourself):
#
#   export STRAZA_SERVER_URL=http://host.docker.internal:8420   # your strazad
#   docker compose -f deploy/sandbox/compose.yaml up
#
# The agent reaches Straza only through the straza-service container, which
# holds the agent's key, enrollment and sessions under its own account. Enroll
# the agent once through it, as the Hookless processes guide shows.

# The IMAGE removes the ungoverned exec routes; the FLAGS below remove the
# rest. Every one of them is load-bearing; this file is the reference for
# what "the documented sandbox profile" means at runtime:
#
#   read_only            nothing on the rootfs is writable, so the hardening
#                        sweep's file modes cannot be undone from inside and
#                        no new executable can land outside the tmpfs mounts
#   tmpfs ... noexec     the ONLY writable places cannot execve anything, so
#                        write+chmod+run is dead (nosuid/nodev for hygiene)
#   cap_drop ALL         no capability tricks (chown/dac_override/ptrace...)
#   no-new-privileges    setuid/file-caps can never raise privileges (the
#                        image strips setuid bits anyway; belt and braces)
#   pids_limit 256       fork-bomb ceiling, mirrors the oci runtime sandbox
#                        defaults in internal/manager (the house posture)

# Egress lockdown is deliberately NOT expressible as an image property and
# only partially in vanilla compose: the boundary-grade setup is an
# `internal: true` network that contains ONLY this agent, its straza-service
# and your strazad (attach strazad with
# `docker network connect sandbox_straza-only strazad`).
# When strazad runs on the host instead, restrict egress with the host
# firewall (e.g. a DOCKER-USER iptables rule allowing only the strazad
# address:port from this container's subnet). See
# https://docs.straza.ai/guides/govern-an-agent/hookless-processes/.

services:
  agent:
    build: &agent-build
      context: ../..                     # repo root: the shim builds from source
      dockerfile: deploy/sandbox/Dockerfile
      # args:
      #   BASE_IMAGE: python:3.12-slim   # parameterize the agent runtime here
    image: straza/sandbox-agent:dev
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      # HOME holds the shim's journal and error log, never a credential.
      # uid 65532 owns it; noexec always.
      - /home/agent:mode=0700,uid=65532,gid=65532,noexec,nosuid,nodev,size=64m
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
    volumes:
      # the service's socket directory, READ-ONLY: connecting needs no write,
      # and the agent can place nothing there
      - service_socket:/run/straza-service:ro
    depends_on:
      straza-service:
        condition: service_healthy
    environment:
      # cross-checked by the entrypoint against the server the service
      # enrolled this account with (the enrollment is the trust anchor and is
      # never rewritten; a mismatch fails loudly instead of silently
      # re-pointing enforcement)
      STRAZA_SERVER_URL: ${STRAZA_SERVER_URL:-http://host.docker.internal:8420}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach a host-local strazad
    networks: [straza-only]
    stdin_open: true
    tty: true
    # Replace with your agent process; the default drops into a governed
    # Python REPL where every exec route is a Straza decision.
    command: ["python3"]

  straza-service:
    # The Straza background service for the agent: the same image and binary,
    # run as `straza service` under straza-service (uid 64000), which the
    # agent never uses. It alone mounts the state volume with the agent's
    # key, enrollment, snapshot and audit spool, keeps every session in
    # memory, and carries governance to strazad. The agent shares only the
    # socket directory, so the kernel names the agent's uid on every call
    # and nothing the agent runs can read the key. STRAZA_HOME stays unset,
    # so the service uses the system paths /run/straza-service/service.sock
    # and /var/lib/straza-service.
    build: *agent-build
    user: "64000:64000"
    entrypoint: ["/opt/straza/bin/straza", "service"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=16m
    volumes:
      - service_socket:/run/straza-service
      - service_state:/var/lib/straza-service
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach a host-local strazad
    networks: [straza-only]
    healthcheck:
      # healthy once the service accepts a connection on its socket
      test: ["CMD", "python3", "-c", "import socket; socket.socket(socket.AF_UNIX).connect('/run/straza-service/service.sock')"]
      interval: 30s
      retries: 3
      start_period: 60s
      start_interval: 1s

volumes:
  service_socket: # the socket directory the agent and its service share
  service_state: # the service's key, enrollment and audit spool; never the agent's

networks:
  straza-only:
    driver: bridge
    # Boundary-grade egress: flip to `internal: true` and attach your strazad
    # container to this network, and then the agent can reach strazad and
    # NOTHING else. Left routable by default so the host-gateway demo works.
    # internal: true
