baseURL = "https://docs.straza.ai/"
title = "Straza docs"
locale = "en"

# One build serves both the demo stack at :8400/docs/ and the domain root:
# every link and asset path is rewritten relative to the page.
relativeURLs = true
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term", "rss"]

[markup.goldmark.renderer]
# Raw HTML and HTML comments pass through; tools/site-publish.py strips the
# comments and scans the output before anything is served.
unsafe = true

[markup.goldmark.parser]
autoHeadingID = true
# A standalone image renders as a figure through the image render hook, and a
# figure must not sit inside a paragraph.
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.parser.attribute]
title = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[outputFormats.searchindex]
mediaType = "application/json"
baseName = "index"
isPlainText = true
notAlternative = true

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputs]
home = ["html", "searchindex", "llms"]

# The writing rules allow no en or em dash, so the typographer keeps a written
# "--" or "---" as typed. Curly quotes stay on.
[markup.goldmark.extensions.typographer]
enDash = "--"
emDash = "---"

# version is the Straza release these docs describe, the appVersion in
# deploy/helm/straza/Chart.yaml. The footer prints it on every page.
[params]
version = "1.1.1"
