baseURL = "https://docs.straza.ai/"
title = "Straza docs"
locale = "en"

# One build serves both the demo stack at :8400/docs/ and the domain root:
# every link and asset path is rewritten relative to the page.
relativeURLs = true
disableHugoGeneratorInject = true
# Git dates are not enabled here. The Pages workflow builds with
# --enableGitInfo on a full clone, so each page's lastmod and its sitemap
# <lastmod> come from the last commit that changed it. The eval stack mounts
# website/ without the repository's .git, and Hugo with Git info on refuses
# to build there.
disableKinds = ["taxonomy", "term", "rss"]

[markup.goldmark.renderer]
# Raw HTML and HTML comments pass through; tools/site-publish.py strips the
# comments and scans the output before anything is served.
unsafe = true

[markup.goldmark.parser]
autoHeadingID = true
# A standalone image renders as a figure through the image render hook, and a
# figure must not sit inside a paragraph.
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.parser.attribute]
title = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[outputFormats.searchindex]
mediaType = "application/json"
baseName = "index"
isPlainText = true
notAlternative = true

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

# markdown is each page's copy for agents, served at its address plus
# index.md and linked from the page head and from llms.txt, so an agent reads
# the docs without the markup. tools/site-publish.py refuses a page without one.
# Every shortcode has a Markdown form beside its HTML one.
[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true

[outputs]
home = ["html", "searchindex", "llms", "markdown"]
page = ["html", "markdown"]
section = ["html", "markdown"]

# The writing rules allow no en or em dash, so the typographer keeps a written
# "--" or "---" as typed. Curly quotes stay on.
[markup.goldmark.extensions.typographer]
enDash = "--"
emDash = "---"

# version is the Straza release these docs describe, the appVersion in
# deploy/helm/straza/Chart.yaml. The footer prints it on every page.
[params]
version = "2.0.1"
