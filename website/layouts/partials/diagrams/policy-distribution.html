<svg class="dg" viewBox="0 0 900 300" role="img" aria-labelledby="dg-policy-distribution-t" data-say='["How a policy reaches every machine. Press a step to follow it.", "1. An admin activates a PolicySet, in the console or with strazactl policy activate.", "2. strazad compiles every active set into one snapshot and signs it.", "3. Each client fetches the snapshot and checks the signature against the keys it pinned when the machine enrolled.", "4. Only a verified snapshot is used. Every decision on that machine is made from it, with no network call.", "5. If the check fails, the client keeps its last verified snapshot until its session time runs out, and then it denies."]'>
<title id="dg-policy-distribution-t">An admin activates a PolicySet. strazad compiles every active set into one signed snapshot. Each client checks the signature against the keys it pinned at enrollment and decides locally from the verified copy. If the check fails, the client keeps its last verified copy until its session time runs out, then denies.</title>
<defs><marker id="ah-policy-distribution" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs>

<g data-s="2"><rect class="box" x="210" y="30" width="220" height="104" rx="6"/><text class="t" x="226" y="62">strazad</text><text class="s" x="226" y="86">compiles active sets</text><text class="s" x="226" y="106">into one signed</text><text class="s" x="226" y="126">snapshot</text></g>
<g data-s="3"><rect class="box" x="470" y="30" width="220" height="104" rx="6"/><text class="t" x="486" y="62">Each client</text><text class="s" x="486" y="86">fetches the snapshot</text><text class="s" x="486" y="106">and checks it against</text><text class="s" x="486" y="126">its pinned keys</text></g>
<g data-s="4"><rect class="box okbg ok" x="730" y="30" width="160" height="104" rx="6"/><text class="t" x="746" y="62">Decides locally</text><text class="s" x="746" y="86">from the verified</text><text class="s" x="746" y="106">copy</text></g>
