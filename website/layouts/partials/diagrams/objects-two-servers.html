<svg class="dg" viewBox="0 0 900 354" role="img" aria-labelledby="dg-objects-two-servers-t" data-say='["Two servers, one idea. The wiki server is invented for this page. postgres runs adaptive-pg-mcp on the demo stack with the profile pg. Press a step.", "1. Each server declares one object type, and which argument of each tool names one object.", "2. Straza calls each server&#39;s list tool itself, with a credential it keeps for that call alone, and keeps the list.", "3. A role covers every object, or only the objects it names.", "4. The gateway checks the object a call names. A call on an object that no role of the caller covers is refused before any policy rule."]'>
