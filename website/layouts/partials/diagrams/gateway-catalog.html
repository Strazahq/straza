<svg class="dg" viewBox="0 0 900 330" role="img" aria-labelledby="dg-gateway-catalog-t" data-say='["How the gateway decides which tools a session sees. Press a step to follow it.", "1. Three lists go in: the tools the server lists now, the manifest&#39;s exposure, and the access rows of the session&#39;s roles.", "2. Only a tool in all three becomes a candidate.", "3. Policy runs for the session. A tool a rule denies is hidden. A tool that needs a person stays and asks for a reason.", "4. What is left is the tools list the agent sees. A hidden tool and an unknown tool give the same error.", "5. When the agent calls a tool, the gateway adds the stored credential. The agent never sees it."]'>
<title id="dg-gateway-catalog-t">The server's tools, the manifest's exposure and the role's access rows meet. Tools in all three are candidates. Policy hides denied tools. What is left is the tools list. At call time the gateway adds the credential, which the agent never sees.</title>
