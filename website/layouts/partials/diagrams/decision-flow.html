<svg class="dg" viewBox="0 0 900 330" role="img" aria-labelledby="dg-decision-flow-t" data-say='["The whole path of one tool call. Press a step to follow it.", "1. Claude Code wants to run rm -rf /tmp/x. Before it runs anything, it hands the call to the straza hook.", "2. The hook runs on the same machine. It turns Claude Code&#39;s event into the one shape every harness shares.", "3. The hook checks the call against the signed policy it already holds. No network call is needed.", "4. The winning rule decides: allow, deny with a reason, or ask a person. Here the starter policy denies it.", "5. After the decision, the record goes to the audit chain on the server. The call never waits for it."]'>
