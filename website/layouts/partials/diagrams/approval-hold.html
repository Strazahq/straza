<svg class="dg" viewBox="0 0 900 320" role="img" aria-labelledby="dg-approval-hold-t" data-say='["A rule that asks a person, on the two paths a call can take. Press a step to follow both.", "1. The agent calls a tool. On the gateway it also states why, in a required justification field.", "2. The rule says a person decides. The gateway keeps the call open, 90 seconds by default. The hook answers at once with a deny and a reference.", "3. The agent&#39;s sponsor, or a holder of an approver role the rule names, decides in the console, on a phone, on the self-service page or in Slack.", "4. Approved: the held gateway call goes on to the MCP server. The hook&#39;s retry of the exact same call passes once, within 60 seconds by default."]'>
<title id="dg-approval-hold-t">On the gateway a held call stays open while a person decides, 90 seconds by default, and goes on when approved. In a hook the first call is denied with a reference, and the retry of the same call passes once after approval.</title>

<text class="lab" x="10" y="22">On the gateway</text>
<text class="lab" x="10" y="192">In a hook</text>
<g data-s="1"><rect class="box" x="10" y="32" width="170" height="96" rx="6"/><text class="t" x="26" y="62">The agent calls</text><text class="s" x="26" y="86">an MCP tool and</text><text class="s" x="26" y="106">says why</text><rect class="box" x="10" y="202" width="170" height="96" rx="6"/><text class="t" x="26" y="232">The agent runs</text><text class="s" x="26" y="256">a local tool</text><text class="s" x="26" y="276">through the hook</text></g>
<g data-s="2"><rect class="box wabg wa" x="220" y="32" width="200" height="96" rx="6"/><text class="t" x="236" y="62">Held</text><text class="s" x="236" y="86">the call stays open,</text><text class="s" x="236" y="106">90 s by default</text><rect class="box nobg no" x="220" y="202" width="200" height="96" rx="6"/><text class="t" x="236" y="232">Denied for now</text><text class="s" x="236" y="256">with a reference,</text><text class="s" x="236" y="276">retry after approval</text></g>
<g data-s="3"><rect class="box" x="460" y="32" width="200" height="96" rx="6"/><text class="t" x="476" y="62">A person decides</text><text class="s" x="476" y="86">the sponsor or an</text><text class="s" x="476" y="106">approver role</text><rect class="box" x="460" y="202" width="200" height="96" rx="6"/><text class="t" x="476" y="232">A person decides</text><text class="s" x="476" y="256">on the same</text><text class="s" x="476" y="276">channels</text></g>
<g data-s="4"><rect class="box okbg ok" x="700" y="32" width="190" height="96" rx="6"/><text class="t" x="716" y="62">The call runs</text><text class="s" x="716" y="86">it goes on to the</text><text class="s" x="716" y="106">MCP server</text><rect class="box okbg ok" x="700" y="202" width="190" height="96" rx="6"/><text class="t" x="716" y="232">The retry passes</text><text class="s" x="716" y="256">once, for the</text><text class="s" x="716" y="276">same call</text></g>
