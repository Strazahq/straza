<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d" xml:space="preserve"><title id="t">How one MCP call waits for approval</title><desc id="d">The agent calls a tool through the strazad gateway. A mode: approve rule makes the call wait, and the gateway holds the upstream call. Straza sends the request to the approver's phone, where the approver reviews a preview of the call and approves it. The device key signs the decision. strazad verifies the signature and the approver's role as it stands at that moment, then forwards the call with the credential injected at the gateway. The result returns to the agent and the decision is appended to the hash chain. If nobody decides before the deadline, the call is denied with a reason the agent can read, and the expiry is recorded too.</desc><style>text{white-space:pre}</style><rect x=".5" y=".5" width="759" height="519" rx="14" fill="#f6f8fb" stroke="#d3dae6"/><rect x="18" y="18" width="124" height="44" rx="9" fill="#ffffff" stroke="#d3dae6"/><text x="80" y="37" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#141a24" text-anchor="middle">Agent</text><text x="80" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#55616f" text-anchor="middle">any MCP client</text><path d="M80 62V420" stroke="#b9c3d3" stroke-width="1.2" stroke-dasharray="2 4"/><rect x="174" y="18" width="124" height="44" rx="9" fill="#ffffff" stroke="#d3dae6"/><text x="236" y="37" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#141a24" text-anchor="middle">strazad</text><text x="236" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#55616f" text-anchor="middle">gateway and policy</text><path d="M236 62V420" stroke="#b9c3d3" stroke-width="1.2" stroke-dasharray="2 4"/><rect x="338" y="18" width="124" height="44" rx="9" fill="#ffffff" stroke="#d3dae6"/><text x="400" y="37" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#141a24" text-anchor="middle">Approver's phone</text><text x="400" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#55616f" text-anchor="middle">Straza approver app</text><path d="M400 62V420" stroke="#b9c3d3" stroke-width="1.2" stroke-dasharray="2 4"/><rect x="486" y="18" width="124" height="44" rx="9" fill="#ffffff" stroke="#d3dae6"/><text x="548" y="37" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#141a24" text-anchor="middle">MCP server</text><text x="548" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#55616f" text-anchor="middle">upstream tool</text><path d="M548 62V420" stroke="#b9c3d3" stroke-width="1.2" stroke-dasharray="2 4"/><rect x="626" y="18" width="124" height="44" rx="9" fill="#ffffff" stroke="#d3dae6"/><text x="688" y="37" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#141a24" text-anchor="middle">Audit</text><text x="688" y="53" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#55616f" text-anchor="middle">hash chain</text><path d="M688 62V420" stroke="#b9c3d3" stroke-width="1.2" stroke-dasharray="2 4"/><rect x="76" y="104" width="8" height="262" rx="3" fill="#8a5300" opacity=".35"/><rect x="232" y="112" width="8" height="178" rx="3" fill="#8a5300" opacity=".35"/><path d="M86 96L230 96" stroke="#141a24" stroke-width="1.6" fill="none"/><path d="M222.8 99.5L230 96L222.8 92.5" stroke="#141a24" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="89.0" y="75" width="138" height="16" fill="#f6f8fb"/><text x="158.0" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#141a24" text-anchor="middle">tools/call get-sum</text><path d="M244 124h24v14h-22" fill="none" stroke="#8a5300" stroke-width="1.5"/><path d="M252 133l-6 5 6 5" fill="none" stroke="#8a5300" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="276" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#8a5300" text-anchor="start">rule matches: mode: approve</text><path d="M242 164L394 164" stroke="#141a24" stroke-width="1.6" fill="none"/><path d="M386.8 167.5L394 164L386.8 160.5" stroke="#141a24" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="242.0" y="143" width="152" height="16" fill="#f6f8fb"/><text x="318.0" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#141a24" text-anchor="middle">request to the phone</text><path d="M408 192h24v14h-22" fill="none" stroke="#141a24" stroke-width="1.5"/><path d="M416 201l-6 5 6 5" fill="none" stroke="#141a24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="203" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#141a24" text-anchor="start">approver reviews the call</text><path d="M394 232L242 232" stroke="#116329" stroke-width="1.6" fill="none"/><path d="M249.2 228.5L242 232L249.2 235.5" stroke="#116329" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="242.0" y="211" width="152" height="16" fill="#f6f8fb"/><text x="318.0" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#116329" text-anchor="middle">approved, key-signed</text><path d="M244 260h24v14h-22" fill="none" stroke="#141a24" stroke-width="1.5"/><path d="M252 269l-6 5 6 5" fill="none" stroke="#141a24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="276" y="271" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#141a24" text-anchor="start">check signature and current role</text><path d="M242 300L542 300" stroke="#116329" stroke-width="1.6" fill="none"/><path d="M534.8 303.5L542 300L534.8 296.5" stroke="#116329" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="281.0" y="279" width="222" height="16" fill="#f6f8fb"/><text x="392.0" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#116329" text-anchor="middle">call runs, credential injected</text><path d="M542 334L242 334" stroke="#141a24" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/><path d="M249.2 330.5L242 334L249.2 337.5" stroke="#141a24" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="365.0" y="313" width="54" height="16" fill="#f6f8fb"/><text x="392.0" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#141a24" text-anchor="middle">result</text><path d="M230 368L86 368" stroke="#141a24" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/><path d="M93.2 364.5L86 368L93.2 371.5" stroke="#141a24" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="131.0" y="347" width="54" height="16" fill="#f6f8fb"/><text x="158.0" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#141a24" text-anchor="middle">result</text><path d="M242 402L682 402" stroke="#55616f" stroke-width="1.6" fill="none"/><path d="M674.8 405.5L682 402L674.8 398.5" stroke="#55616f" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="396.5" y="381" width="131" height="16" fill="#f6f8fb"/><text x="462.0" y="394" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#55616f" text-anchor="middle">decision appended</text><rect x="138" y="188" width="84" height="20" rx="10" fill="#fbecd0"/><rect x="147.0" y="194.7" width="1.92" height="6.6000000000000005" rx=".8" fill="#8a5300"/><rect x="151.08" y="194.7" width="1.92" height="6.6000000000000005" rx=".8" fill="#8a5300"/><text x="160" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#8a5300" text-anchor="start" letter-spacing=".8">WAITING</text><text x="90" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#8a5300" text-anchor="start">waits</text><rect x="16" y="428" width="728" height="76" rx="10" fill="#fbe0de" fill-opacity=".55" stroke="#b42318" stroke-opacity=".5" stroke-dasharray="5 4"/><rect x="28" y="440" width="70" height="20" rx="10" fill="#fbe0de"/><path d="M38.7 446.7L45.3 453.3M45.3 446.7L38.7 453.3" stroke="#b42318" stroke-width="2" stroke-linecap="round"/><text x="52" y="454" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#b42318" text-anchor="start" letter-spacing=".8">DENY</text><text x="110" y="455" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#141a24" text-anchor="start">Nobody decides before the deadline: the call is denied.</text><text x="110" y="477" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#55616f" text-anchor="start">The agent receives the deny with its reason, and the expiry is</text><text x="110" y="497" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#55616f" text-anchor="start">recorded on the same hash chain as every other decision.</text></svg>
