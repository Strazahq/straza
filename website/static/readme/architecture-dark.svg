<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d" xml:space="preserve"><title id="t">Where Straza sits between identity, agents and tools</title><desc id="d">People, AI agents and roles arrive from the identity manager over SCIM 2.0, and people sign in through the identity provider over OIDC. Agents on a machine are decided locally by straza against a signed snapshot. MCP clients reach tools only through the strazad gateway. strazad sends calls that need approval to approvers, injects credentials toward MCP servers, and streams the hash-chained audit record to a SIEM. Each decision is allowed, denied with a reason, or needs approval from a person.</desc><style>text{white-space:pre}</style><rect x=".5" y=".5" width="759" height="499" rx="14" fill="#0a0e16" stroke="#222b3b"/><text x="250" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#8b98ae" text-anchor="start" letter-spacing=".6">IDENTITY IN</text><rect x="250" y="40" width="170" height="50" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="262" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">Identity manager</text><text x="262" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">SCIM 2.0, such as midPoint</text><rect x="434" y="40" width="170" height="50" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="446" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">Identity provider</text><text x="446" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">OIDC sign-in</text><text x="16" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#8b98ae" text-anchor="start" letter-spacing=".6">WHERE AGENTS RUN</text><rect x="16" y="138" width="184" height="50" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="28" y="159" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">Claude Code, Codex,</text><text x="28" y="177" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">Gemini CLI: hooks</text><rect x="16" y="198" width="184" height="50" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="28" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">Python agents</text><text x="28" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">agent kit</text><rect x="16" y="258" width="184" height="50" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="28" y="279" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">No hook surface</text><text x="28" y="297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">straza exec</text><rect x="16" y="352" width="184" height="50" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="28" y="373" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">Any MCP client</text><text x="28" y="391" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">one /mcp endpoint</text><rect x="236" y="150" width="150" height="146" rx="9" fill="#141b27" stroke="#dce4f0" stroke-opacity="0.55"/><text x="248" y="171" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">straza</text><text x="248" y="189" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">beside the agent,</text><text x="248" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">decides each action</text><text x="248" y="221" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">against the signed</text><text x="248" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">snapshot it verified</text><text x="248" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start"></text><text x="248" y="269" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">no network call in</text><text x="248" y="285" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">the common case</text><path d="M200 163L234 180" stroke="#dce4f0" stroke-width="1.6" fill="none"/><path d="M226.0 179.9L234 180L229.1 173.7" stroke="#dce4f0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 223L234 223" stroke="#dce4f0" stroke-width="1.6" fill="none"/><path d="M226.8 226.5L234 223L226.8 219.5" stroke="#dce4f0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 283L234 266" stroke="#dce4f0" stroke-width="1.6" fill="none"/><path d="M229.1 272.3L234 266L226.0 266.1" stroke="#dce4f0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="422" y="108" width="174" height="312" rx="12" fill="none" stroke="#dce4f0" stroke-opacity=".55"/><text x="434" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" font-weight="700" fill="#dce4f0" text-anchor="start">strazad</text><text x="434" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">the server you operate</text><rect x="432" y="160" width="154" height="56" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="444" y="181" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">Policy</text><text x="444" y="199" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">signed snapshots</text><rect x="432" y="224" width="154" height="56" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="444" y="245" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">Approvals</text><text x="444" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">mode: approve</text><rect x="432" y="288" width="154" height="56" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="444" y="309" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">Audit</text><text x="444" y="327" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">SHA-256 hash chain</text><rect x="432" y="352" width="154" height="56" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="444" y="373" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">MCP gateway</text><text x="444" y="391" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8b98ae" text-anchor="start">default-deny catalog</text><path d="M335 90V99H466" fill="none" stroke="#8b98ae" stroke-width="1.6"/><path d="M466 98L466 106" stroke="#8b98ae" stroke-width="1.6" fill="none"/><path d="M462.5 98.8L466 106L469.5 98.8" stroke="#8b98ae" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M509 90L509 106" stroke="#8b98ae" stroke-width="1.6" fill="none"/><path d="M505.5 98.8L509 106L512.5 98.8" stroke="#8b98ae" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 188L388 188" stroke="#8b98ae" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/><path d="M395.2 184.5L388 188L395.2 191.5" stroke="#8b98ae" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 377L430 377" stroke="#dce4f0" stroke-width="1.6" fill="none"/><path d="M422.8 380.5L430 377L422.8 373.5" stroke="#dce4f0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M388 252L430 252" stroke="#8b98ae" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/><path d="M422.8 255.5L430 252L422.8 248.5" stroke="#8b98ae" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M388 290L430 306" stroke="#8b98ae" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/><path d="M422.0 306.7L430 306L424.5 300.2" stroke="#8b98ae" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="628" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#8b98ae" text-anchor="start" letter-spacing=".6">OUT</text><rect x="628" y="224" width="116" height="56" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="640" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">Approvers</text><text x="640" y="259" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b98ae" text-anchor="start">phone, console,</text><text x="640" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b98ae" text-anchor="start">Slack, CLI</text><path d="M588 252L626 252" stroke="#dce4f0" stroke-width="1.6" fill="none"/><path d="M618.8 255.5L626 252L618.8 248.5" stroke="#dce4f0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="628" y="288" width="116" height="56" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="640" y="307" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">SIEM</text><text x="640" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b98ae" text-anchor="start">webhook or</text><text x="640" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b98ae" text-anchor="start">file sink</text><path d="M588 316L626 316" stroke="#dce4f0" stroke-width="1.6" fill="none"/><path d="M618.8 319.5L626 316L618.8 312.5" stroke="#dce4f0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="628" y="352" width="116" height="56" rx="9" fill="#141b27" stroke="#222b3b" stroke-opacity="1"/><text x="640" y="371" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#dce4f0" text-anchor="start">MCP servers</text><text x="640" y="387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b98ae" text-anchor="start">credentials</text><text x="640" y="401" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8b98ae" text-anchor="start">injected here</text><path d="M588 380L626 380" stroke="#dce4f0" stroke-width="1.6" fill="none"/><path d="M618.8 383.5L626 380L618.8 376.5" stroke="#dce4f0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 436H744" stroke="#222b3b"/><rect x="16" y="450