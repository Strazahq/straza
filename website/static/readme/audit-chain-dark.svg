<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" xml:space="preserve"><title id="t">Tamper-evident audit: one edited record breaks the chain</title><desc id="d">Five audit records from a standalone strazad, each showing its sequence number, its decision, and the first characters of its prev_hash and its SHA-256 hash, where each prev_hash equals the hash before it. strazactl audit verify prints: audit chain intact: 5 records verified. Then record 3 is edited in the database from deny to allow. Its recomputed hash, 819c1492e2, no longer matches the stored b3ebc86466, so the chain breaks there and nothing after it verifies. strazactl audit verify fails with: audit chain BROKEN at seq 3 (0 records checked).</desc><style>text{white-space:pre}@keyframes k-lnk1{0.00%{opacity:0}2.50%{opacity:0}4.38%{opacity:1}96.88%{opacity:1}98.75%{opacity:0}100.00%{opacity:0}}
